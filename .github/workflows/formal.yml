# Formal verification: the Lean models build, contain no gaps, depend only on
# the allowed axioms, and are flagged when code they cover changes without them.
# Installed by the dev module's /verify; the checker is vendored in the project.
name: Formal verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formal:
    name: Lean models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .datacore/specs/datacore-lean/.lake
          key: lean-${{ hashFiles('.datacore/specs/datacore-lean/lean-toolchain', '.datacore/specs/datacore-lean/lakefile.toml') }}-${{ hashFiles('.datacore/specs/datacore-lean/**/*.lean') }}
          restore-keys: lean-${{ hashFiles('.datacore/specs/datacore-lean/lean-toolchain', '.datacore/specs/datacore-lean/lakefile.toml') }}-
      - name: Check models
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ARGS=""
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then ARGS="--base $BASE"; fi
          python3 .datacore/specs/datacore-lean/formal_check.py --project .datacore/specs/datacore-lean $ARGS
