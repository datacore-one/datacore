# Validate PR — DIP-0001 Contribution Pipeline
#
# Layer 1: Privacy validation (blocking)
# Layer 2: Structural validation — tags, modules (blocking)
# Layer 3: Deep review via pr_review.py (on label, advisory)

name: Validate PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

jobs:
  # ── Layer 1: Privacy & Context Validation ──────────────────────
  validate-layers:
    name: Validate PUBLIC Layers
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name != 'ready-for-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate .base.md layers for private content
        run: python .datacore/lib/git_privacy.py --revision HEAD

  # ── Layer 1b: The gates that must never be red ─────────────────
  # CI RAN NO TESTS AT ALL until 2026-09-09. Four workflows, every one of them
  # validating boundaries, layers or tags -- so "checks passed" never meant a
  # test had run, and a gate could sit red indefinitely with nobody told.
  #
  # It did. `test_hook_commands_resolve.py` exists precisely to catch a hook
  # registered in settings whose script is not present, and it was failing on
  # `command_receipt.py` and `command_suggest.py` -- both committed only on the
  # unmerged branch `feat/command-discoverability`, while the registration in
  # `.claude/settings.json` is not branch-scoped and so applied everywhere. A
  # UserPromptSubmit hook that cannot start blocks EVERY prompt, so a file
  # missing from one branch became a total lockout on all of them.
  #
  # Deliberately NOT the whole suite yet: several suites carry known failures
  # that predate this, and turning them all on at once would make every PR red
  # and teach everyone to ignore the signal -- which is the same disease. This
  # runs the gates whose whole purpose is to fail loudly, and more move here as
  # they are made green.
  validate-gates:
    name: Gates
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name != 'ready-for-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install --only-binary=":all:" -r .datacore/lib/requirements-audit.txt

      - name: Install native OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Every registered hook resolves to a file that exists
        run: python -m pytest -q .datacore/tests/test_hook_commands_resolve.py

      - name: Security and data-preservation invariants
        env:
          DATACORE_ROOT: ${{ github.workspace }}
          DATACORE_STATE: ${{ runner.temp }}/datacore-audit-state
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            .datacore/lib/tests/test_persistence_adversarial.py \
            .datacore/lib/tests/test_file_utils.py \
            .datacore/lib/tests/test_markdown_sections.py \
            .datacore/lib/tests/test_journal_store.py \
            .datacore/lib/tests/test_org_transactions.py \
            .datacore/lib/tests/test_archive_preservation.py \
            .datacore/lib/tests/test_closed_archive_safety.py \
            .datacore/lib/tests/test_decision_board_safety.py \
            .datacore/lib/tests/test_git_fleet_sync_size_guard.py \
            .datacore/lib/tests/test_tracked_derived_safety.py \
            .datacore/lib/tests/test_ledger_health.py \
            .datacore/lib/tests/test_space_catalog.py \
            .datacore/lib/tests/test_module_data_migrate.py \
            .datacore/lib/tests/test_module_context.py \
            .datacore/lib/tests/test_workflow_state_preservation.py \
            .datacore/lib/tests/test_hygiene_output_contract.py \
            .datacore/lib/tests/test_writeback_preservation.py \
            .datacore/lib/tests/test_conflict_preservation.py \
            .datacore/lib/tests/test_credential_preservation.py \
            .datacore/lib/tests/test_env_configuration.py \
            .datacore/lib/tests/test_ledger_ingest_org.py \
            .datacore/lib/tests/test_ledger_transport.py \
            .datacore/lib/tests/test_transport_lock_safety.py \
            .datacore/lib/tests/test_transport_foreign_writer.py \
            .datacore/lib/tests/test_git_privacy.py \
            .datacore/lib/tests/test_git_preservation.py \
            .datacore/lib/tests/test_publication_moves.py \
            .datacore/lib/tests/test_publication_status_paths.py \
            .datacore/lib/tests/test_publication_ref_scope.py \
            .datacore/lib/tests/test_unmerged_publication.py \
            .datacore/lib/tests/test_identity_verification.py \
            .datacore/lib/tests/test_ledger_publish_safe.py \
            .datacore/tests/test_knowledge_commit.py \
            .datacore/lib/tests/test_knowledge_path_classification.py \
            .datacore/tests/test_agent_wrap_up.py \
            .datacore/modules/research/lib/tests/test_queue_drain.py \
            .datacore/lib/tests/test_http_receivers.py \
            .datacore/lib/tests/test_http_boundary_siblings.py \
            .datacore/lib/tests/test_hook_privacy_state.py \
            .datacore/lib/tests/test_observation_privacy.py \
            .datacore/lib/tests/test_plur_hook_boundaries.py \
            .datacore/lib/tests/test_plur_cli_selection.py \
            .datacore/lib/tests/test_public_download.py \
            .datacore/lib/tests/test_download_deadlines.py \
            .datacore/lib/tests/test_public_post_tls.py \
            .datacore/lib/tests/test_speech_transport.py \
            .datacore/lib/tests/test_execution_controls.py \
            .datacore/modules/voice-terminal/tests/test_llm_fallback.py \
            .datacore/lib/tests/test_command_receipt.py \
            .datacore/lib/tests/test_receipt_preservation.py \
            .datacore/lib/tests/test_ocr_limits.py \
            .datacore/lib/tests/test_native_ocr_preservation.py \
            .datacore/lib/tests/test_agent_stream_store.py \
            .datacore/lib/tests/test_stream_tail_preservation.py \
            .datacore/lib/tests/test_ledger_keys.py \
            .datacore/lib/tests/test_policy_adversarial.py \
            .datacore/lib/tests/test_ledger_policy.py \
            .datacore/lib/tests/test_actor_identity.py \
            .datacore/lib/tests/test_seal_preservation.py \
            .datacore/lib/tests/test_executor_isolation.py \
            .datacore/lib/tests/test_runtime_context.py \
            .datacore/lib/tests/test_mcp_stdio.py \
            .datacore/lib/tests/test_hermes_runtime.py \
            .datacore/lib/tests/test_node_runtime.py \
            .datacore/lib/tests/test_process_lifecycle.py \
            .datacore/lib/tests/test_hermes_plugin.py \
            .datacore/lib/tests/test_hermes_dispatch.py \
            .datacore/lib/tests/test_hermes_source_binding.py \
            .datacore/lib/tests/test_python_source_binding.py \
            .datacore/lib/tests/test_intent_review_privacy.py \
            .datacore/lib/tests/test_priority_score.py \
            .datacore/lib/tests/test_intent_input_integrity.py \
            .datacore/lib/tests/test_intent_evidence.py \
            .datacore/lib/tests/test_bounded_read_integrity.py \
            .datacore/lib/tests/test_bounded_write_integrity.py \
            .datacore/lib/tests/test_delegation_receipt.py \
            .datacore/lib/tests/test_delegation_requirements.py \
            .datacore/lib/tests/test_private_state_boundary.py \
            .datacore/lib/tests/test_jobs_manifest.py \
            .datacore/lib/tests/test_jobs_run_contract.py \
            .datacore/tests/test_principal_email_hashes.py \
            .datacore/lib/tests/test_artifact_verification.py \
            .datacore/lib/tests/test_ledger_execution_admission.py \
            .datacore/lib/tests/test_agent_workspace.py \
            .datacore/lib/tests/test_catalog_identity.py \
            .datacore/lib/tests/test_sync_safety.py \
            .datacore/lib/tests/test_calendar_safety.py \
            .datacore/lib/tests/test_classification_preservation.py \
            .datacore/lib/tests/test_text_model.py \
            .datacore/lib/tests/test_host_deps.py \
            .datacore/lib/tests/test_attestation_consumers.py \
            .datacore/lib/tests/test_cron_install.py \
            .datacore/lib/tests/test_phase1_cycle_safety.py \
            .datacore/lib/tests/test_scheduled_runtime_boundaries.py \
            .datacore/lib/tests/test_projection_reconciliation.py \
            .datacore/lib/tests/test_projection_replay.py \
            .datacore/lib/tests/test_ledger_done_archive.py \
            .datacore/lib/tests/test_replicated_edits.py \
            .datacore/lib/tests/test_ledger_migration.py \
            .datacore/lib/tests/test_ledger_phase1_tools.py \
            .datacore/lib/tests/test_ledger_checkpoint.py \
            .datacore/lib/tests/test_org_workspace_adapter.py \
            .datacore/lib/tests/test_org_ledger_roundtrip.py \
            .datacore/lib/tests/test_org_space.py
          python -m pytest -q \
            .datacore/lib/tests/test_hooks.py \
            .datacore/tests/test_org_parser.py \
            .datacore/tests/test_spaces.py \
            .datacore/tests/test_youtube_transcript.py
          ruff check --select F821,F822,F823,E9 .datacore

  runtime-profile:
    name: Runtime profile (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated locked runtime and native OCR tools
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
          python -m venv "$RUNNER_TEMP/datacore-runtime"
          "$RUNNER_TEMP/datacore-runtime/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r .datacore/lib/requirements-runtime.txt
          "$RUNNER_TEMP/datacore-runtime/bin/python" -m pip check
      - name: Start, exercise and restart the installed runtime
        run: '"$RUNNER_TEMP/datacore-runtime/bin/python" .datacore/lib/runtime_smoke.py'
      - name: Verify the minimal MCP helper runtime
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/datacore-mcp-runtime"
          python -m pip --isolated --python "$RUNNER_TEMP/datacore-mcp-runtime/bin/python" install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r .datacore/lib/requirements-mcp.txt
          python -m pip --isolated --python "$RUNNER_TEMP/datacore-mcp-runtime/bin/python" check
          "$RUNNER_TEMP/datacore-mcp-runtime/bin/python" -I .datacore/lib/mcp_runtime_smoke.py


  # ── Layer 2: Structural Validation ─────────────────────────────
  validate-tags:
    name: Validate Tags
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name != 'ready-for-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate tags
        run: |
          if [ -f .datacore/lib/tag_validator.py ]; then
            python .datacore/lib/tag_validator.py --data-dir .
          else
            echo "tag_validator.py not found, skipping"
          fi

  validate-modules:
    name: Validate Changed Modules
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name != 'ready-for-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect changed modules and validate
        run: |
          python - <<'PYCODE'
          import os
          import subprocess
          import sys
          paths = subprocess.check_output([
              "git", "diff", "--name-only", "--diff-filter=ACMR", "-z", "origin/main...HEAD"
          ]).split(b"\0")
          modules = [os.fsdecode(path) for path in paths if path.startswith(b".datacore/modules/")
                     and path.endswith(b"/module.yaml")]
          for path in modules:
              subprocess.run([sys.executable, ".datacore/lib/validate_module.py",
                              os.path.dirname(path)], check=True)
          PYCODE

  # ── Layer 3: Deep Review (on label, advisory) ──────────────────
  deep-review:
    name: Deep PR Review
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'ready-for-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect PR types from changed files
        id: detect-types
        run: |
          TYPES=""
          FILES=$(git diff --name-only origin/main...HEAD)
          if echo "$FILES" | grep -q '\.datacore/modules/'; then
            TYPES="${TYPES}module,"
          fi
          if echo "$FILES" | grep -q 'dips/'; then
            TYPES="${TYPES}dip,"
          fi
          if echo "$FILES" | grep -q 'agents/'; then
            TYPES="${TYPES}agent,"
          fi
          if echo "$FILES" | grep -q 'commands/'; then
            TYPES="${TYPES}command,"
          fi
          if echo "$FILES" | grep -q '\.py$'; then
            TYPES="${TYPES}python,"
          fi
          if echo "$FILES" | grep -q '\.ts$'; then
            TYPES="${TYPES}typescript,"
          fi
          TYPES=$(echo "$TYPES" | sed 's/,$//')
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

      - name: Run PR review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REPO: ${{ github.repository }}
          PR_TYPES: ${{ steps.detect-types.outputs.types }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE_B64=$(echo -n "$PR_TITLE" | base64)
          REVIEW_OUTPUT=$(python .datacore/lib/pr_review.py \
            --repo "$PR_REPO" \
            --pr "$PR_NUMBER" \
            --types "$PR_TYPES" \
            --title-b64 "$TITLE_B64" \
            --author "$PR_AUTHOR" 2>&1) || true
          if [ -z "$REVIEW_OUTPUT" ]; then
            REVIEW_OUTPUT="Review could not be completed. Please review manually."
          fi
          echo "$REVIEW_OUTPUT" > /tmp/review_body.txt

      - name: Post review comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file /tmp/review_body.txt
