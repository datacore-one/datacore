# Validate every committed public layer; filenames never become shell source.
name: Validate Layers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-layers:
    name: Validate PUBLIC Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate committed public layers and registered submodules
        run: python .datacore/lib/git_privacy.py --revision HEAD
