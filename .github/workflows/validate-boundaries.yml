# Validate System Repo Boundaries
#
# Enforces that only system files are tracked in the public repo.
# Cannot be bypassed with --no-verify or missing hook installation.
#
# Checks:
# 1. Root-level allowlist (only .datacore/, .github/, and root config)
# 2. No API key patterns in any tracked file
# 3. No personal email addresses in tracked files
# 4. No absolute personal paths (/home/X, /Users/X) in tracked files
#
# The allowlist for check 1 is maintained in a single shared file:
#   .datacore/config/root-allowlist.txt
# Both this workflow and .datacore/hooks/pre-commit read from that file.

name: Validate Boundaries

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  boundary-check:
    name: System Repo Boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate committed boundaries and privacy
        run: python3 .datacore/lib/git_privacy.py --revision HEAD
