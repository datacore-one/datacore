# GTD Trigger Lists — Per DIP-0009 Part 11
# Comprehensive checklists for brainstorming open loops during weekly reviews.
# Structure: categories with prompts that trigger "do I have a next action for this?"

categories:
  professional:
    label: "Professional / Work"
    prompts:
      - "Projects started but not completed"
      - "Projects that need to be started"
      - "Commitments/promises made to others"
      - "Communications to make/get back to"
      - "Reports/proposals due"
      - "Meetings that need scheduling"
      - "Meetings to prepare for"
      - "Professional development goals"
      - "Skills to learn or improve"
      - "Financial/budget items"
      - "Administrative tasks"
      - "Staff/team issues to address"
      - "Systems to improve or create"
      - "Research needed"
      - "Professional reading to catch up on"
      - "Presentations or talks to prepare"
      - "Feedback to give or request"
      - "Delegated items to follow up on"
      - "Conferences or events to attend or submit to"
      - "Client relationships to nurture"
      - "Tools or processes that are frustrating"
      - "Pending hiring or staffing decisions"

  personal:
    label: "Personal / Home"
    prompts:
      - "Health: appointments, tests, medications"
      - "Finance: bills, investments, tax prep"
      - "Home: maintenance, repairs, improvements"
      - "Family: commitments, events, gifts"
      - "Friends: people to contact, social events"
      - "Errands: returns, purchases, pickups"
      - "Travel: upcoming trips, reservations"
      - "Legal: documents, renewals, filings"
      - "Insurance: renewals, claims, reviews"
      - "Subscriptions: renewals, cancellations"
      - "Personal projects stalled or abandoned"
      - "Hobbies: supplies, activities, goals"
      - "Relationships that need attention"
      - "Education: courses, certifications, degrees"
      - "Vehicles: maintenance, registration, inspection"
      - "Wardrobe: seasonal updates, replacements"
      - "Gifts: upcoming occasions to prepare for"

  waiting_for:
    label: "Waiting For"
    prompts:
      - "Replies to emails/messages sent"
      - "Deliveries or shipments"
      - "Repairs or service calls"
      - "Reimbursements or refunds"
      - "Information or decisions from others"
      - "Approvals pending"
      - "Delegated tasks not yet completed"
      - "Applications submitted"
      - "RSVPs expected"
      - "Quotes or estimates requested"
      - "Medical test results pending"
      - "Invitations sent awaiting response"

  someday_maybe:
    label: "Someday/Maybe"
    prompts:
      - "Things to learn"
      - "Places to visit"
      - "Books/articles/podcasts to consume"
      - "Ideas to explore"
      - "Business ideas"
      - "Creative projects"
      - "Things to buy eventually"
      - "Lifestyle changes to consider"
      - "People to reconnect with"
      - "Skills to develop"
      - "Events or experiences to try"
      - "Side projects or business ideas"
      - "Home improvement projects"

  digital:
    label: "Digital / Technology"
    prompts:
      - "Software to install or update"
      - "Accounts to create/delete/secure"
      - "Passwords to update"
      - "Data to back up"
      - "Files to organize or archive"
      - "Subscriptions to review"
      - "Automations to set up"
      - "Code projects: bugs, features, refactors"
      - "Documentation to write"
      - "APIs or integrations to explore"
      - "Online accounts to review or close"
      - "Digital photos to organize"
      - "Email newsletters to unsubscribe from"

  review_horizons:
    label: "Higher Horizons"
    prompts:
      - "Purpose and principles: am I living aligned?"
      - "Vision (3-5 years): what does success look like?"
      - "Goals (1-2 years): what am I working toward?"
      - "Areas of focus: health, career, relationships, finance, creativity"
      - "Current projects: are they all still relevant?"
      - "What am I tolerating that I shouldn't be?"
      - "What would I do if I had unlimited time/money?"
      - "Relationships: who am I investing in?"
      - "Financial goals: am I on track?"
      - "Health trajectory: am I improving or declining?"
