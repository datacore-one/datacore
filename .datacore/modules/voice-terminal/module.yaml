manifest_version: 2
name: voice-terminal
version: 0.3.0
description: "Privacy-first voice assistant — wake word, STT, TTS, Datacore integration, Telegram audio delivery. No cloud for audio (except gTTS fallback)."
author: datacore-one
license: MIT
builtin: true

provides:
  agents: []
  commands: []
  skills: []

hooks:
  today:
    slot: post
    description: "Generate spoken briefing and send as Telegram voice message"
    instructions: |
      After writing the journal, generate a spoken briefing summary:

      1. Write the spoken summary to {journal_dir}/{date}_spoken.txt
         - SUMMARIZE_PROMPT in speak_brief.py is the authoritative spec for voice,
           length and structure. Follow it; do not restate a shorter version here.
         - Voice: "Data" — an android chief of staff, not a butler. Precise, curious,
           dryly funny by understatement. NO CONTRACTIONS, ever ("it is", not "it's").
         - Never say "sir" or any honorific. Open with a plain "Good morning."
         - About 400 words, roughly 2.5 minutes at the configured tts_speed.
         - Opening/body movement stays to 2-3 sentences: verdict plus capacity,
           at most one supporting number. Never recite the whole health panel.
         - Seven movements in order: opening and body; THE WORLD (mandatory — markets
           plus one or two developments in his fields, always with the "so what");
           the day and its deadlines; WHAT WAS HANDLED (state explicitly whether email
           triage and GitHub triage ran and what they did — never leave it ambiguous);
           money; THE OBSERVATION (three or four sentences on one real pattern from
           today's report, specific and concrete, never a generic aphorism); the close.
         - Translate numbers to speech: "seventy-two", not "72".
         - Full crypto names (Solana not SOL. Bitcoin not BTC. Ethereum not ETH).
         - Natural sentences with ordinary commas. Full stops become real pauses in
           TTS, so stacked fragments sound plodding — reserve them for genuine beats.
         - End with "Your full report is on your desk" or a natural variant.
         - No markdown. No bullets. No emoji. Pure spoken text.

      2. Generate audio and send to Telegram:
         ```bash
         python3 .datacore/modules/voice-terminal/lib/speak_brief.py {date} --telegram
         ```

settings:
  wake_word: "hey_datacore"
  stt_model: "medium"
  tts_engine: "kokoro"
  tts_voice: "af_heart"
  tts_speed: 1.12   # 1.0 read as plodding at ~145 wpm; 1.12 lands ~162 wpm (Gregor, 2026-08-31)
  language: "en"
  brain: "local"  # local (Mac) or network (Blackpi IP)
  telegram_delivery: true

dependencies:
  - core

recall:
  # DIP-0029 — module-level engram scope; composes with command-level recall:.
  scopes:
    - module:voice-terminal
  tags:
    - voice-terminal

# DIP-0047 — speaks to the operator; the only outbound spend is LLM inference.
exempt:
  - fn: "lib/daemon_health.py:do_POST"
    reason: inbound HTTP handler, not an outbound call
  - fn: "lib/setup_telegram.py:send_test_message"
    reason: one-off setup probe to the operator's own chat
  - fn: "lib/setup_telegram.py:validate_bot_token"
    reason: read-only — token validation
  - fn: "lib/speak_brief.py:_telegram_send_file"
    reason: operator audio delivery to the configured chat
  - fn: "lib/speak_brief.py:_try_ollama"
    reason: local Ollama inference — no external side effect
  - fn: "lib/speak_brief.py:_try_openrouter"
    reason: inference only; spend attestation tracked separately
