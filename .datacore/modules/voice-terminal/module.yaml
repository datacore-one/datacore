manifest_version: 2
name: voice-terminal
version: 0.1.0
description: "Privacy-first voice assistant — wake word, STT, TTS, Datacore integration. No cloud for audio."
author: datacore-one
license: MIT
builtin: true

provides:
  agents: []
  commands: []
  skills: []

settings:
  wake_word: "hey_datacore"
  stt_model: "medium"
  tts_voice: "en_US-lessac-medium"
  language: "en"
  brain: "local"  # local (Mac) or network (Blackpi IP)

dependencies:
  - core
