# Wrangler config for datacore-appbuilder workers
# Deploy: wrangler deploy --config lib/workers/wrangler.toml
#
# One D1 database serves both workers. Deploy each worker separately
# by setting the entrypoint via --name flag.

name = "appbuilder-license"
main = "license.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "appbuilder"
database_id = ""  # Fill after: wrangler d1 create appbuilder

[vars]
DAILY_LIMIT = "100"

# Secrets (set via: wrangler secret put SECRET_NAME)
# SIGNING_KEY     — Ed25519 private key (base64)
# WEBHOOK_SECRET  — Payment provider webhook secret
# ANTHROPIC_API_KEY — For AI proxy worker
