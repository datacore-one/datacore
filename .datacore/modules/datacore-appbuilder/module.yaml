manifest_version: 2
name: datacore-appbuilder
version: 0.1.0
description: "Framework for building distributable desktop and web apps on Datacore modules — React + Tauri v2 + Tailwind"
author: datacore-one
repository: https://github.com/datacore-one/datacore-appbuilder
license: UNLICENSED

dependencies:
  - core@>=1.0.0

provides:
  tools: []
  skills: []
  agents: []
  commands: []
  workflows: []

settings:
  # Default stack
  frontend: react
  bundler: vite
  css: tailwindcss
  desktop: tauri-v2
  state: tanstack-query
  ai_provider: claude
  testing: vitest

  # Default app manifest values
  defaults:
    licensing:
      type: one-time
      trial_days: 14
    data_dir:
      standalone_prefix: "~/"
      datacore_space: "0-personal"

# Engram configuration
engrams:
  namespace: appbuilder
  injection_policy: on_match
  match_terms: [app, appbuilder, tauri, desktop app, scaffold app, new app]

# CLAUDE.md inclusion behavior
context:
  priority: on_match
  summary: "Framework for building desktop/web apps on Datacore — React + Tauri v2 + Tailwind"

# External requirements (for worker deployment only)
requires:
  env_vars:
    optional:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - STRIPE_SECRET_KEY

use_cases:
  - Scaffold new Datacore desktop/web apps
  - Reusable storage, AI, licensing, and bridge layers
  - Tauri v2 desktop packaging with filesystem access
  - AI-powered features via Claude API (direct or proxy)
  - Standalone apps that auto-detect Datacore when present

hooks:
  post_install: |
    echo "datacore-appbuilder installed."
    echo "See specs/architecture.md for full architecture specification."
    echo "Copy scaffold/ to start a new app."
