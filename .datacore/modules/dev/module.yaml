manifest_version: 2
name: dev
version: 1.0.0
description: Development workflows — deployment, CI/CD monitoring, production verification
author: datacore
repository: https://github.com/datacore-one/datacore-dev
license: MIT

dependencies:
  - core@>=1.0.0

settings:
  auto_push: false
  chrome_verify: true
  default_environment: staging

provides:
  commands:
    - deploy
  skills:
    - deploy-status

use_cases:
  - CI/CD deployment with production verification
  - Multi-project deploy management
  - Post-deploy Chrome-based acceptance testing

hooks:
  post_install: |
    echo "Dev module installed."
    for skill_dir in skills/*/; do
      skill_name=$(basename "$skill_dir")
      target="$HOME/.claude/skills/dev:$skill_name"
      if [ ! -e "$target" ]; then
        ln -s "$(pwd)/$skill_dir" "$target"
        echo "  Skill linked: dev:$skill_name"
      fi
    done
    echo "Add deploy.yaml to your project roots to configure /deploy."

status: active

# DIP-0022 context
context:
  priority: on_match

# Engrams
engrams:
  namespace: dev
  scopes: [dev]
