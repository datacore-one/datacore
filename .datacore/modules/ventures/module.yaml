manifest_version: 2
name: ventures
version: 0.1.0
description: "Autonomous venture framework — roles, cadences, budgets, hypotheses"
author: datacore-one
license: MIT

dependencies:
  - core@>=1.0.0

optional:
  - gtd
  - nightshift

provides:
  agents:
    - name: venture-monitor
      trigger: ":AI:venture:monitor:"
      description: Daily heartbeat per venture — cadence status, budget, hypothesis progress
  commands:
    - name: scaffolding-audit
      description: Audit a venture for missing structural elements
    - name: today-hook
      description: Hook into /today briefing — surface venture cadence status
    - name: office-hours
      description: YC-style six-forcing-question diagnostic for new ideas — produces a design doc, never code
    - name: retro
      description: Sprint retrospective with team-aware growth notes, HITL classification, engram capture
    - name: ceo-review
      description: CEO-mode plan review — challenge premise, find 10-star product, expand scope when scope creates leverage
    - name: eng-review
      description: Engineering plan lock-in — architecture, code quality, test-coverage diagram, failure modes
  # CLI / open-source surface (loaded by datacore-mcp from tools/index.js).
  # Read-only and safe-to-write-without-daemon. Mutations with safety
  # gates, checkpoints, locking, and event emission are exposed by
  # app-tools/index.mjs (loaded only by datacore-app's app-mcp-server,
  # which routes through the daemon — see DIP for the split surface).
  tools:
    - name: list_ventures
      description: List ventures with stage, autonomy, north star, last activity
    - name: read_venture
      description: Read a venture.yaml in full (roles, cadences, budget, modules)
    - name: list_hypotheses
      description: Read a venture's hypotheses.yaml (optional status filter)
    - name: venture_status
      description: Quick status — stage, hypothesis counts, budget burn for one venture

settings:
  state_dir: .datacore/state/venture/
  templates_dir: .datacore/templates/roles/

requires:
  env_vars:
    required: []
    optional: []

context:
  priority: on_match

engrams:
  namespace: ventures
  scopes: [ventures, roles, cadences, hypotheses, budget]

hooks:
  today: "commands/today-hook.md"

recall:
  # DIP-0029 — module-level engram scope; composes with command-level recall:.
  scopes:
    - module:ventures
  tags:
    - ventures
