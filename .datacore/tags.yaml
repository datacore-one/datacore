# =============================================================================
# PRIORITY TAGS
# Map between org-mode priorities and external systems
# =============================================================================
priority:
  A:
    description: "High priority - do today"
    org: "[#A]"
    github: "priority-high"
    color: "#d73a4a"

  B:
    description: "Medium priority - do this week"
    org: "[#B]"
    github: "priority-medium"
    color: "#fbca04"

  C:
    description: "Low priority - do when possible"
    org: "[#C]"
    github: "priority-low"
    color: "#0e8a16"

# =============================================================================
# CONTEXT TAGS
# Who/where/when contexts for GTD
# =============================================================================
context:
  # People — configure team members in tags.local.yaml
  # Example:
  #   user1:
  #     description: "Assigned to User1"
  #     org: ":@user1:"
  #     github: "assignee:ghuser1"

  # Location/Mode contexts
  computer:
    description: "Requires computer/laptop"
    org: ":@computer:"

  home:
    description: "Tasks to do at home"
    org: ":@home:"

  office:
    description: "Tasks to do at office"
    org: ":@office:"

  online:
    description: "Tasks requiring internet"
    org: ":@online:"

  phone:
    description: "Can do on phone"
    org: ":@phone:"

  call:
    description: "Requires phone call"
    org: ":@call:"

  errands:
    description: "Tasks while out"
    org: ":@errands:"

  waiting:
    description: "Waiting for someone"
    org: ":@waiting:"

  anywhere:
    description: "No location constraint"
    org: ":@anywhere:"

  # 2026-05-20 GTD architecture additions — see DIP-0009 v2
  laptop:
    description: "Requires a working laptop (most dev/writing)"
    org: ":@laptop:"

  deep:
    description: "Needs >60 min uninterrupted focus block"
    org: ":@deep:"

  admin:
    description: "Routine bureaucracy (forms, receipts, filings)"
    org: ":@admin:"

  decision:
    description: "Needs a human decision (no execution), short"
    org: ":@decision:"

# =============================================================================
# DISCIPLINE TAGS
# Markers for GTD discipline + this-week routing
# =============================================================================
discipline:
  next-week:
    description: "Explicitly listed as this-week priority by user"
    org: ":next-week:"

  interrupt:
    description: "Same-day capture needing human hands, drops after EOD"
    org: ":interrupt:"

  recurring:
    description: "Has a SCHEDULED with +Nd/+Nw/+Nm repeater; auto-advances on DONE"
    org: ":recurring:"

  needs-clarify:
    description: "Captured without sufficient context; revisit at next inbox processing"
    org: ":needs-clarify:"

  setup-cron:
    description: "One-off task to create a systemd timer (the deliverable is the cron, not the task itself)"
    org: ":setup-cron:"

# =============================================================================
# STATUS TAGS
# Task/content status indicators
# =============================================================================
status:
  urgent:
    description: "Needs immediate attention"
    org: ":urgent:"
    github: "urgent"

  blocked:
    description: "Blocked by dependency"
    org: ":blocked:"
    github: "blocked"

  review:
    description: "Needs review"
    org: ":review:"
    github: "needs-review"

  stub:
    description: "Placeholder content, needs expansion"
    yaml: "stub"
    hashtag: "#stub"

  needs-content:
    description: "Note needs content added"
    yaml: "needs-content"

  draft:
    description: "Work in progress"
    yaml: "draft"
    synonyms: [wip, in-progress]

  published:
    description: "Ready for consumption"
    yaml: "published"
    synonyms: [final, complete]

  archived:
    description: "Historical, no longer active"
    yaml: "archived"

# =============================================================================
