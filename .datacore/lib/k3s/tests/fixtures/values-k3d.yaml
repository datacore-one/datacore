# Throwaway-cluster rehearsal with a fixture actor: no real key, no bot token.
egress:
  image: agent-egress:0.1.0
  openHttps: true
  allowDomains: [.openrouter.ai, api.telegram.org, .github.com]
  allowSsh:
    - {host: github.com, port: 22}
agents:
  tris:
    image: agent-hermes:0.19.0-1
    running: false
    signingKeySecret: tris-signing-key
    signingKeyName: tris.key
    storage: 2Gi
    stream: {enabled: false}
    crontab: |
      * * * * * date -u >> /var/lib/agent/.datacore/state/fixture-cron.log
