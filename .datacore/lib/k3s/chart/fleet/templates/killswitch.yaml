# The credential behind Winston's /fleet_stop, /fleet_resume and /fleet_status
# chat commands: it can read and scale agent Deployments in the team namespace
# and nothing else -- no secrets, no exec, no pods, no other namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-killswitch
  namespace: {{ .Values.teamNamespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: fleet-killswitch-token
  namespace: {{ .Values.teamNamespace }}
  annotations:
    kubernetes.io/service-account.name: fleet-killswitch
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-killswitch
  namespace: {{ .Values.teamNamespace }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-killswitch
  namespace: {{ .Values.teamNamespace }}
subjects:
  - kind: ServiceAccount
    name: fleet-killswitch
    namespace: {{ .Values.teamNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-killswitch
