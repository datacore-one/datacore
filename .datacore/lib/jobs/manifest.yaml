  # promises whose eval runs a real agent (agent_eval.require_enabled) cost
  # model runs, so the nightly never runs them. Here, on the overnight host --
  # always on, its own minted subscription token through the broker
  # (claude-code-oauth, instance-local), claude and pytest present -- once a
  # week, Sunday 13:20 UTC: after the overnight run (20:00-06:00) and the
  # Sunday 02:20 calibration, outside the owner's working week. Its own history
  # under promise-scoreboard/agents/; what turned red goes to The Firm through
  # the host's alert route, like the nightly's.
  - name: nightshift-agent-evals
    machine: nightshift
    schedule: "20 13 * * 0"
    cmd: "python3 ~/Data/.datacore/lib/promise_nightly.py --agents >> ~/.datacore/state/agent-evals.log 2>&1"
    on_fail: telegram
    # A person, not a repair agent: an agent "repairing" this job would re-run
    # paid model evals the owner scheduled weekly on purpose. Until the first
    # Sunday run (2026-10-04) its artifacts do not exist, and that is reported.
    delegate: false
    artifacts:
      - path: ~/.datacore/state/agent-evals.log
        check: last_line_regex
        arg: '^agent-evals: \d+ green, \d+ red, \d+ could not run here; \d+ turned red, \d+ recovered; alert (sent|none)$'
        max_age_hours: 192
      - path: ~/.datacore/state/promise-scoreboard/agents/latest.json
        check: json_has_keys
        arg: [date, counts, promises]
        max_age_hours: 192

  # THE SAME BOARD ON EVERY MACHINE, FOR ITSELF (owner decision 2026-09-30).
  # Each host judges only what it can run: an eval that reads other machines
  # over ssh (need `fleet`, met only on the roster's roles.console -- the
  # workstation) or runs a real agent session (need `agent`, never on in the
  # nightly) is "could not run here" there, never red. Staggered, UTC: box
  # 01:40, hermes 02:10, plur-claw 02:50 (its entry is in manifest.local.yaml:
  # a tracked file names no such host, INS-3), nightshift 04:30; the workstation at
  # 21:30 local while it is usually awake. Each alerts by its own route:
  #   box         Winston's sender, as its job checks do
  #   workstation the same sender over ssh on the always-on host, as
  #               job_verify_notify.sh relays its alerts
  #   hermes      Tris's own bot (agent_alert.py --bot tris-telegram-bot, token
  #               and group from the broker at send time), as its job checks
  #               (--alert command) do since 2026-09-30
  #   (all three declared in that host's ~/.datacore/alerts.yaml `command:`, the
  #   install-local alert command job_verify already reads)
  #   plur-claw   NO alert route yet: Data's own bot is not in the broker's
  #               index, so its job checks run --alert log and this --no-send;
  #               the board is written and nobody is told
  # box and plur-claw run an interpreter with pytest (~/.datacore/eval-venv:
  # their system python3 has none, and a board without it is all red). The
  # satellites run the code from ~/.datacore/v2-runner, which has no system
  # space: DATACORE_PROMISES_DIR names their copy of the promise list.
  - name: box-promise-scoreboard
    machine: box
    schedule: "40 1 * * *"
    cmd: "~/.datacore/eval-venv/bin/python ~/Data/.datacore/lib/promise_nightly.py >> ~/.datacore/state/promise-nightly.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/promise-nightly.log
        check: last_line_regex
        arg: '^promise-scoreboard: \d+ green, \d+ red, \d+ could not run here; \d+ turned red, \d+ recovered; alert (sent|none)$'
        max_age_hours: 26
      - path: ~/.datacore/state/promise-scoreboard/latest.json
        check: json_has_keys
        arg: [date, counts, promises]
        max_age_hours: 26
  - name: hermes-promise-scoreboard
    machine: hermes
    schedule: "10 2 * * *"
    cmd: "DATACORE_PROMISES_DIR=~/Data/1-datacore/1-tracks/dev/datacore-upgrade/promises python3 ~/.datacore/v2-runner/.datacore/lib/promise_nightly.py >> ~/.datacore/state/promise-nightly.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/promise-nightly.log
        check: last_line_regex
        arg: '^promise-scoreboard: \d+ green, \d+ red, \d+ could not run here; \d+ turned red, \d+ recovered; alert (sent|none)$'
        max_age_hours: 26
      - path: ~/.datacore/state/promise-scoreboard/latest.json
        check: json_has_keys
        arg: [date, counts, promises]
        max_age_hours: 26
  - name: mac-promise-scoreboard
    scope: local
    why_local: "judges the promises from this machine's own working copy and tools; every host runs its own scoreboard (owner, 2026-09-30)"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    # Once a day at the first presence, not at 21:30: its history compares one
    # board per date, so it must not repeat every session. About 17 minutes.
    trigger: arrival
    every: day
    schedule: "on arrival: visitor_join.py runs it at the first converged join or tick of each day (every: day)"
    cmd: "~/.pyenv/versions/3.11.1/bin/python3 ~/Data/.datacore/lib/promise_nightly.py >> ~/.datacore/state/promise-nightly.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/promise-nightly.log
        check: last_line_regex
        arg: '^promise-scoreboard: \d+ green, \d+ red, \d+ could not run here; \d+ turned red, \d+ recovered; alert (sent|none)$'
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1
      - path: ~/.datacore/state/promise-scoreboard/latest.json
        check: json_has_keys
        arg: [date, counts, promises]
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  # THE ESCALATION PATH FOR DELEGATED REPAIRS, and the reason withholding the
  # other alerts is safe. job_verify now hands a recurring failure to miles and
  # says nothing to the operator; if that were the whole change, a repair that
  # was given up on would disappear. This is what makes it not disappear.
  - name: box-ledger-claim
    # Winston's own claim loop (2026-09-22): the second leg of a two-stage
    # repair. Miles fixes a box job's producer from nightshift and merges; the
    # follow-up item is addressed to winston, and this loop pulls the box and
    # runs the job's own verification there. Never delegated: it IS the
    # machinery.
    machine: box
    schedule: "5,20,35,50 * * * *"
    cmd: ~/Data/.datacore/lib/ledger_claim_run.sh
    on_fail: telegram
    delegate: false
    artifacts:
      - path: ~/.datacore/state/ledger-claim.log
        check: no_crash
        max_age_hours: 2

  - name: box-autofix-escalation
    # Never delegated: this job IS the delegation machinery, and handing its
    # own failure to the agent it checks is circular (it happened, 2026-09-22).
    delegate: false
    # MOVED OFF THE LAPTOP 2026-09-21. This is a network duty with a clock-based
    # contract, and the mac is a visitor: it sleeps, changes networks and may be
    # shut for days, so every deadline it carried turned into an alert about the
    # lid rather than about the fleet. Verified to run on this host before moving.
    # On the box specifically: escalating to the operator is the steward's job, and
    # the escalation path for delegated repairs must not live on a machine that
    # is asleep when a repair is abandoned.
    machine: box
    schedule: "25 * * * *"
    cmd: ~/Data/.datacore/lib/audit_trio_run.sh escalations
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/autofix-escalations.log
        check: last_line_regex
        arg: 'autofix: 0 repair\(s\) need a person'
        max_age_hours: 3

  # mac-drills DELETED 2026-09-22 (visitor conversion). Its one drill,
  # laptop_night_drill, is a test: synthetic power logs through the runner's
  # job_verify. It runs as tests/test_laptop_night_drill.py in lib/tests, which
  # the suite audit runs on this machine and which skips off macOS -- a failing
  # drill still turns mac-suite-audit red, without a clock of its own.

  - name: nightshift-preflight
    # THE GATE THE NIGHT DEPENDS ON, ASKED BEFORE THE NIGHT. The overnight run
    # opens with a git preflight; until 2026-09-21 any finding in any space
    # refused the whole run, and one stray file in 5-plur cost every space five
    # runs (09-18 -> 09-21). The run now fences the space and carries on, which
    # bounds the damage -- but a fenced space still gets no work, and the only
    # place that was said was a run-time alert nobody could act on in time.
    #
    # So the same function the run calls (`run.py: preflight`) is contracted
    # every three hours. A finding fails this contract; a failed contract is
    # delegated for repair on the first failure; the operator hears only if the
    # repair does not land. `--preflight` defers, leaving the record alone, while
    # a run holds the lock -- the run records its own -- so the bound is wide
    # enough to cover one long night.
    machine: nightshift
    schedule: "45 */3 * * *"
    cmd: "~/Data/.datacore/modules/nightshift/nightshift run --preflight"
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/nightshift-preflight.log
        check: last_line_regex
        arg: 'preflight: 0 space\(s\) would sit out, 0 finding\(s\) would refuse the run'
        max_age_hours: 13

  - name: nightshift-drills
    # The two drills that are pure ledger code in scratch trees -- chaos (15
    # injected faults) and phase-1 flip-and-reversal. Split from mac-drills on
    # 2026-09-21: laptop_night_drill models a macOS night and fails 4/8 on Linux,
    # correctly, so it stays on the machine it is about and these two moved to a
    # host where a nightly deadline is an honest thing to have.
    machine: nightshift
    schedule: "45 2 * * *"
    cmd: ~/Data/.datacore/lib/audit_trio_run.sh drills
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/drills.log
        check: last_line_regex
        arg: 'drills: 2/2 held'
        max_age_hours: 26

  - name: mac-suite-audit
    scope: pinned
    why_pinned: "module test suites exist only where modules are cloned; moving it would shrink what it covers without saying so"
    unpin_when: "each module repo has its own CI workflow"
    machine: mac
    # Once a session, not at 03:30. About ten minutes of CPU, so it runs after
    # the join that begins a session rather than after every join.
    trigger: arrival
    schedule: "on arrival: visitor_join.py runs it after the first converged join of a session"
    cmd: ~/Data/.datacore/lib/audit_trio_run.sh suites
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/suite-audit.log
        check: last_line_regex
        # EVERY count on the line, not one of them. A regex on "0 unexplained"
        # alone passes a run that errored; one on "not green" alone passes a run
        # that collected nothing. mac-seq-gap matched a single count for weeks
        # while the other climbed beside it (2026-09-08).
        #
        # `accepted` is deliberately left free: entries come and go from
        # suite-audit-baseline.yaml, and pinning the number here would mean a
        # second file to update every time one is retired.
        # `0 collected nothing` is pinned: on 2026-09-22 a run under the wrong
        # interpreter reported "0 passed, 0 unexplained ... 21 collected nothing"
        # and the regex without it read that as green. A suite that ran no test
        # is not a green suite.
        arg: '0 unexplained, \d+ accepted, 0 error across \d+ suite\(s\); 0 suite\(s\) not green, 0 collected nothing$'
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  - name: nightshift-delegation-drill
    # Never delegated: this job IS the delegation machinery, and handing its
    # own failure to the agent it checks is circular (it happened, 2026-09-22).
    delegate: false
    # MOVED OFF THE LAPTOP 2026-09-21. This is a network duty with a clock-based
    # contract, and the mac is a visitor: it sleeps, changes networks and may be
    # shut for days, so every deadline it carried turned into an alert about the
    # lid rather than about the fleet. Verified to run on this host before moving.
    machine: nightshift
    schedule: "30 3 * * *"
    cmd: ~/Data/.datacore/lib/audit_trio_run.sh drill
    # The drill exits 1 when a control fails, and that IS the signal -- the
    # artifact check below is what decides pass or fail, so both codes are ok
    # here for the same reason they are on the two jobs beneath it.
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/delegation-drill.log
        check: last_line_regex
        # THE COUNT IS PINNED, not \d+. "every control held" is true of a run
        # that held three controls as much as one that held twenty-seven, so a
        # regex accepting any number passes a drill whose scenarios silently
        # stopped being collected -- the same shape as gating on "all tests
        # pass" while the tests quietly disappear. Changing 27 is a deliberate
        # edit here, which is the point.
        arg: 'delegation drill: 27 scenario\(s\), every control held'
        max_age_hours: 26

  - name: mac-config-resolution
    scope: local
    why_local: "probes THIS host's config resolution; every host runs its own"
    machine: mac
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: ~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/config-resolution.log -- python3 ~/Data/.datacore/lib/config_resolution_probe.py
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: ~/.datacore/state/config-resolution.log
        check: last_line_regex
        arg: 'config-resolution: OK'
        since: join
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

  # ── mac jobs in this machine's crontab / LaunchAgents with no entry (OPS-1) ──
  # Bounds are in awake hours (the roster declares the mac a workstation).
  - name: mac-sync-traces
    scope: local
    why_local: "copies this machine's own Claude transcripts"
    machine: mac
    # Once a session, not at midnight (owner decision 2026-10-02: the mac is a
    # visitor; its duties run when the owner arrives, never on a clock).
    trigger: arrival
    schedule: "on arrival: visitor_join.py runs it after the first converged join of a session"
    cmd: "~/Data/.datacore/lib/sync_traces.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/sync-traces.last"
        check: regex
        arg: 'sync_traces: \d+ transcript'
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  # The box runs mail triage and writes .datacore/state/mail/, which is gitignored,
  # so this hourly pull is the only route the results have to this machine's
  # /today. rsync keeps the box's mtimes, so the age of audit.jsonl is the age of
  # the last triage that reached here. Neutral here; this install's exact line is
  # in manifest.local.yaml.
  - name: mac-mail-state-pull
    scope: local
    why_local: "pulls the mail triage state onto this machine"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    # The pull writes its own exit line: rsync keeps the box's mtimes, so
    # audit.jsonl's age says when the box triaged, never whether this ran.
    cmd: '{ rsync -az "$(python3 ~/Data/.datacore/lib/jobs/manifest.py ssh-alias box)":~/Data/.datacore/state/mail/ ~/Data/.datacore/state/mail/; rc=$?; echo "exit=$rc $(date)"; } >> ~/.datacore/state/mail-state-pull.log 2>&1; exit $rc'
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/mail-state-pull.log"
        check: last_line_regex
        arg: '^exit=0 '
        since: join
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1
      - path: "~/Data/.datacore/state/mail/audit.jsonl"
        check: exists
        max_age_hours: 26

  # Consistent SQLite snapshots pushed off this machine (sqlite_push.py: backup
  # API, journal_mode=DELETE, rsync over the roster's ssh alias, remote size read
  # back). Each run leaves one result line; the contract is that line, so a push
  # that did not land is red rather than a quiet no-op. Replaced 2026-09-28 three
  # raw rsync lines that copied live databases to a retired /root layout.
  # Neutral here; this install's exact lines are in manifest.local.yaml.
  - name: mac-lens-push
    scope: local
    why_local: "pushes this machine's lens observations to the box's lens reader"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: "~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/lens-push.log -- python3 ~/Data/.datacore/lib/sqlite_push.py ~/.datacore/lens/observations.db box .datacore/lens/observations.db"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/lens-push.log"
        check: last_line_regex
        arg: '^sqlite_push: ok '
        since: join
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

