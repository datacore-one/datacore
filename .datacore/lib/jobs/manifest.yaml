# Job manifest — every scheduled job on the three Datacore machines
# (mac, box, nightshift), for the unified job_verify.py verifier.
#
# Schema: .datacore/lib/jobs/manifest.py (load_manifest). Paths support
# `{today}` (local YYYY-MM-DD) and `~` (expanded on whichever machine
# job_verify.py runs on -- it is meant to run locally on each machine).
#
# Honesty rule: every artifact path below was derived from evidence read
# in this repo (scripts, systemd units, launchd plists, or source code),
# not invented. Where a path is inferred rather than directly traced to a
# writer, a `# TODO(verify-on-<machine>)` comment says so and names the
# evidence. Task 2.4 brief: .superpowers/sdd/2026-07-29-datacore-v2/task-2.4-brief.md
#
# on_fail policy (conservative default, Phase 6 tunes): briefing, cos_sync,
# and backup alert via telegram; everything else logs only.
#
# Evidence sources (read in full before writing this file):
#   - modules/chief-of-staff/server/lib/cos_verify_morning.py (briefing/journal/log assertions + check_ops log_max_age dict)
#   - modules/chief-of-staff/server/COS-SERVER.md ("Cron schedule (root crontab, UTC)" table)
#   - modules/chief-of-staff/server/cos-server-setup.sh (exact crontab lines for backup + health-digest)
#   - modules/chief-of-staff/server/lib/cos_*.sh (each box script read directly)
#   - modules/mail/server/triage-email.sh (email triage state paths)
#   - modules/github/server/triage-github.sh (github triage cache paths)
#   - modules/nightshift/server/nightshift-*.{service,timer} (six target timers: exact OnCalendar + ExecStart)
#   - modules/nightshift/lib/manifest.py + lib/postprocess.py + lib/run.py (nightshift-overnight's manifest-{today}.yaml, traced end to end)
#   - modules/outbox/lib/archive_sync.py (nightshift-outbox: stdout-only JSON, no persisted file found)
#   - modules/nightshift/lib/today_orchestrator.py (market-phase* freshness glob, reader side only)
#   - modules/nightshift/CLAUDE.md ("Output Location" + service unit Descriptions for inbox-process)
#   - .datacore/lib/audit_public_repos_wrapper.sh (public-repo-audit-last.json)
#   - .datacore/lib/agent_stream_rsync.sh + com.datacore.agent-stream-rsync.plist (mac rsync)
#   - modules/lens/scripts/com.datacore.lens.plist + modules/lens/CLAUDE.base.md + docs/OVERVIEW.md (mac lens runner)
#   - live filesystem check on this Mac: ~/.datacore/lens/observations.db and
#     /tmp/datacore-agent-stream-rsync.log both exist (confirmed directly, not inferred)

version: 1
jobs:
  # ── box (Winston / cos-server), root crontab, UTC ────────────────────────

  # Reliability 5 is six daily conditions held thirty days; the scoreboard
  # computes the day's line from the files the box already writes
  # (2-datacore/1-tracks/ops/reliability-slo.md is the definition). A day the
  # scoreboard did not run is a failed day, which is what this contract says.
  - name: box-fleet-probe
    machine: box
    schedule: "*/15 * * * *"
    cmd: "~/Data/.datacore/lib/cos_fleet_probe.sh >> ~/.datacore/cos/fleet-probe.log 2>&1"
    on_fail: telegram
    artifacts:
      # One "<ts> <host> UP|DOWN <ip:port>" line per agent host per run
      # (cos_fleet_probe.sh), then the run's verdict. The other direction of
      # cos_uptime_probe: a host that is down cannot run its own contracts, so
      # the box asks. The VERDICT is the contract (fleet sim 2026-10-03, F6):
      # " UP " anywhere stayed green through a day-long outage because the
      # other hosts answered. A promised-up host down past the grace makes the
      # last line "fleet presence: RED -- <host> DOWN for Nh".
      - path: "~/.datacore/cos/fleet-probe.log"
        check: last_line_regex
        arg: "fleet presence: ok"
        max_age_hours: 1

  - name: box-agent-outcomes
    machine: box
    schedule: "45 5 * * 0"
    cmd: "python3 ~/Data/.datacore/lib/agent_outcomes.py >> ~/.datacore/cos/agent-outcomes.log 2>&1"
    on_fail: telegram
    artifacts:
      # One header line per weekly run ("<ts> agent-outcomes: N rows over D days")
      # followed by one row per (agent, version, model): prompt versions tied to
      # outcomes, stage 7 of the product description.
      - path: "~/.datacore/cos/agent-outcomes.log"
        check: regex
        arg: "agent-outcomes:"
        max_age_hours: 192

  # KNW-10: broken links and orphaned notes are found and reported, not left
  # to rot. Weekly over every space's 3-knowledge/. The log lists every broken
  # link and orphan per space; the alert fires only for broken links that were
  # not there last week (--state), so it says what rotted, not the backlog.
  - name: box-knowledge-lint
    machine: box
    schedule: "15 6 * * 0"
    cmd: "python3 ~/Data/.datacore/lib/knowledge_lint.py --all-spaces --state ~/.datacore/state/knowledge-lint.json >> ~/.datacore/cos/knowledge-lint.log 2>&1"
    # Exit 1 is "ran, found new broken links" -- a finding the regex reports.
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/knowledge-lint.log"
        check: last_line_regex
        arg: "knowledge-lint: \\d+ broken links \\(0 new"
        max_age_hours: 192

  - name: box-reliability-scoreboard
    machine: box
    schedule: "20 7 * * *"
    cmd: "python3 ~/Data/.datacore/lib/reliability_scoreboard.py >> ~/.datacore/cos/scoreboard.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/reliability-scoreboard.log"
        check: regex
        arg: "level="
        max_age_hours: 26

  - name: box-backup
    machine: box
    schedule: "30 2 * * *"
    cmd: "~/Data/.datacore/lib/cos_backup.sh >> ~/.datacore/cos/backup.log 2>&1"
    artifacts:
      # cos-server-setup.sh:78 pins the exact crontab redirect target.
      # cos_backup.sh's own tar output has a timestamp in the filename
      # (plur-state-<ts>.tar.gz) so it can't be a literal path -- the log
      # is the stable artifact.
      # LAST LINE, not any line: this log is append-only, so a plain regex --
      # or `nonempty` -- keeps passing on yesterday's success. On 2026-09-17
      # the script was not executable, cron got "Permission denied", and this
      # contract passed: the error line made the log fresh and non-empty.
      - path: "~/.datacore/cos/backup.log"
        check: last_line_regex
        arg: 'backup ok:.*offsite=ok'
        max_age_hours: 26
    on_fail: telegram

  - name: box-news
    machine: box
    schedule: "0 3 * * *"
    cmd: "~/Data/.datacore/lib/cos_news.sh >> ~/.datacore/cos/news.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/news.log"
        check: no_crash
        max_age_hours: 26

  - name: box-email-triage
    machine: box
    schedule: "30 3 * * *"
    cmd: "cd ~/Data && DATACORE_ROOT=~/Data bash ~/Data/.datacore/modules/mail/server/triage-email.sh >> ~/.datacore/cos/email-triage.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/email-triage.log"
        check: no_crash
        max_age_hours: 26
      # triage-email.sh's own AUDIT_LOG -- one JSONL line appended per run,
      # per account. Direct script evidence, independent of the cron redirect.
      - path: "~/Data/.datacore/state/mail/audit.jsonl"
        check: no_crash
        max_age_hours: 26

  # RETIRED 2026-09-08: box-github-triage. Two hosts ran one script, and
  # the owner was not the one running it. Miles is the CTO and holds the
  # GitHub access, so the triage is his (nightshift-github-triage, moved
  # to 03:30); Winston reads the result through the synced scan cache.
  # Nothing but this job's own verifier ever read ~/.datacore/cos/
  # github-triage.log, so retiring it costs the briefing nothing.
  #
  # Deliberately a cron and not a delegation: the scan decides nothing,
  # and wrapping a deterministic job in a daily hand-off would move it
  # into the class that asserts its own completion. The judgement --
  # what the findings mean -- stays where it already is, in the
  # briefing, and a genuine delegation is for the exceptions it finds.
  - name: box-merge-runs
    # 50 3, not 45 3: deliberately off cos_sync.sh's */15 grid (:00/:15/
    # :30/:45) -- the merge critical section takes a per-repo flock, but
    # cos_sync.sh itself does not lock, so this also shrinks the window
    # where the two could race on the same space repo (2026-08-01
    # adversarial-review Critical 1). Still before box-briefing (0 4).
    machine: box
    schedule: "50 3 * * *"
    cmd: "~/Data/.datacore/lib/cos_merge_runs.sh"
    artifacts:
      # cos_merge_runs.py's own status artifact (task-2.4-style companion:
      # see .superpowers/sdd/2026-07-29-datacore-v2/cos-merge-runs-report.md).
      # Must exist, be fresh, and carry both top-level keys.
      - path: "~/.datacore/cos/merge_runs_status.json"
        check: json_has_keys
        arg: ["generated_at", "stale_branches"]
        max_age_hours: 26
      # Same file, a second and stricter artifact entry: a non-empty
      # stale_branches means a nightshift run branch has sat unmerged for
      # >24h without Winston resolving it -- worth a distinct regex check
      # rather than folding into the json_has_keys entry above, since
      # "the key exists" and "the key is the empty list" are different
      # failure signals worth telling apart in job_verify's output.
      - path: "~/.datacore/cos/merge_runs_status.json"
        check: regex
        arg: '"stale_branches": \[\]'
        max_age_hours: 26
      # Third entry, same file again: errors[] must be empty too -- a
      # per-repo fetch/merge/push failure (e.g. a bad credential) is a
      # real operational problem worth paging on, distinct from both
      # checks above (2026-08-01 adversarial-review Important 4).
      - path: "~/.datacore/cos/merge_runs_status.json"
        check: regex
        arg: '"errors": \[\]'
        max_age_hours: 26
    on_fail: telegram

  # Ledger chain integrity. The hash chain can DETECT retroactive tampering,
  # but nothing ran the check -- a capability with no runner is the same
  # silent-failure shape this manifest exists to close. Verified 2026-08-10 by
  # flipping a payload byte mid-chain: `ledger_cli verify` reported
  # "line 251: hash mismatch". The regex below is a CONTENT check, not a
  # freshness proxy: a tampered chain writes the mismatch instead of "OK".
  # DIP-0046 Track A. Both detectors report POSITIVELY — a count, never merely
  # the absence of an alarm — because silence is consistent with "nothing is
  # wrong" and with "the detector did not run", and telling those apart is the
  # entire purpose (DIP-0046 §8).
  #
  # --fetch is REQUIRED here and not merely allowed. Without it seq-gap compares
  # against a stale remote-tracking ref and cannot see work a THIRD machine
  # pushed, which is the cross-machine blindness the critic flagged: a missing
  # push would look identical to a slow one, the exact defect this detects.
  # RETIRED 2026-09-21: mac-seq-gap, replaced by mac-join (DIP-0046 §15).
  #
  # The drain metric is not gone -- it is taken INSIDE the join, before the sync
  # that would otherwise erase what it measures, and recorded as ahead_by. What
  # is gone is an hourly wall-clock contract on a machine that sleeps: it alerted
  # for a month about events "ten hours old" that the publisher had been given
  # ten minutes to push, was cleared by hand each morning, and came back each
  # night. detectors/seq_gap.py is unchanged and is what the join calls.
  - name: mac-join
    scope: local
    why_local: "this machine's own arrival record: what it was holding, what it had missed, whether it converged"
    machine: mac
    # THE TRIGGER EVERY OTHER VISITOR DUTY HANGS OFF (DIP-0046 §15). The tick
    # only looks; a join happens on a full wake, on retry after one that did not
    # converge, and every 4 waking hours while present. After a converged join
    # it runs this machine's `trigger: join` duties, and on the first join of a
    # session its `trigger: arrival` duties, then writes the record.
    trigger: wake
    schedule: "session: launchd io.datacore.join ticks every 5 min while awake (RunAtLoad); joins on a full wake, on retry, and every 4 waking hours"
    cmd: "python3 ~/Data/.datacore/lib/visitor_join.py --tick"
    on_fail: telegram
    artifacts:
      # THE VISITOR'S ONE ALARM. Only a join that CONVERGED rewrites this file,
      # so its age -- judged in awake time, like every freshness bound on this
      # machine -- is "how long has the laptop been present without converging".
      # A failed join on a train writes nothing over the last good record. Eight
      # waking hours is two missed refreshes: human input at risk.
      - path: "~/.datacore/state/join.json"
        check: regex
        arg: '"converged": true'
        max_age_hours: 8
  - name: nightshift-actor-presence
    # MOVED OFF THE LAPTOP 2026-09-21. This is a network duty with a clock-based
    # contract, and the mac is a visitor: it sleeps, changes networks and may be
    # shut for days, so every deadline it carried turned into an alert about the
    # lid rather than about the fleet. Verified to run on this host before moving.
    machine: nightshift
    schedule: "25 * * * *"
    cmd: "~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/actor-presence.log -- python3 ~/Data/.datacore/lib/detectors/actor_presence.py"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/actor-presence.log"
        check: regex
        arg: "0 failing"   # suffix may follow (never-written count); anchor on this
        max_age_hours: 26

  # Watches the TRIGGER, not the damage. dedup_ids() regenerates duplicate ids
  # on load and a save persists it; one minute later 1,204 :ID: lines had
  # changed and ledger<->org correspondence was gone. Duplicates are cheap to
  # fix while they are duplicates and unrepairable once regenerated, because
  # generate_id() is timestamped.
  - name: nightshift-id-churn
    # MOVED OFF THE LAPTOP 2026-09-21. This is a network duty with a clock-based
    # contract, and the mac is a visitor: it sleeps, changes networks and may be
    # shut for days, so every deadline it carried turned into an alert about the
    # lid rather than about the fleet. Verified to run on this host before moving.
    machine: nightshift
    schedule: "40 * * * *"
    cmd: "~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/id-churn.log -- python3 ~/Data/.datacore/lib/detectors/id_churn.py"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/id-churn.log"
        check: regex
        arg: "0 with findings"
        max_age_hours: 26

  # Watches OUR OWN ENFORCEMENT. Observability platforms watch agent behaviour
  # and not agent configuration: core.hooksPath was unset on three of five
  # machines, so those actors committed with no hooks at all, indefinitely, and
  # nothing said so. git clone never copies hooks, which is why per-repo
  # .git/hooks cannot be the mechanism and a global hooksPath is.
  - name: mac-config-drift
    scope: pinned
    why_pinned: "polls four hosts over ssh, and only the operator's machine holds that trust -- the overnight host has the aliases and reached 2 of 5"
    unpin_when: "each host attests its own config and nobody polls"
    machine: mac
    # On join, not at 08:50/14:50/20:50. The launchd calendar existed because
    # cron on a laptop dropped runs during sleep and ran mid-wake without an
    # agent socket; a converged join is by definition awake, networked and
    # past the wake, and config_drift_run.sh still resolves the socket itself.
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: "~/Data/.datacore/lib/config_drift_run.sh"
    on_fail: telegram
    artifacts:
      # since: arrival, not join. When the only finding is "unreachable",
      # config_drift_run.sh keeps the previous log -- nothing was learned -- so
      # one flaky host at one join leaves the log untouched. What this contract
      # asserts is that the fleet's config was actually compared, every host
      # answering and none drifted, at least once this session.
      - path: "~/.datacore/state/config-drift.log"
        check: regex
        arg: "0 with drift, 0 unreachable"
        since: arrival
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

  # ORDER IS LOAD-BEARING: ingest at :40, drift check at :50.
  #
  # The drift check compares org against the ledger's projection. Every task
  # captured since the last ingest reads as drift, so running the check first
  # would report a clean system as dirty on any day a task was captured — and
  # since DIP-0046 F2 gates the Phase 1 flip on 14 CONSECUTIVE clean days, that
  # ordering does not merely add noise, it makes the gate unreachable. Observed
  # 2026-08-11: a converge pulled 6 new tasks into 5-plur and projections went
  # 9/9 -> 8/9 until the sweep ran.
  #
  # Both jobs were absent entirely until then. The streak counter only advances
  # when shadow_check RUNS, so an unscheduled check is a clock that never ticks.
  - name: box-ledger-ingest
    machine: box
    # ledger_ingest_hourly.sh runs every hour (:00) on Winston and calls
    # ledger_ingest_org.py, which writes its output to ledger-ingest.log.
    # ledger_daily.sh (35 5 * * *) runs the shadow_check + checkpoint AFTER
    # the 05:00 ingest — it does NOT write to ledger-ingest.log.
    # MOVED TO THE ALWAYS-ON BOX 2026-08-12. On the laptop it slept through
    # its window and missed 9 tasks outright — a sweep that only runs when a
    # laptop is awake is a sweep that mostly does not run, and the ledger is
    # the system's record, not the Mac's.
    schedule: "cron 0 * * * * on the box (hourly)"
    cmd: "~/Data/.datacore/lib/ledger_ingest_hourly.sh"   # winston
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/ledger-ingest.log"
        check: regex
        arg: "0 space\\(s\\) failed"
        max_age_hours: 26

  # ── Phase 1 cycle (DIP-0046) ───────────────────────────────────────────
  # THE ONLY UNVERIFIED STEP IN THE LEDGER LOOP UNTIL 2026-09-09. This cycle
  # ingests org edits into the ledger and regenerates next_actions.org, hourly,
  # on every host. It appeared in NO manifest entry, so nothing ever checked
  # that it ran or that it succeeded -- and it could not have reported failure
  # anyway: the script piped the projector into `grep` and read `$?` from grep,
  # printing `project rc=0` unconditionally. A projection crash exited 0.
  #
  # Verified per host rather than once, because the hosts do not agree: hermes
  # ran the same cycle against clones named `2-plur`/`3-firm`, the projector
  # scopes by directory name, and it therefore projected 6 lines where mac
  # projected 12,956 -- after which the orphan sweep dismissed the missing
  # items INTO THE SHARED LEDGER. 25 such dismissals are on record. Hermes's
  # cron is disabled pending a rename and is deliberately absent here: a
  # contract for a job that must not run would fail forever.
  # mac-phase1-cycle DELETED 2026-09-22 (visitor conversion). On a visitor the
  # join IS the phase-1 cycle: visitor_join.converge() runs
  # ledger_phase1_cycle.sh, and a join counts as converged only when that cycle
  # exits 0 with nothing left unpublished. A second contract on the same cycle,
  # fired hourly by launchd, judged the same work twice on a clock -- and was
  # this machine's largest source of red (201 of 654 in September). Its
  # evidence is mac-join's record now; the hourly agent is gone.

  - name: box-phase1-cycle
    machine: box
    schedule: "cron 25 * * * * on the box"
    cmd: "~/Data/.datacore/lib/ledger_phase1_cycle.sh"   # winston
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/phase1-cycle-status.txt"
        check: regex
        # `^OK ` and nothing looser. The script writes FAIL with the rc when any
        # converge, ingest or projection step fails, and a REFUSED projection is
        # a failure: refusing means the org file holds work the ledger has never
        # seen, which is the one state this loop must never paper over.
        arg: "^OK phase1-cycle"
        # Hourly job. 3h tolerates a missed run and a slow one; a laptop asleep
        # for longer than that has genuinely stopped ingesting, and saying so is
        # the point.
        max_age_hours: 3

  - name: nightshift-phase1-cycle
    machine: nightshift
    schedule: "cron 25 * * * * on nightshift"
    cmd: "~/Data/.datacore/lib/ledger_phase1_cycle.sh"   # nightshift
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/phase1-cycle-status.txt"
        check: regex
        # `^OK ` and nothing looser. The script writes FAIL with the rc when any
        # converge, ingest or projection step fails, and a REFUSED projection is
        # a failure: refusing means the org file holds work the ledger has never
        # seen, which is the one state this loop must never paper over.
        arg: "^OK phase1-cycle"
        # Hourly job. 3h tolerates a missed run and a slow one; a laptop asleep
        # for longer than that has genuinely stopped ingesting, and saying so is
        # the point.
        max_age_hours: 3

  # ── /today registration wiring ─────────────────────────────────────────
  # Every briefing section must have exactly one producer, and every agent a
  # module names must exist. On 2026-09-08 `briefing.yaml` listed eight
  # sections — a stale July copy — while producers existed for sections not in
  # the list and sections in the list had no producer. Four days passed before
  # anyone noticed, because no check could have noticed.
  #
  # Runs HERE and not in GitHub CI: modules are separate repos and
  # briefing.yaml is gitignored, so a bare checkout has neither and the
  # validator would pass vacuously. It now refuses to, and this is the host
  # that actually has the whole tree.
  # THE BOX NEEDS ITS OWN CHECK. Modules are separate repos and several are
  # unreachable from winston — `metacognition` and `health` are not git repos
  # there, `meetings` cannot reach GitHub over https, and `comms`/`nightshift`
  # fail ssh auth. Their wiring got to the box by scp on 2026-09-09, so a
  # redeploy or a fresh clone silently loses it and the briefing quietly
  # composes sections from nothing. This makes that loud.
  - name: box-today-registration
    machine: box
    schedule: "cron 20 3 * * * on the box"
    cmd: "python3 ~/Data/.datacore/lib/today_registry.py --validate"
    # A list, not `true`: jobs/run.py builds a set from it and crashes on a bool
    # (found on the mac's twin, 2026-09-22). Exit 1 is "ran, found problems".
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/today-registration.log"
        check: regex
        # The validator refuses to pass vacuously, so "0 problem(s)" cannot be
        # reached by a host that lost its module manifests — it reports that it
        # cannot verify anything instead.
        arg: "0 problem\\(s\\)"
        # 26h (not 4h): this job runs once daily at 03:20 UTC. The 4h window
        # was narrower than the twice-daily v2-verify (06:00 and 18:00 UTC),
        # so bridge-v2-verify at 18:00 always reported the artifact stale even
        # on a healthy box — a false alarm that hid real failures.
        max_age_hours: 26

  - name: mac-today-registration
    scope: local
    why_local: "validates the module set installed HERE, for interactive /today"
    machine: mac
    # On join: a converged join is when the module set can have changed under
    # /today (it just merged), and it comes before the person runs /today.
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: "cd ~/Data && ~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/today-registration.log -- python3 ~/Data/.datacore/lib/today_registry.py --validate"
    # A list, not `true`: run.py builds a set from it, and `true` crashed the
    # envelope the first time this ran through it (the join, 2026-09-22). The
    # validator exits 1 for "ran, found problems"; the regex below judges that.
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/today-registration.log"
        check: regex
        # The validator refuses to pass vacuously, so "0 problem(s)" cannot be
        # reached by a host that lost its module manifests — it reports that it
        # cannot verify anything instead.
        arg: "0 problem\\(s\\)"
        since: join
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

  - name: box-cadence-liveness
    machine: box
    # THE CATCHER NEEDS A CATCHER. cadence_engine has computed overdue
    # cadences since it was written; nothing read the answer. So
    # cto.daily.pr-review — the cadence whose whole job is catching unreviewed
    # PRs — stopped on 2026-04-17 and nobody noticed for 136 days, while 11 of
    # 18 open PRs sat on unresolved CHANGES_REQUESTED. firm.weekly.portfolio-
    # review, the review that would have caught THAT, was 36 days stale.
    #
    # See 8-firm/1-tracks/ops/closure-diagnosis-2026-08-31.md: infrastructure
    # must leave an artifact and is checked; agent work asserts its own
    # completion and is not. A cadence is agent work. This contract is the
    # smallest change that makes the asymmetry stop applying to it.
    #
    # STARTS RED, DELIBERATELY. 34 cadences are overdue right now. That is the
    # true state and the whole point — the condition was always there and only
    # invisible. Unlike a credential gap, it is actionable: run the cadence or
    # retire it. If it is still red in a month, the answer is to retire what
    # nobody runs, not to widen the threshold.
    schedule: "cron 40 7 * * * on the box"
    cmd: "python3 ~/Data/.datacore/lib/cadence_liveness.py"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/cadence-liveness.log"
        check: regex
        # The last line grew a sunset-review clause on 2026-09-06 (1523c72) and
        # the script crashed on an undefined name until 2026-09-07; both left
        # this contract red for reasons that were not overdue cadences.
        arg: "^0 cadence\\(s\\) overdue; sunset review: 0 past due, [0-9]+ without a review date$"
        max_age_hours: 26

  - name: box-deploy-drift
    machine: box
    # server/deploy.sh refuses to overwrite a box file that differs, but only
    # at the moment someone runs a deploy. Between deploys the divergence is
    # invisible — on 2026-08-31 four deployable scripts differed and THREE
    # were newer on the box, none of it known until a deploy was attempted,
    # and that deploy would have reinstated a rebase/reset --hard sync
    # factory, a broad GH_TOKEN reaching plur-ai/enterprise, a morning check
    # that false-FAILED daily, and a github triage path to a missing script.
    #
    # Runs on the box because the box holds both sides: the private module is
    # checked out there and the running copies are in .datacore/lib.
    schedule: "cron 25 7 * * * on the box"
    cmd: "~/Data/.datacore/lib/cos_deploy_drift.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/deploy-drift.log"
        check: regex
        arg: "^0 file\\(s\\) differ$"
        max_age_hours: 26

  - name: box-fleet-sync
    machine: box
    # DIP-0011 names git_fleet_audit/git_fleet_sync as the default-branch
    # backstop for hosts outside nightshift, "intended to run on a timer on
    # EVERY agent host". Winston was the only host without that timer, which
    # is how it served four days from a stray branch while nightshift, hermes
    # and plur-claw were covered.
    #
    # The timer alone was not enough: a systemd oneshot that fails leaves a
    # `failed` unit and nothing else — no OnFailure, no watcher — which is the
    # same "detected, told nobody" failure the stray branch already
    # demonstrated (cos_sync logged it 1,326 times). This contract is what
    # turns the artifact into an alert.
    #
    # Asserts the SUMMARY line rather than the absence of the word "FAIL":
    # unreachable repos are reported in the body by design and must not read
    # as failure, or the check goes permanently red on a credential gap and
    # stops being read.
    schedule: "systemd datacore-fleet-sync.timer, 06:10 and 18:10 UTC on the box"
    cmd: "python3 ~/Data/.datacore/lib/git_fleet_sync.py ~/Data --execute --pull"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/fleet-sync.log"
        check: regex
        # Written by the unit's StandardOutput. Any FAIL: line ends the run
        # before this summary is printed, so its presence IS the pass.
        arg: "Committed [0-9]+ file\\(s\\)"
        max_age_hours: 26

      # CATEGORY FIX 2026-09-03: this is a MIGRATION GATE, not a fault.
      # shadow_check.py's own docstring: "The migration's flip to Phase 1 is
      # gated on N consecutive days of a clean diff." A gate that reads "not
      # ready yet" is the expected state for the whole length of a migration —
      # it had alerted 23 consecutive times, correctly, and none of them was an
      # incident. Asserting `"all_clean": true` here turned a progress gauge
      # into a daily alarm, which is how a real alert gets ignored.
      #
      # What IS worth verifying is that the gate RAN. Freshness stays; the
      # all_clean assertion is dropped. Progress belongs in the briefing, where
      # "7/9 spaces clean, streak 0" reads as a number to move rather than a
      # failure to triage.
  - name: box-projection-drift
    machine: box
    schedule: "cron 35 5 * * * on the box (runs after the ingest, same script)"
    cmd: "~/Data/.datacore/lib/ledger_daily.sh"   # winston
    on_fail: telegram
    artifacts:
      # Assert on the JSON, not on "9/9" in the log: a hardcoded space count
      # turns adding a tenth space into a false alarm, and the fix for a false
      # alarm is usually to stop believing the alarm.
      - path: "~/.datacore/state/shadow-status.json"
        check: no_crash
        max_age_hours: 26

  # The commit gate deliberately never blocks — nightshift runs ~20 tasks with
  # nobody awake, and waiting for an answer turns one unreviewed commit into a
  # stalled queue. The cost is that withheld work is invisible unless counted.
  # Age, not volume, is the signal: last night's decisions are the gate working;
  # the same ones in a fortnight mean the backlog has become a wastebasket, and
  # the gate is then discarding work while appearing to protect it.
  - name: mac-pending-decisions
    scope: local
    why_local: "decisions waiting in this machine's working tree"
    machine: mac
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: "~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/pending-decisions.log -- python3 ~/Data/.datacore/lib/detectors/pending_decisions.py"
    # Exit 1 is "ran, found stale decisions" -- a finding, which the regex
    # below reports; only exit 2 is the detector failing to run.
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/pending-decisions.log"
        check: regex
        arg: "0 older than"
        since: join
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

  # Every space's history, not the root's telemetry (OPS-3, 2026-09-26): the
  # old command verified --space ~/Data, which holds no space events and said
  # "OK 2 files" every day. ledger_daily.sh (05:35) verifies each space that
  # has an event log and writes this artifact, last line OK / FAIL / NONE.
  - name: box-ledger-verify
    machine: box
    schedule: "35 5 * * *"
    cmd: "~/Data/.datacore/lib/ledger_daily.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/ledger-verify.log"
        check: regex
        arg: "^OK "
        max_age_hours: 26

  # Agent registry integrity. registry_gc.py existed and was never scheduled --
  # capability with no runner. Contracted on "duplicate keys (0)", an
  # unambiguous corruption signal that is TRUE today, rather than on
  # "orphaned (0)", which is 13 as of 2026-08-10 and would make this check born
  # red. Alert fatigue is a failure mode, not a stricter standard: the orphan
  # count is in the log for review, and this contract fires on regression.
      # MACHINE FIX 2026-09-03: this was declared on `box` and was never
      # scheduled there — correctly, as it turns out. registry_gc prunes
      # registry entries whose agent definition file is missing, and winston
      # has the health module DIRECTORY with zero agent files in it (partial
      # deployment). A --check there reports 13 orphans; all 13 exist and work
      # on the mac. Running it on box would have deleted valid entries.
      #
      # A garbage collector must run where the full set is visible. On the mac
      # --check reports 125 active, 0 orphaned, 0 bak, 0 duplicates — clean.
      # Moved to `mac` rather than scheduled on `box`, which is why it had
      # alerted every morning about a job nobody could safely run.
  # mac-registry-gc DELETED 2026-09-22 (visitor conversion; pinned debt 3 -> 2).
  # Its contract asserted one thing, "duplicate keys (0)". The rest of what the
  # tool reports -- sources that do not resolve, agent files nobody registered --
  # was already bound by tests/test_registry_grounded.py, and the duplicate-key
  # check is now a test there too. The registry is gated where it is edited
  # (every commit, and the suite audit, which runs lib/tests on the one complete
  # replica) instead of polled once a day on a clock.

  - name: box-briefing
    machine: box
    schedule: "0 4 * * *"
    cmd: "~/Data/.datacore/lib/cos_morning.sh"
    # Staleness gate: 0-personal holds the journal file asserted below.
    # If Winston's checkout is behind upstream, the journal on disk may be
    # days old (observed 2026-08-20 through 2026-08-24: 0-personal was 318
    # commits behind; Winston read a 439-byte stub and reported "content
    # mismatch" for five consecutive days instead of "unverifiable: stale
    # input"). A host that cannot sync must not emit confident wrong verdicts.
    require_synced_repos:
      - "~/Data/0-personal"
    artifacts:
      # cos_verify_morning.py:check_briefing -- BRIEFINGS/<day>/app-briefing.json,
      # must have a headline and _meta (generated_at/quality checked there too,
      # but json_has_keys only asserts top-level key presence).
      - path: "~/.datacore/cos/briefings/*/app-briefing.json"
        check: json_has_keys
        arg: ["headline", "_meta"]
        max_age_hours: 26
      - path: "~/.datacore/cos/morning.log"
        check: no_crash
        max_age_hours: 26
      # A heading is not a briefing. This must match a section that only a
      # populated briefing produces -- "Your Agenda" is written from
      # calendar+GTD state, so it is absent when generation fails partway.
      # Matching just "^##\\s+(Daily Briefing|Good Morning)" is too weak: a
      # file containing nothing but that heading would pass.
      #
      # HEADING LEVEL, fixed 2026-09-02: this said "^###\\s+Your Agenda" (H3)
      # from 2026-08-10. There are TWO briefing generators and they disagree.
      # The nightshift orchestrator writes H3 -- verified in the 06:00 run in
      # 0-personal/notes/journals/2026-09-02.md, which carries "### Good
      # Morning" / "### The World" / "### Your Agenda". The interactive
      # /today writes H2, matching its own command spec and the prompt
      # template at today_orchestrator.py:1281 and :2167. So the H3 form
      # matched the overnight run and missed every interactive one, and
      # box-briefing FAILED on complete briefings (08-27, 09-01, 09-02
      # confirmed) whenever the interactive briefing was the one on disk.
      # The sibling check in cos_verify_morning.py:check_journal_briefing was
      # RETIRED 2026-08-27 (datacore#54) for the same class of false alarm;
      # its own docstring is the rule: "A verifier stricter than the pipeline
      # it verifies produces false alarms, and false alarms are how a real one
      # gets ignored." This copy was missed in that retirement.
      # {2,3} accepts either level so a future heading change cannot silently
      # re-break it.
      # GLOB, not {today}: this job runs at 04:00 and the file it asserts is
      # the file it WRITES, so between midnight and 04:00 the contract demanded
      # a journal that cannot exist yet and reported box-briefing FAILED. The
      # scheduled verifier runs at 08:00 and never saw it; anyone running
      # job_verify by hand in those four hours did. checks.py already documents
      # this exact shape -- "a {today} path therefore fails every night between
      # midnight and that first event ... a nightly false alarm is one people
      # learn to ignore" -- and resolves a glob to its NEWEST match for it.
      # Freshness is the liveness signal; the filename is not.
      #
      # Dated names only: `*.md` would also match tomorrow-priorities.md, which
      # lives in this directory and carries no briefing block. The pattern must
      # contain a literal `*` -- expand_path() only globs when it sees one, so
      # a character class alone comes back as the literal pattern and reads as
      # "does not exist".
      - path: "~/Data/0-personal/notes/journals/20*-*-*.md"
        check: regex
        # ASSERT WHAT THE PRODUCER GUARANTEES, NOT A TITLE THE MODEL CHOSE.
        # "Your Agenda" was a section in nightshift's /today template. When
        # the briefing moved to Winston on 2026-09-08 (one producer per
        # artifact) the journal block became a render of the MODEL's own
        # sections — Good Morning, The World, The Ask, Focus — and this
        # contract began failing on a heading nothing emits any more. It had
        # already failed this way once before, on 2026-08-16.
        #
        # The heading is the structural guarantee: cos_journal.py always
        # writes "## Daily Briefing" and replaces that block in place. A
        # section title is a model's choice and will change again.
        arg: '^##\s+Daily Briefing'
        max_age_hours: 26
      # cos_verify_morning.py:check_audio -- AUDIO_STAMP, written by
      # winston_audio.sh only after Telegram accepts the voice message.
      - path: "~/.datacore/cos/audio-last-ok"
        check: no_crash
        max_age_hours: 26
      # WHICH SCRIPT WAS SPOKEN, not only that a voice message went out (fleet sim
      # 2026-10-03, break 10): a plain read-out after two narration timeouts passed
      # this job while cos_verify_morning.py:check_audio went red. Same rule as the
      # morning check (winston_speak.py records the mode), so the two cannot disagree.
      - path: "~/.datacore/cos/audio-script.json"
        check: regex
        arg: '"mode": "llm-native"'
        max_age_hours: 26
    # cos_morning.sh:6 exports CLAUDE_CODE_OAUTH_TOKEN explicitly from
    # /etc/datacored.env -- cos_verify_morning.py's check_credentials exists
    # because a missing token is exactly the failure mode that has bitten
    # this job before (2026-07-28, per its docstring).
    required_env: ["CLAUDE_CODE_OAUTH_TOKEN"]
    on_fail: telegram

  # The morning's catch-up (fleet sim 2026-10-03, break 2). A reboot 4 s into the
  # 04:00 run left no briefing and no audio, and nothing re-ran it. Hourly inside
  # the morning window, cos_morning_run.py re-runs a run that never finished,
  # after telling The Firm group the host and the cause (restarted while it ran /
  # process gone / never started); a finished run is never repeated. It runs from
  # the module clone (no lib/ link needed) and is installed by
  # cos-server-setup.sh's pipeline step. Its log keeps one verdict line per run.
  - name: box-briefing-catchup
    machine: box
    schedule: "30 4-8 * * *"
    cmd: "/usr/bin/python3 ~/Data/.datacore/modules/chief-of-staff/server/lib/cos_morning_run.py catch-up >> ~/.datacore/cos/morning-catchup.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/morning-catchup.log"
        check: last_line_regex
        arg: 'morning catch-up: (done|running|re-run finished rc=0)'
        max_age_hours: 26

  - name: box-inbox
    machine: box
    schedule: "0 5 * * *"
    cmd: "~/Data/.datacore/lib/cos_inbox.sh >> ~/.datacore/cos/inbox.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/inbox.log"
        check: no_crash
        max_age_hours: 26

  - name: box-research
    machine: box
    schedule: "30 5 * * *"
    cmd: "~/Data/.datacore/lib/cos_research.sh >> ~/.datacore/cos/research.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/research.log"
        check: no_crash
        max_age_hours: 26

  - name: box-health-digest
    machine: box
    schedule: "15 7 * * *"
    cmd: "~/Data/.datacore/lib/cos_health_digest.sh >> ~/.datacore/cos/health.log 2>&1"
    on_fail: telegram
    artifacts:
      # cos-server-setup.sh:79 pins the exact crontab line + redirect target.
      # The digest writes its verdict last (see cos_health_digest.sh), which is
      # what distinguishes "it ran" from "its log still holds what it wrote
      # yesterday" -- it failed to execute at all on 2026-09-17 and this
      # contract passed.
      - path: "~/.datacore/cos/health.log"
        check: last_line_regex
        arg: 'health digest complete: [0-9]+ issue'
        max_age_hours: 26

  - name: box-tomorrow
    machine: box
    schedule: "0 20 * * *"
    cmd: "~/Data/.datacore/lib/cos_tomorrow.sh >> ~/.datacore/cos/tomorrow.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/tomorrow.log"
        check: no_crash
        max_age_hours: 26

  - name: box-cos-sync
    machine: box
    schedule: "*/15 * * * *"
    cmd: "~/Data/.datacore/lib/cos_sync.sh >> ~/.datacore/cos/sync.log 2>&1"
    artifacts:
      # log_max_age dict in cos_verify_morning.py:check_ops gives sync.log
      # exactly 1h -- the tightest bucket, matching the 15-min cadence.
      - path: "~/.datacore/cos/sync.log"
        check: no_crash
        max_age_hours: 1
    on_fail: telegram

  # ── box jobs the installers schedule that had no entry (OPS-1, 2026-09-27) ──
  # Each was in winston's crontab and in no list, so a job that stopped would
  # never have been noticed. Artifacts are what each run actually writes.
  - name: box-verify-morning
    machine: box
    schedule: "0 8 * * *"
    cmd: "~/Data/.datacore/lib/cos_verify_morning.sh >> ~/.datacore/cos/verify.log 2>&1"
    on_fail: telegram
    artifacts:
      # cos_verify_morning.py prints "<date>: all checks passed" or
      # "<date>: FAILED: ..." as its last line every run; the morning check
      # alerts on its own FAILED, so this contract only asks that it ran.
      - path: "~/.datacore/cos/verify.log"
        check: last_line_regex
        arg: '^\d{4}-\d{2}-\d{2}: (all checks passed|FAILED)'
        max_age_hours: 26

  - name: box-restore-check
    machine: box
    schedule: "10 3 * * 0"
    cmd: "~/Data/.datacore/lib/cos_restore_check.sh >> ~/.datacore/cos/restore-check.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/restore-check.log"
        check: last_line_regex
        arg: 'restore-check ok'
        max_age_hours: 170   # weekly

  - name: box-reconcile-timers
    machine: box
    schedule: "20 * * * *"
    cmd: "~/Data/.datacore/lib/ops_reconcile_timers.sh"
    on_fail: telegram
    artifacts:
      # reconcile.log is written only on drift ("a growing log IS the alert"),
      # so its age says nothing about whether the job runs. The script stamps
      # every run's exit code here.
      - path: "~/.datacore/cos/reconcile.last-run"
        check: regex
        arg: 'rc=0'
        max_age_hours: 2

  - name: box-token-health
    machine: box
    schedule: "50 6 * * *"
    cmd: "/usr/bin/python3 ~/Data/.datacore/lib/cos_token_health.py >> ~/.datacore/cos/token-health.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/token-health.log"
        check: no_crash
        max_age_hours: 26

  - name: box-lens-analyze
    machine: box
    schedule: "55 3 * * *"
    cmd: "/usr/bin/python3 ~/Data/.datacore/lib/lens_analyze.py --profile-out >> ~/.datacore/cos/lens.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/lens.log"
        check: no_crash
        max_age_hours: 26

  - name: box-setup-verify
    machine: box
    schedule: "10 7 * * *"
    cmd: 'sudo -n ~/Data/.datacore/lib/cos-server-setup.sh --verify 2>&1 | sed "s/^/$(date +%F) /" >> ~/.datacore/cos/verify-daily.log'
    on_fail: telegram
    artifacts:
      # Every line is prefixed with the date by the crontab's sed; the verdicts
      # themselves are the reliability scoreboard's to read.
      - path: "~/.datacore/cos/verify-daily.log"
        check: no_crash
        max_age_hours: 26

  - name: box-heartbeat
    machine: box
    schedule: "*/5 * * * *"
    cmd: "touch ~/.datacore/cos/heartbeat"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/heartbeat"
        check: exists
        max_age_hours: 1

  # Every agent host copies its own Claude transcripts nightly (MEM-67): installed
  # by agent_host_setup.sh under the cron key `sync-traces`, so the crontab line is
  # tagged `# datacore-job:sync-traces` on every host and the box's entry carries
  # that exact name. sync_traces.sh stamps one line per run into
  # ~/.datacore/state/sync-traces.last (the redirected log is not the artifact).
  - name: sync-traces
    machine: box
    schedule: "10 0 * * *"
    cmd: "TRACES_DEST=~/.datacore/traces/claude-code bash ~/Data/.datacore/lib/sync_traces.sh >> ~/.datacore/state/sync-traces.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/sync-traces.last"
        check: regex
        arg: 'sync_traces: \d+ transcript'
        max_age_hours: 26

  # The box's two cadences (DIP-0050), installed by the ventures module's
  # cadence_schedule_sync.py as `# datacore-job:<slug>` lines and declared by that
  # module (module.yaml schedules:, MOD-3). cadence_run.py runs the duty's script
  # and judges it by the evidence its template declares
  # (.datacore/templates/cadences/{briefing,weekly-plan}.md); these contracts read
  # that same evidence. The scripts' own outputs stay box-briefing and
  # box-weekly-plan, whose cron lines these cadences replaced.
  - name: cadence-firm-cos-briefing
    machine: box
    schedule: "0 4 * * *"
    cmd: "DATACORE_ROOT=~/Data /usr/bin/python3 ~/Data/.datacore/modules/ventures/lib/cadence_run.py cadence-firm-cos-briefing >> ~/.datacore/state/cadence-run.log 2>&1"
    on_fail: telegram
    artifacts:
      # The template's evidence: today's journal carries the briefing section.
      # A glob (newest journal), not {today}: the run is at 04:00 and the hourly
      # verifier would otherwise read a missing file every night before it.
      - path: "~/Data/0-personal/notes/journals/20*-*-*.md"
        check: regex
        arg: '^## Daily Briefing'
        max_age_hours: 26

  - name: cadence-firm-cos-weekly-plan
    machine: box
    schedule: "0 7 * * 0"
    cmd: "DATACORE_ROOT=~/Data /usr/bin/python3 ~/Data/.datacore/modules/ventures/lib/cadence_run.py cadence-firm-cos-weekly-plan >> ~/.datacore/state/cadence-run.log 2>&1"
    on_fail: telegram
    artifacts:
      # The template's evidence: the plan page written into the owner's space.
      - path: "~/Data/0-personal/notes/pages/weekly-plan-*.md"
        check: regex
        # "Weekly Plan — 2026-W40" (the template) or "Weekly Plan: 2026-W40" (the
        # owner's own W40 run, 2026-09-28): the page is the evidence, not its dash.
        arg: '^# Weekly Plan ?[:—] [0-9]{4}-W[0-9]{2}'
        max_age_hours: 170

  # AUD-6: the morning after each audit night, the box checks the night's
  # findings files (cross_model_audit.py check) and tells The Firm group when
  # an agent's audit is missing or invalid (--send). No --write: the check
  # only reads; publishing aggregates commits into the system space, and the
  # box resolves that space through install.yaml. Every run prints one
  # "cross_model_audit check <night>: ..." line, so the log shows the run.
  - name: box-audit-check
    machine: box
    schedule: "40 6 * * *"
    cmd: "DATACORE_ROOT=~/Data /usr/bin/python3 ~/Data/.datacore/lib/cross_model_audit.py check --send >> ~/.datacore/state/audit-check.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/audit-check.log"
        check: regex
        arg: 'cross_model_audit check [0-9]{4}-[0-9]{2}-[0-9]{2}: '
        max_age_hours: 26

  # The box's own audit slice and its weekly calibration (AUD-1, AUD-4), and the
  # morning publish (AUD-3). Neutral commands: the agent comes from
  # DATACORE_POLICY_PRINCIPAL; an install's exact lines, naming its agent, are
  # in manifest.local.yaml. Each run writes one findings file, validates its
  # pins where it was written, and commits only that file. Once a week, on the
  # agent's own night (AUD-1); an install's lines add --issues once the host's
  # gh acts as that agent's own GitHub account.
  - name: box-audit-nightly
    machine: box
    schedule: "25 1 * * 2"
    cmd: "DATACORE_ROOT=~/Data /usr/bin/python3 ~/Data/.datacore/lib/cross_model_audit.py nightly --commit >> ~/.datacore/state/audit-nightly.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/audit-nightly.log"
        check: regex
        arg: 'pins validated at write time'
        max_age_hours: 170

  - name: box-audit-calibration
    machine: box
    schedule: "25 2 * * 0"
    cmd: "DATACORE_ROOT=~/Data /usr/bin/python3 ~/Data/.datacore/lib/cross_model_audit.py calibrate --commit >> ~/.datacore/state/audit-calibration.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/audit-calibration.log"
        check: regex
        arg: 'pins validated at write time'
        max_age_hours: 170

  - name: box-audit-publish
    machine: box
    schedule: "50 6 * * *"
