    scope: local
    why_local: "publishes this machine's own ledger writes"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: "DATACORE_ROOT=~/Data /opt/homebrew/bin/python3 ~/Data/.datacore/lib/ledger_publish_safe.py >> ~/.datacore/state/ledger-publish.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/ledger-publish.log"
        check: last_line_regex
        arg: 'run complete'
        since: join
        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

  - name: mac-bench
    scope: pinned
    why_pinned: "the benchmark project is checked out on this machine"
    unpin_when: "datacore-bench runs in CI"
    machine: mac
    schedule: "launchd com.datacore.bench: Sunday 03:00"
    cmd: '/bin/bash ~/Data/"$(python3 ~/Data/.datacore/lib/spaces.py role system)"/2-projects/datacore-bench/bench.sh'
    on_fail: telegram
    artifacts:
      # The plist's StandardOutPath. /tmp is cleared by a reboot, so a reboot
      # early in the week reads as a missing run until Sunday.
      - path: "/tmp/datacore-bench-stdout.log"
        check: no_crash
        max_age_hours: 170

  - name: mac-daily-briefing-open
    scope: local
    why_local: "opens the briefing on this machine's screen"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    # The first arrival after 08:25, once a day (was a launchd calendar, weekdays).
    trigger: arrival
    every: day
    after: "08:25"
    schedule: "on arrival: visitor_join.py runs it at the first converged join or tick once its window opens (every day, not before its after hour)"
    cmd: "~/Data/.datacore/lib/open_daily_briefing.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/daily-briefing-open.log"
        check: no_crash
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  - name: mac-morning-journal
    scope: local
    why_local: "opens the journal on this machine"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    # The first arrival after 08:30, once a day. A run that finds no journal yet
    # exits 1 and the join retries it two hours later (the old second shot).
    trigger: arrival
    every: day
    after: "08:30"
    schedule: "on arrival: visitor_join.py runs it at the first converged join or tick once its window opens (every day, not before its after hour)"
    cmd: "/usr/bin/python3 ~/Data/.datacore/lib/morning_journal.py >> ~/.datacore/state/morning-journal.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/morning-journal.log"   # was launchd's /tmp StandardOutPath
        check: no_crash
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  - name: mac-session-learning
    scope: local
    why_local: "extracts learning from this machine's sessions"
    machine: mac
    schedule: "launchd io.datacore.session-learning: 01:00"
    cmd: "~/Data/.datacore/lib/session_learning_daily.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/session-learning.log"
        check: no_crash
        max_age_hours: 26

  - name: mac-smoke
    scope: local
    why_local: "the owner's morning smoke test, read on this machine"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    # The first arrival after 08:40, once a day. Findings exit 1 and alert on
    # their own; the contract is that the smoke ran and wrote its summary line.
    trigger: arrival
    every: day
    after: "08:40"
    schedule: "on arrival: visitor_join.py runs it at the first converged join or tick once its window opens (every day, not before its after hour)"
    cmd: "python3 ~/Data/.datacore/lib/smoke.py >> ~/.datacore/state/smoke.log 2>&1"
    exit_ok: [0, 1]
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/smoke.log"   # was launchd's /tmp StandardOutPath
        check: last_line_regex
        arg: '^smoke \d{4}-\d{2}-\d{2}:'
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  - name: mac-state-sync
    scope: local
    why_local: "pulls fleet state onto this machine"
    machine: mac
    # A stream, not a duty: launchd re-runs it every 300 s, only while awake.
    trigger: awake
    schedule: "while awake: launchd StartInterval 300s stream (io.datacore.state-sync, RunAtLoad)"
    cmd: "/bin/bash ~/Data/.datacore/lib/sync_state_from_nightshift.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state-sync.log"
        check: no_crash
        max_age_hours: 1

  - name: mac-health-sync
    scope: local
    why_local: "the health data this machine's practice space owns"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    # The first arrival after 07:30, once a day (the night's ring data is in by then).
    trigger: arrival
    every: day
    after: "07:30"
    schedule: "on arrival: visitor_join.py runs it at the first converged join or tick once its window opens (every day, not before its after hour)"
    cmd: 'python3 ~/Data/"$(python3 ~/Data/.datacore/lib/spaces.py role practice)"/2-projects/health-dashboard/scripts/backfill.py --source oura,withings --start "$(date -v-3d +%Y-%m-%d)" >> ~/.datacore/health/sync.log 2>&1'
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/health/sync.log"
        check: no_crash
