  # 06:00 overnight run and the 06:10 fleet sync. The history (last 14 boards)
  # is in ~/.datacore/state/promise-scoreboard/.
  - name: nightshift-promise-scoreboard
    machine: nightshift
    schedule: "30 4 * * *"
    cmd: "python3 ~/Data/.datacore/lib/promise_nightly.py >> ~/.datacore/state/promise-nightly.log 2>&1"
    on_fail: telegram
    artifacts:
      # The last line is the run's verdict. "alert NOT delivered" or "FAILED to
      # run" fail this contract; reds found are the message's job, not this one's.
      - path: ~/.datacore/state/promise-nightly.log
        check: last_line_regex
        arg: '^promise-scoreboard: \d+ green, \d+ red, \d+ could not run here; \d+ turned red, \d+ recovered; alert (sent|none)$'
        max_age_hours: 26
