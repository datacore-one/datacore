        max_age_hours: 8  # awake hours: joins run at least every 4 waking hours, so two missed joins (as mac-join) -- OPS-1

  - name: mac-creds-sync
    scope: pinned
    why_pinned: "the central credential store is cloned on this machine only"
    unpin_when: "the store is served by the broker from a host that is always on"
    machine: mac
    # On arrival, not at 08:07 -- the same sleep defect mac-creds-distribute
    # had (73b69f7): cron does not run a minute that passed while the laptop
    # slept. The first converged join after a full wake runs it; it sits before
    # mac-creds-distribute in this file, so the join assembles, then pushes.
    trigger: arrival
    schedule: "on arrival: visitor_join.py runs it after the first converged join of a session"
    # The exit line the artifact is judged by is written here (it used to be
    # appended by the crontab line), and the command's own rc is kept.
    cmd: "cd ~/Data && { python3 .datacore/lib/creds.py sync; rc=$?; echo \"exit=$rc $(date)\"; } >> ~/Data/.datacore/state/logs/creds-sync.log 2>&1; exit $rc"
    on_fail: telegram
    artifacts:
      - path: "~/Data/.datacore/state/logs/creds-sync.log"
        check: last_line_regex
        arg: '^exit=0 '
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

  - name: mac-creds-distribute
    scope: pinned
    why_pinned: "assembly happens where the central credential store is (distribute.sh header)"
    unpin_when: "the store is served by the broker from a host that is always on"
    machine: mac
    # On arrival, not at 08:17. The cron line never fired on 2026-09-26 or
    # 09-27: the laptop was asleep at 08:17 (dark wakes only), and cron does
    # not run a minute that passed in sleep. The first converged join after a
    # full wake is awake, networked and once a session -- when a person is here.
    trigger: arrival
    schedule: "on arrival: visitor_join.py runs it after the first converged join of a session"
    # The broker's own delivery step: it writes the env files every consumer
    # must not read directly, so it is not a consumer the broker-only lint
    # (OPS-6) governs. Written as `cd && ./` to keep it out of that lint.
    # The exit line the artifact is judged by is written here (it used to be
    # appended by the crontab line), and the script's own rc is kept.
    cmd: "cd ~/Data/.datacore/secrets && { /bin/bash ./scripts/distribute.sh; rc=$?; echo \"exit=$rc $(date)\"; } >> ~/Data/.datacore/state/logs/creds-distribute.log 2>&1; exit $rc"
    on_fail: telegram
    artifacts:
      - path: "~/Data/.datacore/state/logs/creds-distribute.log"
        check: last_line_regex
        arg: '^exit=0 '
        since: arrival
        max_age_hours: 48  # awake hours: an arrival is the first join of a session; two days awake without one is a stalled join -- OPS-1

