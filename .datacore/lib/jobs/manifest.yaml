    cmd: "~/Data/.datacore/lib/atomic_out.sh ~/.datacore/state/knowledge-personal-backup.log -- python3 ~/Data/.datacore/lib/sqlite_push.py ~/Data/0-personal/.datacore/knowledge.db nightshift backups/knowledge/knowledge-personal.db"
    on_fail: telegram
