    scope: local
    why_local: "the NotebookLM login lives in this machine's browser"
    machine: mac
    # Owner decision 2026-10-02: the mac is a visitor; its duties run when the
    # owner arrives, never on a clock.
    trigger: join
    schedule: "on join: visitor_join.py runs it after every converged join"
    cmd: "/opt/homebrew/bin/python3 ~/Data/.datacore/modules/research/lib/nlm_auth_sync.py sync >> ~/Data/.datacore/logs/nlm-auth-sync.log 2>&1"
    on_fail: telegram
