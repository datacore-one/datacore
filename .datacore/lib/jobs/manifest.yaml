# Job manifest — every scheduled job on the three Datacore machines
# (mac, box, nightshift), for the unified job_verify.py verifier.
#
# Schema: .datacore/lib/jobs/manifest.py (load_manifest). Paths support
# `{today}` (local YYYY-MM-DD) and `~` (expanded on whichever machine
# job_verify.py runs on -- it is meant to run locally on each machine).
#
# Honesty rule: every artifact path below was derived from evidence read
# in this repo (scripts, systemd units, launchd plists, or source code),
# not invented. Where a path is inferred rather than directly traced to a
# writer, a `# TODO(verify-on-<machine>)` comment says so and names the
# evidence. Task 2.4 brief: .superpowers/sdd/2026-07-29-datacore-v2/task-2.4-brief.md
#
# on_fail policy (conservative default, Phase 6 tunes): briefing, cos_sync,
# and backup alert via telegram; everything else logs only.
#
# Evidence sources (read in full before writing this file):
#   - modules/chief-of-staff/server/lib/cos_verify_morning.py (briefing/journal/log assertions + check_ops log_max_age dict)
#   - modules/chief-of-staff/server/COS-SERVER.md ("Cron schedule (root crontab, UTC)" table)
#   - modules/chief-of-staff/server/cos-server-setup.sh (exact crontab lines for backup + health-digest)
#   - modules/chief-of-staff/server/lib/cos_*.sh (each box script read directly)
#   - modules/mail/server/triage-email.sh (email triage state paths)
#   - modules/github/server/triage-github.sh (github triage cache paths)
#   - modules/nightshift/server/nightshift-*.{service,timer} (six target timers: exact OnCalendar + ExecStart)
#   - modules/nightshift/manifest.py + lib/postprocess.py + lib/run.py (nightshift-overnight's manifest-{today}.yaml, traced end to end)
#   - modules/outbox/lib/archive_sync.py (nightshift-outbox: stdout-only JSON, no persisted file found)
#   - modules/nightshift/lib/today_orchestrator.py (market-phase* freshness glob, reader side only)
#   - modules/nightshift/CLAUDE.md ("Output Location" + service unit Descriptions for inbox-process)
#   - .datacore/lib/audit_public_repos_wrapper.sh (public-repo-audit-last.json)
#   - .datacore/lib/agent_stream_rsync.sh + com.datacore.agent-stream-rsync.plist (mac rsync)
#   - modules/lens/scripts/com.datacore.lens.plist + modules/lens/CLAUDE.base.md + docs/OVERVIEW.md (mac lens runner)
#   - live filesystem check on this Mac: ~/.datacore/lens/observations.db and
#     /tmp/datacore-agent-stream-rsync.log both exist (confirmed directly, not inferred)

version: 1
jobs:
  # ── box (Winston / cos-server), root crontab, UTC ────────────────────────

  - name: box-backup
    machine: box
    schedule: "30 2 * * *"
    cmd: "~/Data/.datacore/lib/cos_backup.sh"
    artifacts:
      # cos-server-setup.sh:78 pins the exact crontab redirect target.
      # cos_backup.sh's own tar output has a timestamp in the filename
      # (plur-state-<ts>.tar.gz) so it can't be a literal path -- the log
      # is the stable artifact.
      - path: "~/.datacore/cos/backup.log"
        check: nonempty
        max_age_hours: 26
    on_fail: telegram

  - name: box-news
    machine: box
    schedule: "0 3 * * *"
    cmd: "~/Data/.datacore/lib/cos_news.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/news.log"
        check: nonempty
        max_age_hours: 26

  - name: box-email-triage
    machine: box
    schedule: "30 3 * * *"
    cmd: "~/Data/.datacore/modules/mail/server/triage-email.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/email-triage.log"
        check: nonempty
        max_age_hours: 26
      # triage-email.sh's own AUDIT_LOG -- one JSONL line appended per run,
      # per account. Direct script evidence, independent of the cron redirect.
      - path: "~/Data/.datacore/state/mail/audit.jsonl"
        check: nonempty
        max_age_hours: 26

  - name: box-github-triage
    machine: box
    schedule: "45 3 * * *"
    cmd: "~/Data/.datacore/lib/cos_github.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/github-triage.log"
        check: nonempty
        max_age_hours: 26
      # triage-github.sh: SCAN_FILE="$CACHE_DIR/scan_cache.json", written by
      # github_scanner.py --format json.
      - path: "~/Data/.datacore/modules/github/data/scan_cache.json"
        check: nonempty
        max_age_hours: 26

  - name: box-merge-runs
    # 50 3, not 45 3: deliberately off cos_sync.sh's */15 grid (:00/:15/
    # :30/:45) -- the merge critical section takes a per-repo flock, but
    # cos_sync.sh itself does not lock, so this also shrinks the window
    # where the two could race on the same space repo (2026-08-01
    # adversarial-review Critical 1). Still before box-briefing (0 4).
    machine: box
    schedule: "50 3 * * *"
    cmd: "~/Data/.datacore/lib/cos_merge_runs.sh"
    artifacts:
      # cos_merge_runs.py's own status artifact (task-2.4-style companion:
      # see .superpowers/sdd/2026-07-29-datacore-v2/cos-merge-runs-report.md).
      # Must exist, be fresh, and carry both top-level keys.
      - path: "~/.datacore/cos/merge_runs_status.json"
        check: json_has_keys
        arg: ["generated_at", "stale_branches"]
        max_age_hours: 26
      # Same file, a second and stricter artifact entry: a non-empty
      # stale_branches means a nightshift run branch has sat unmerged for
      # >24h without Winston resolving it -- worth a distinct regex check
      # rather than folding into the json_has_keys entry above, since
      # "the key exists" and "the key is the empty list" are different
      # failure signals worth telling apart in job_verify's output.
      - path: "~/.datacore/cos/merge_runs_status.json"
        check: regex
        arg: '"stale_branches": \[\]'
        max_age_hours: 26
      # Third entry, same file again: errors[] must be empty too -- a
      # per-repo fetch/merge/push failure (e.g. a bad credential) is a
      # real operational problem worth paging on, distinct from both
      # checks above (2026-08-01 adversarial-review Important 4).
      - path: "~/.datacore/cos/merge_runs_status.json"
        check: regex
        arg: '"errors": \[\]'
        max_age_hours: 26
    on_fail: telegram

  # Ledger chain integrity. The hash chain can DETECT retroactive tampering,
  # but nothing ran the check -- a capability with no runner is the same
  # silent-failure shape this manifest exists to close. Verified 2026-08-10 by
  # flipping a payload byte mid-chain: `ledger_cli verify` reported
  # "line 251: hash mismatch". The regex below is a CONTENT check, not a
  # freshness proxy: a tampered chain writes the mismatch instead of "OK".
  # DIP-0046 Track A. Both detectors report POSITIVELY — a count, never merely
  # the absence of an alarm — because silence is consistent with "nothing is
  # wrong" and with "the detector did not run", and telling those apart is the
  # entire purpose (DIP-0046 §8).
  #
  # --fetch is REQUIRED here and not merely allowed. Without it seq-gap compares
  # against a stale remote-tracking ref and cannot see work a THIRD machine
  # pushed, which is the cross-machine blindness the critic flagged: a missing
  # push would look identical to a slow one, the exact defect this detects.
  - name: mac-seq-gap
    machine: mac
    schedule: "10 * * * *"
    cmd: "python3 ~/Data/.datacore/lib/detectors/seq_gap.py --fetch > ~/.datacore/state/seq-gap.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/seq-gap.log"
        check: regex
        # BOTH counts, not just the first. This regex was "0 with unpublished
        # events" alone, which passes a run reporting "0 with unpublished
        # events, 9 error(s)" — nine logs the detector could not verify at all
        # because their remote was down. A contract that ignores the error count
        # certifies exactly what was never checked.
        arg: "0 with unpublished events, 0 error"
        max_age_hours: 26

  - name: mac-actor-presence
    machine: mac
    schedule: "25 * * * *"
    cmd: "python3 ~/Data/.datacore/lib/detectors/actor_presence.py > ~/.datacore/state/actor-presence.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/actor-presence.log"
        check: regex
        arg: "0 failing"   # suffix may follow (never-written count); anchor on this
        max_age_hours: 26

  # Watches the TRIGGER, not the damage. dedup_ids() regenerates duplicate ids
  # on load and a save persists it; one minute later 1,204 :ID: lines had
  # changed and ledger<->org correspondence was gone. Duplicates are cheap to
  # fix while they are duplicates and unrepairable once regenerated, because
  # generate_id() is timestamped.
  - name: mac-id-churn
    machine: mac
    schedule: "40 * * * *"
    cmd: "python3 ~/Data/.datacore/lib/detectors/id_churn.py > ~/.datacore/state/id-churn.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/id-churn.log"
        check: regex
        arg: "0 with findings"
        max_age_hours: 26

  # Watches OUR OWN ENFORCEMENT. Observability platforms watch agent behaviour
  # and not agent configuration: core.hooksPath was unset on three of five
  # machines, so those actors committed with no hooks at all, indefinitely, and
  # nothing said so. git clone never copies hooks, which is why per-repo
  # .git/hooks cannot be the mechanism and a global hooksPath is.
  - name: mac-config-drift
    machine: mac
    # launchd, not cron. This SSHes to four machines, and under cron on a
    # laptop it failed two ways that look identical in the log: a run scheduled
    # during sleep never happened, and a run landing mid-wake had no agent
    # socket so hermes read as unreachable — red contract, false alert, and the
    # next manual run passing. launchd fires missed runs on wake and the socket
    # is resolved at run time rather than baked into a crontab line.
    schedule: "launchd io.datacore.config-drift @ 08:50, 14:50, 20:50 (fires on wake)"
    cmd: "~/Data/.datacore/lib/config_drift_run.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/config-drift.log"
        check: regex
        arg: "0 with drift, 0 unreachable"
        max_age_hours: 26

  # ORDER IS LOAD-BEARING: ingest at :40, drift check at :50.
  #
  # The drift check compares org against the ledger's projection. Every task
  # captured since the last ingest reads as drift, so running the check first
  # would report a clean system as dirty on any day a task was captured — and
  # since DIP-0046 F2 gates the Phase 1 flip on 14 CONSECUTIVE clean days, that
  # ordering does not merely add noise, it makes the gate unreachable. Observed
  # 2026-08-11: a converge pulled 6 new tasks into 5-plur and projections went
  # 9/9 -> 8/9 until the sweep ran.
  #
  # Both jobs were absent entirely until then. The streak counter only advances
  # when shadow_check RUNS, so an unscheduled check is a clock that never ticks.
  - name: box-ledger-ingest
    machine: box
    # launchd, not cron — and the two are ONE job now (ledger_daily.sh), because
    # the order between them is load-bearing. Recorded as separate contracts
    # because they produce separate artifacts worth checking separately.
    # Cron does not run missed jobs; the Mac slept through 07:40 on 2026-08-12
    # and neither fired, while the hourly detectors either side of the gap did.
    # MOVED TO THE ALWAYS-ON BOX 2026-08-12. On the laptop it slept through
    # its window and missed 9 tasks outright — a sweep that only runs when a
    # laptop is awake is a sweep that mostly does not run, and the ledger is
    # the system's record, not the Mac's.
    schedule: "cron 35 5 * * * on winston"
    cmd: "~/Data/.datacore/lib/ledger_daily.sh"   # winston
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/ledger-ingest.log"
        check: regex
        arg: "0 space\\(s\\) failed"
        max_age_hours: 26

  - name: box-projection-drift
    machine: box
    schedule: "cron 35 5 * * * on winston (runs after the ingest, same script)"
    cmd: "~/Data/.datacore/lib/ledger_daily.sh"   # winston
    on_fail: telegram
    artifacts:
      # Assert on the JSON, not on "9/9" in the log: a hardcoded space count
      # turns adding a tenth space into a false alarm, and the fix for a false
      # alarm is usually to stop believing the alarm.
      - path: "~/.datacore/state/shadow-status.json"
        check: regex
        arg: '"all_clean": true'
        max_age_hours: 26

  # The commit gate deliberately never blocks — nightshift runs ~20 tasks with
  # nobody awake, and waiting for an answer turns one unreviewed commit into a
  # stalled queue. The cost is that withheld work is invisible unless counted.
  # Age, not volume, is the signal: last night's decisions are the gate working;
  # the same ones in a fortnight mean the backlog has become a wastebasket, and
  # the gate is then discarding work while appearing to protect it.
  - name: mac-pending-decisions
    machine: mac
    schedule: "20 8 * * *"
    cmd: "python3 ~/Data/.datacore/lib/detectors/pending_decisions.py > ~/.datacore/state/pending-decisions.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/pending-decisions.log"
        check: regex
        arg: "0 older than"
        max_age_hours: 26

  - name: box-ledger-verify
    machine: box
    schedule: "20 7 * * *"
    cmd: "python3 ~/Data/.datacore/lib/ledger_cli.py verify --space ~/Data > ~/.datacore/state/ledger-verify.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/ledger-verify.log"
        check: regex
        arg: "^OK "
        max_age_hours: 26

  # Agent registry integrity. registry_gc.py existed and was never scheduled --
  # capability with no runner. Contracted on "duplicate keys (0)", an
  # unambiguous corruption signal that is TRUE today, rather than on
  # "orphaned (0)", which is 13 as of 2026-08-10 and would make this check born
  # red. Alert fatigue is a failure mode, not a stricter standard: the orphan
  # count is in the log for review, and this contract fires on regression.
  - name: box-registry-gc
    machine: box
    schedule: "35 7 * * *"
    cmd: "python3 ~/Data/.datacore/lib/registry_gc.py --registry ~/Data/.datacore/registry/agents.yaml --check > ~/.datacore/state/registry-gc.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/registry-gc.log"
        check: regex
        arg: "duplicate keys \\(0\\)"
        max_age_hours: 26

  - name: box-briefing
    machine: box
    schedule: "0 4 * * *"
    cmd: "~/Data/.datacore/lib/cos_morning.sh"
    artifacts:
      # cos_verify_morning.py:check_briefing -- BRIEFINGS/<day>/app-briefing.json,
      # must have a headline and _meta (generated_at/quality checked there too,
      # but json_has_keys only asserts top-level key presence).
      - path: "~/.datacore/cos/briefings/{today}/app-briefing.json"
        check: json_has_keys
        arg: ["headline", "_meta"]
        max_age_hours: 26
      - path: "~/.datacore/cos/morning.log"
        check: nonempty
        max_age_hours: 26
      # cos_verify_morning.py:check_journal_briefing -- regex lifted verbatim
      # from the source (miles_delivery accepts either heading).
      # A heading is not a briefing. This previously matched
      # "^##\\s+(Daily Briefing|Good Morning)", which a file containing nothing
      # but that heading would satisfy -- the generator could emit an empty
      # shell and pass. Requires a section that only a populated briefing
      # produces: "### Your Agenda" is written from calendar+GTD state, so it
      # is absent when generation fails partway. Verified 2026-08-10 against a
      # real 564-line briefing carrying Good Morning / The World / Your Agenda
      # / Spaces / Trading / Decisions Due / Horizon.
      - path: "~/Data/0-personal/notes/journals/{today}.md"
        check: regex
        arg: "^###\\s+Your Agenda"
        max_age_hours: 26
      # cos_verify_morning.py:check_audio -- AUDIO_STAMP, written by
      # winston_audio.sh only after Telegram accepts the voice message.
      - path: "~/.datacore/cos/audio-last-ok"
        check: nonempty
        max_age_hours: 26
    # cos_morning.sh:6 exports CLAUDE_CODE_OAUTH_TOKEN explicitly from
    # /etc/datacored.env -- cos_verify_morning.py's check_credentials exists
    # because a missing token is exactly the failure mode that has bitten
    # this job before (2026-07-28, per its docstring).
    required_env: ["CLAUDE_CODE_OAUTH_TOKEN"]
    on_fail: telegram

  - name: box-inbox
    machine: box
    schedule: "0 5 * * *"
    cmd: "~/Data/.datacore/lib/cos_inbox.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/inbox.log"
        check: nonempty
        max_age_hours: 26

  - name: box-research
    machine: box
    schedule: "30 5 * * *"
    cmd: "~/Data/.datacore/lib/cos_research.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/research.log"
        check: nonempty
        max_age_hours: 26

  - name: box-health-digest
    machine: box
    schedule: "15 7 * * *"
    cmd: "~/Data/.datacore/lib/cos_health_digest.sh"
    on_fail: telegram
    artifacts:
      # cos-server-setup.sh:79 pins the exact crontab line + redirect target.
      - path: "~/.datacore/cos/health.log"
        check: nonempty
        max_age_hours: 26

  - name: box-tomorrow
    machine: box
    schedule: "0 20 * * *"
    cmd: "~/Data/.datacore/lib/cos_tomorrow.sh"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/cos/tomorrow.log"
        check: nonempty
        max_age_hours: 26

  - name: box-cos-sync
    machine: box
    schedule: "*/15 * * * *"
    cmd: "~/Data/.datacore/lib/cos_sync.sh"
    artifacts:
      # log_max_age dict in cos_verify_morning.py:check_ops gives sync.log
      # exactly 1h -- the tightest bucket, matching the 15-min cadence.
      - path: "~/.datacore/cos/sync.log"
        check: nonempty
        max_age_hours: 1
    on_fail: telegram

  # ── nightshift server, systemd timers, UTC ───────────────────────────────


  - name: nightshift-overnight
    machine: nightshift
    schedule: "30 2 * * *"
    cmd: "~/Data/.datacore/modules/nightshift/nightshift run"
    on_fail: telegram
    artifacts:
      # Traced end to end: run.py's default (non --command) path ->
      # run_postprocess() -> manifest.build_manifest/write_manifest ->
      # .datacore/state/nightshift/manifest-<date>.yaml. Solid, not inferred.
      - path: "~/Data/.datacore/state/nightshift/manifest-{today}.yaml"
        check: nonempty
        max_age_hours: 26

  - name: nightshift-github-triage
    machine: nightshift
    schedule: "30 4 * * *"
    cmd: "bash ~/Data/.datacore/modules/github/server/triage-github.sh"
    on_fail: telegram
    artifacts:
      - path: "~/Data/.datacore/modules/github/data/scan_cache.json"
        check: nonempty
        max_age_hours: 26

  - name: nightshift-inbox-process
    machine: nightshift
    schedule: "0 5 * * *"
    cmd: "~/Data/.datacore/modules/nightshift/nightshift run --command=/process-inbox"
    on_fail: telegram
    artifacts:
      # This runs through run_command_mode (a Claude-driven slash command,
      # not a deterministic script), so there's no code-traced writer --
      # the unit file's own Description is the evidence: "classify inbox.org
      # -> research_learning.org + next_actions.org".
      - path: "~/Data/0-personal/org/research_learning.org"
        check: nonempty
        max_age_hours: 26


  - name: nightshift-public-repo-audit
    machine: nightshift
    schedule: "45 5 * * *"
    cmd: "~/Data/.datacore/lib/audit_public_repos_wrapper.sh"
    on_fail: telegram
    artifacts:
      # audit_public_repos_wrapper.sh writes LAST_RESULT directly and
      # annotates it with _timestamp/_exit_code -- keys confirmed by reading
      # the script's own JSON construction.
      - path: "~/Data/.datacore/state/public-repo-audit-last.json"
        check: json_has_keys
        arg: ["hits", "forbidden_count", "_timestamp"]
        max_age_hours: 26

  # ── mac ───────────────────────────────────────────────────────────────────
  # No mac crontab/launchd inventory was available beyond the two jobs named
  # in the brief (agent-stream rsync, lens sync). Both plists were confirmed
  # installed (~/Library/LaunchAgents) on this machine, and both target
  # artifacts were confirmed to exist by a direct filesystem check during
  # authoring -- but schedules are launchd intervals, not crontab, so they
  # are documented rather than expressed as 5-field cron.

  - name: mac-agent-stream-rsync
    machine: mac
    schedule: "every 30s (launchd StartInterval, com.datacore.agent-stream-rsync.plist)"
    cmd: "~/Data/.datacore/lib/agent_stream_rsync.sh"
    on_fail: telegram
    artifacts:
      # StandardOutPath from the plist. rsync with --update prints nothing
      # when there's nothing new to pull, so an mtime-freshness check here
      # would false-fail routinely (observed: log last written ~14h before
      # authoring despite the launchd job being loaded and healthy) --
      # exists-only until Phase 6 designs a better liveness signal.
      # VERIFIED (Task 6.3, 2026-07-30, live `ls` on this Mac): path exists,
      # mtime same-day -- exists-only check confirmed correct as designed;
      # freshness threshold intentionally still undefined (see rationale
      # above), that choice is not what was in question.
      # NOT the rsync log: agent_stream_rsync.sh is `exec rsync` with no -v, so
      # it is SILENT on success and writes only on error. Freshness on that log
      # is inverted -- a stale log means the sync has been HEALTHY. Verified
      # 2026-08-10 by observing a 2.9h-stale log while the destination was 2min
      # fresh. Check the destination the sync exists to produce instead.
      - path: "~/.datacore/cos/agent-stream/events-{today}.jsonl"
        check: nonempty
        max_age_hours: 6

  - name: mac-lens-sync
    machine: mac
    schedule: "continuous (launchd KeepAlive daemon, RunAtLoad, com.datacore.lens.plist)"
    cmd: "cd ~/Data/.datacore/modules/lens && python3 -m lib.runner --serve"
    on_fail: telegram
    artifacts:
      # modules/lens/CLAUDE.base.md + docs/OVERVIEW.md: "All raw data lives
      # in ~/.datacore/lens/observations.db only" / "Live capture DB".
      # VERIFIED (Task 6.3, 2026-07-30, live `ls` on this Mac): path exists,
      # ~2.2GB, actively growing (mtime minutes old at verification time) --
      # exists-only check confirmed correct as designed; a freshness
      # threshold for a continuously-written SQLite file is still an open
      # design question, deferred, not what was in question here.
      # Two failure modes, two checks. max_age catches a STALLED daemon.
      # min_bytes catches a daemon that LOST its database and started over --
      # verified 2026-08-10 that `exists` cannot: moving the 2.6 GB file aside
      # was not detected, because the KeepAlive daemon recreated it in
      # milliseconds and a fresh file passes both exists and nonempty. Floor
      # set well under the observed 2.6 GB so ordinary growth never trips it.
      - path: "~/.datacore/lens/observations.db"
        check: min_bytes
        arg: 1000000000
        max_age_hours: 14
        # 2h was calibrated for a continuously-running daemon; this one runs on
        # a LAPTOP THAT SLEEPS. Every overnight produced a red contract and a
        # telegram alert while the daemon was perfectly healthy — observed
        # 2026-08-12 at ages 5.2h and 5.7h, with the db writing normally on
        # wake. An alert that fires every morning regardless of health is one
        # the operator learns to dismiss, which costs more than it protects.
        #
        # 14h still catches a genuinely dead daemon within a day, which is the
        # failure worth catching. It does NOT catch a daemon that dies at
        # midnight and is noticed at noon — accepted deliberately, because the
        # alternative is an alarm nobody reads.

  - name: mac-artifact-pull
    machine: mac
    schedule: "every 30 min (launchd StartInterval 1800, com.datacore.artifact-pull.plist)"  # INSTALLED 2026-08-10. Before that this field claimed "*/30 * * * *" while no crontab entry and no plist existed — a declared schedule with no scheduler behind it. The plist now exists and RunAtLoad-fired successfully; it exits 1 while answers.yaml and facts.json have no producer on the box (declared CHANGELOG gap), which is honest failure rather than silence — the contract below checks app-briefing.json, which does have a producer and does sync
    cmd: "python3 ~/Data/.datacore/lib/artifact_sync.py --role client"
    artifacts:
      # .datacore/lib/artifact_sync.py (Task 6.1): rsync-over-ssh pull of the
      # box's CoS briefing artifacts. This is the local (mac-side) copy of
      # the same app-briefing.json checked by box-briefing above -- same
      # check/keys/freshness contract, since a stale or malformed pulled
      # copy is exactly as bad as a stale generated one for anything
      # reading it on this machine.
      - path: "~/.datacore/cos/briefings/{today}/app-briefing.json"  # TODO(verify-on-mac): confirm sync cadence + freshness threshold once the launchd plist replaces this placeholder cron schedule
        check: json_has_keys
        arg: ["headline"]
        max_age_hours: 26
    on_fail: log

  # ── hermes (Tris — agent gateway host) ───────────────────────────────────
  # Added 2026-08-10. This machine had NO contracts at all: the manifest
  # covered three of the five machines in the roster, so two agent hosts ran
  # entirely unverified. Found by TESTING the claim "every deployment gap is
  # closed" instead of asserting it -- the claim was false.

  - name: hermes-creds-sync
    machine: hermes
    schedule: "0 * * * *"
    cmd: "cd ~/Data/.datacore/secrets && ./scripts/sync.sh >> /tmp/creds-sync.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "/tmp/creds-sync.log"
        check: nonempty
        max_age_hours: 3

  - name: hermes-nightshift-deadman
    machine: hermes
    schedule: "*/15 * * * *"
    cmd: "/root/nightshift-deadman.sh >> /var/log/nightshift-deadman.log 2>&1"
    on_fail: telegram
    artifacts:
      - path: "/var/log/nightshift-deadman.log"
        check: nonempty
        max_age_hours: 2


  # ── plur-claw (Data — OpenClaw agent host) ───────────────────────────────
  # Added 2026-08-10, the last roster host to gain any verification at all.

  - name: plur-claw-data-heartbeat
    machine: plur-claw
    schedule: "data-heartbeat.timer (~30 min)"
    cmd: "~/data-heartbeat.sh"
    on_fail: telegram
    artifacts:
      # The state file is rewritten every run, so its freshness proves the
      # heartbeat ran -- unlike the daily log, which a single early run would
      # leave fresh-looking for the rest of the day.
      - path: "~/.openclaw/state-heartbeat-last-report"
        check: nonempty
        max_age_hours: 2

  - name: plur-claw-agent-stream-tail
    machine: plur-claw
    schedule: "continuous (datacore-agent-stream-tail sidecar)"
    cmd: "agent_stream_tail.py"
    on_fail: telegram
    artifacts:
      # This is the SOURCE of the workstation's agent-stream rsync: if the
      # tailer stops, mac-agent-stream-rsync goes stale downstream and the
      # cause is here. Checking both ends means the failure is attributed to
      # the side that actually broke.
      - path: "~/.datacore/agent-stream-tail/state.json"
        check: nonempty
        max_age_hours: 2


  # Phase 0 migration gate. The flip to Phase 1 is gated on N consecutive days
  # of a clean shadow diff -- a gate that means nothing unless the diff is
  # actually computed daily and its result is durable. Contracted on CONTENT
  # ("all_clean": true), not freshness: a stale-but-fresh status file would
  # report a passing migration that was never checked.
  - name: mac-shadow-diff
    machine: mac
    schedule: "0 7 * * *"
    cmd: "python3 ~/.datacore/v2-runner/.datacore/lib/shadow_check.py"
    on_fail: telegram
    artifacts:
      - path: "~/.datacore/state/shadow-status.json"
        check: regex
        arg: '"all_clean": true'
        max_age_hours: 26


# ── UNVERIFIED JOBS ───────────────────────────────────────────────────────
# job_verify ignores unknown top-level keys, so nothing below is checked.
# These jobs were REMOVED from `jobs:` on 2026-08-10 because their contracts
# could not fail, which is worse than having no contract: a check that is
# green regardless of reality manufactures exactly the false confidence this
# manifest exists to prevent.
#
#   nightshift-outbox        Verified 2026-08-10: no cron entry and no systemd
#                            timer schedules this job on that host -- it does
#                            not run. Its artifact check was `exists` on its
#                            OWN SOURCE FILE (archive_sync.py), which passes
#                            whether or not the job has ever executed.
#                            To re-list: schedule it, and have it write a
#                            result artifact to check.
#
#   nightshift-market-phase  Verified 2026-08-10: the systemd timer IS active
#                            and ran at 05:30 ("Command completed successfully"
#                            in the journal), but it writes no identifiable
#                            artifact. It was checked against the directory
#                            ~/Data/.datacore/state/trading, whose freshness
#                            comes from UNRELATED writers (monitor_state.json,
#                            wave_trader/ at 15:31) -- so a failed 05:30 run
#                            still passes. To re-list: have the unit write a
#                            success marker (ExecStartPost) and check that.
#                            Blocked on bringing the root-owned unit under
#                            version control; it is untracked today.
unverified_jobs_see_comment_above: true
