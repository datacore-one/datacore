# Repository registry — DIP-0046 §1
#
# What a repository IS. Not who may write to it: membership is
# <space>/.datacore/members.yaml, and which actors may RUN on a machine is
# registry/infrastructure.yaml. Three different facts, three homes; conflating
# the last two is what made `ledger_actors` answer a question it does not.
#
#   knowledge       facts, org, journals, notes — commit and push to the default
#                   branch. A pull request per journal entry is ceremony.
#   code            product repos — branch, PR, review, merge queue.
#   agent-personal  an agent's own space — its own default branch, no review.
#
# NO NETWORK ADDRESSES. Tracked in a public repository; hosts are named
# symbolically and resolved via ~/.ssh/config (DIP-0018).
#
# `ledger_transport.py` REFUSES a repository absent from this file. Defaulting
# would silently hand a production repo the knowledge rules, which is the one
# mistake the two categories exist to prevent.

repositories:
  .datacore/dips:
    category: code
    host: github
    transport: git
