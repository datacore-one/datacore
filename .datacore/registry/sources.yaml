# Source Registry — pluggable data sources for search and research
# Per DIP-0021: Search & Research Architecture
#
# Each source is an MCP server tool or API that provides search/discovery.
# Agents read this registry to determine which sources to query.
#
# Schema fields:
#   type           (required)  - internal, mcp, or api
#   description    (required)  - Human-readable description
#   tool           (required)  - MCP tool name or command to invoke
#   layers         (required)  - Pipeline phases: search, research, gather, synthesize
#   content_type   (required)  - documents (articles, papers) or structured_data (metrics, APIs)
#   api_key        (optional)  - Env var name in .datacore/env/
#   max_latency_ms (optional)  - Max response time; sources exceeding this skipped for /search
#   authority      (optional)  - high (peer-reviewed), medium (established media), low (blogs)
#   good_for       (optional)  - Advisory domain tags for source prioritization
#   models         (optional)  - Named model variants (e.g., quick: sonar, deep: sonar-pro)
#   opt_in         (optional)  - If true, requires explicit enable (privacy-sensitive)
#   always_available (optional) - If true, never skipped (internal sources)
#   enabled        (optional)  - Set to false to disable without removing
#   note           (optional)  - Advisory annotation for humans

sources:
  # === INTERNAL ===
  datacortex:
    type: internal
    description: "Semantic search over local Datacore knowledge base"
    tool: datacortex search
    layers: [search, research]
    content_type: documents
    cost_per_call: 0
    always_available: true

  # === GENERAL WEB ===
  perplexity:
    type: mcp
    description: "AI-synthesized web search with citations"
    tool: perplexity_search
    layers: [search, research]
    api_key: PERPLEXITY_API_KEY
    max_latency_ms: 4000
    content_type: documents
    cost_per_call: 0.005
    models:
      quick: sonar
      deep: sonar-pro
    good_for: [general, technology, news, market-analysis]

  exa:
    type: mcp
    description: "Semantic web discovery — finds content by meaning"
    tool: web_search_exa
    layers: [search, research]
    api_key: EXA_API_KEY
    content_type: documents
    cost_per_call: 0.007
    good_for: [general, technology, companies, papers, blogs]
    category_filters:
      medical: "research paper"
      academic: "research paper"
      scientific: "research paper"
      companies: "company"
      market-analysis: "company"
      technology: "github"
      code: "github"
      news: "news"

  exa-companies:
    type: mcp
    description: "Company intelligence — purpose-built company index"
    tool: company_research_exa
    layers: [research]
    api_key: EXA_API_KEY
    content_type: documents
    cost_per_call: 0.007
    good_for: [companies, market-analysis, competitors]

  exa-code:
    type: mcp
    description: "Code search — GitHub repos, Stack Overflow, official docs"
    tool: get_code_context_exa
    layers: [research]
    api_key: EXA_API_KEY
    content_type: documents
    cost_per_call: 0.007
    good_for: [technology, code, implementations]

  exa-deep:
    type: mcp
    description: "Agentic deep search — multi-step retrieval with synthesis"
    tool: deep_search_exa
    layers: [research]
    api_key: EXA_API_KEY
    content_type: documents
    cost_per_call: 0.012
    good_for: [general, technology, companies, papers]
    note: "4-30s latency; prefer for nightshift/deep research tasks"

  # === ACADEMIC ===
  google-scholar:
    type: mcp
    description: "Academic papers, citation graphs, peer review"
    tool: search  # serpapi-mcp search tool with engine=google_scholar
    layers: [research]
    api_key: SERPAPI_API_KEY
    content_type: documents
    cost_per_call: 0.003
    authority: high
    good_for: [medical, academic, scientific, longevity]
    enabled: true  # Requires serpapi-mcp Python package
    note: "Install: pip install serpapi-mcp; see github.com/serpapi/serpapi-mcp"

  # === CONTENT EXTRACTION ===
  jina-reader:
    type: mcp
    description: "Clean content extraction from any URL or PDF"
    tool: jina_reader
    layers: [gather]
    api_key: JINA_API_KEY
    content_type: documents
    cost_per_call: 0.001

  # === SYNTHESIS ===
  gemini-flash:
    type: mcp
    description: "Gemini 2.5 Flash — free preprocessing, extraction, highlights"
    tool: gemini-query
    layers: [gather, synthesize]
    api_key: GEMINI_API_KEY
    content_type: documents
    cost_per_call: 0
    models:
      default: gemini-2.5-flash
    good_for: [general, technology, academic]
    note: "Free tier. Use for preprocessing before Pro synthesis."

  gemini-pro:
    type: mcp
    description: "Gemini 2.5 Pro — standard research synthesis (1M context)"
    tool: gemini-query
    layers: [synthesize]
    api_key: GEMINI_API_KEY
    content_type: documents
    cost_per_call: 0.15
    models:
      default: gemini-2.5-pro
    good_for: [general, technology, academic, market-analysis]
    note: "$1.25/M input, $10/M output. Default synthesis model."

  gemini-pro-advanced:
    type: mcp
    description: "Gemini 3.1 Pro — complex reasoning and deep analysis (1M context)"
    tool: gemini-query
    layers: [synthesize]
    api_key: GEMINI_API_KEY
    content_type: documents
    cost_per_call: 0.35
    models:
      default: gemini-3.1-pro-preview
    good_for: [general, technology, academic, market-analysis]
    note: "$2/M input, $12/M output. Use for :AI:research:deep: tasks only."

  gemini-deep-research:
    type: mcp
    description: "Gemini 3.1 Pro Deep Research — autonomous multi-step research agent"
    tool: gemini-deep-research
    layers: [research, synthesize]
    api_key: GEMINI_API_KEY
    content_type: documents
    cost_per_call: 3.50
    opt_in: true  # Expensive ($2-5/task); requires explicit enable or :deep: tag
    good_for: [general, technology, academic, market-analysis, companies]
    note: "Autonomous agent. $2-5/task. Budget-gated."

  # === BUDGET CAPS ===
  # Monthly spending limits per source. Research-orchestrator checks accumulated
  # costs in source_costs.yaml before each call and skips over-budget sources.
budgets:
  exa: 10.00
  exa-companies: 5.00
  exa-code: 5.00
  exa-deep: 5.00
  perplexity: 10.00
  gemini-flash: 0        # Free tier, no cap needed
  gemini-pro: 20.00
  gemini-pro-advanced: 20.00
  gemini-deep-research: 25.00
  google-scholar: 5.00

  # === WIKIPEDIA / STRUCTURED ===
  pixelrag:
    type: mcp
    description: "Visual Wikipedia search — 8.28M pages indexed as image tiles via Qwen3-VL embeddings"
    tool: pixelrag__search
    layers: [search, research]
    content_type: documents
    cost_per_call: 0
    requires_key: false
    authority: medium
    max_latency_ms: 5000
    good_for: [wikipedia, structured-data, academic]
    note: "Hosted at api.pixelrag.ai. No API key. Text query → tile-level Wikipedia hits. Scores ~0.45–0.65 cosine. Spike quality evaluation only — index may not be maintained long-term."

