servers:
  mac:
    purpose: Primary workstation — human sessions, Claude Code, org authoring
    ssh_alias: '-'
    deploy_method: local working copy (~/Data)
    services: []
    ledger_actors:
    - mac
    notes: 'Local machine. On main at the v2 merge (0e2aad5) since 2026-08-10. Holds the only copy of
      the genesis event logs: .datacore/events/ is UNTRACKED in every space repo, so the migration output
      exists here and nowhere else. Back it up before reinstalling this machine.'
    access:
      service_user: gregor
      data_root: ~/Data
      runner: ~/.datacore/v2-runner
      hostname: Mac
  winston:
    manifest_machine: box
    purpose: Chief of Staff — briefings, approvals, merge gatekeeper
    ssh_alias: winston
    deploy_method: rsync + cron
    services:
    - cos_verify_morning.sh (cron 08:00)
    - job_verify.py (cron 08:00, DATACORE_V2=1)
    - cos_merge_runs.sh (cron 03:50)
    ledger_actors:
    - winston
    notes: Runs the config plane, job contracts and the ledger package from ~/Data at 0e2aad5. Verified
      end to end by ledger_probe.py 2026-08-10.
    access:
      ssh_user: root
      service_user: root
      data_root: ~/Data
      hostname: chief-of-staff
  nightshift:
    purpose: Overnight AI task execution (systemd timers); Miles Telegram bot
    ssh_alias: nightshift
    deploy_method: git pull + systemctl restart
    services:
    - nightshift-overnight.service
    - nightshift-overnight.timer
    - datacore-telegram.service
    - datacore-fleet-sync.timer
    - cos-cadence-triage.timer
    ledger_actors:
    - nightshift
    - miles
    notes: Two actors on one machine — they own separate event files and never contend. Runs .datacore/modules/nightshift/
      tasks on schedule. nightshift-digest.service is currently in a failed state.
    access:
      ssh_user: gregor
      service_user: gregor
      data_root: ~/Data
      hostname: nightshift
  hermes:
    purpose: Tris — Hermes agent gateway + PLUR bridge
    ssh_alias: hermes
    deploy_method: agent_update.py --host hermes --apply
    services:
    - hermes-gateway.service
    ledger_actors:
    - tris
    notes: 'Satellite writer: no ~/Data git repo — v2 code lives in ~/.datacore/v2-runner (0e2aad5), events
      in ~/Data/.datacore/events. Verified end to end by ledger_probe.py 2026-08-10.'
    access:
      ssh_user: root
      service_user: gregor
      data_root: ~gregor/Data
      runner: ~gregor/.datacore/v2-runner
      hostname: hermes-test
  plur-claw:
    purpose: Mr Data — OpenClaw agent host
    ssh_alias: plur-claw
    deploy_method: ssh + manual
    services: []
    ledger_actors:
    - data
    notes: Satellite writer. ~/Data is a DIFFERENT repo (data-on-claw/data-space), not this installation;
      v2 code lives in ~/.datacore/v2-runner (0e2aad5). Verified end to end by ledger_probe.py 2026-08-10.
    access:
      ssh_user: root
      service_user: root
      data_root: ~/Data
      runner: ~/.datacore/v2-runner
      hostname: plur-claw
