    - agent: landing-generator
      when: always
    reads:
      required:
      - .datacore/modules/landing/**
    writes:
    - content/landing/**
    references:
      dips: []
    related: []
  audit-agents:
    name: Agent Registry Audit
    description: Audit agents and commands for DIP-0016 compliance
    version: 1.0.0
    status: active
    trigger: audit agents|check agent registry
    source: .datacore/commands/audit-agents.md
    invokes:
    - agent: agent-registry-auditor
      when: always
    reads:
      required:
      - .datacore/registry/agents.yaml
      - .datacore/registry/commands.yaml
      - .datacore/dips/DIP-0016-agent-registry.md
      contextual:
      - .datacore/agents/*.md
      - .datacore/commands/*.md
      - .datacore/modules/*/agents/*.md
    writes:
    - .datacore/registry/agents.yaml
    - .datacore/registry/commands.yaml
    - .datacore/agents/*.md
    references:
      dips:
      - DIP-0016
    related:
    - diagnostic
    - create-module
