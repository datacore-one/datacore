version: 2.0.0
protocol: datacore-command-registry/v2
commands:
  today:
    name: Daily Briefing
    description: Generate daily briefing with priorities, calendar, nightshift results, and team updates
    version: 1.0.0
    status: active
    source: .datacore/commands/today.md
    invokes:
    - agent: journal-coordinator
      when: journal entry creation
    - agent: coach
      when: morning emotional check-in (optional)
    reads:
      required:
      - org/next_actions.org
      - .datacore/settings.yaml
      - .datacore/modules/*/module.yaml
      contextual:
      - journal/*.md
      - '*/0-inbox/nightshift-*.md'
    writes:
    - journal/{date}.md
    - '{space}/today/{date}.md'
    references:
      dips:
      - DIP-0009
      - DIP-0011
      - DIP-0004
      specs: []
    related:
    - tomorrow
    - gtd-daily-start
    - wrap-up
    - continue
  continue:
    name: Continue
    description: Resume incomplete work or find highest-impact next action
    version: 1.0.0
    status: active
    source: .datacore/commands/continue.md
    invokes:
    - agent: strategic-prioritizer
      when: no continuations found, analyzing system
    reads:
      required:
      - org/inbox.org
      - org/next_actions.org
      contextual:
      - journal/*.md
      - '{space}/org/*.org'
    writes:
    - org/next_actions.org
    references:
      dips:
      - DIP-0009
      - DIP-0016
    related:
    - wrap-up
    - today
    - tomorrow
  tomorrow:
    name: Evening Wrap-Up
    description: End-of-day command that syncs repos, queues AI tasks, and prepares for tomorrow
    version: 1.0.0
    status: active
    source: .datacore/commands/tomorrow.md
    invokes:
    - agent: session-learning-coordinator
      when: pattern extraction
    - agent: coach
      when: evening REBT reflection (optional)
    reads:
      required:
      - org/next_actions.org
      - org/nightshift.org
      - .datacore/settings.yaml
    writes:
    - org/nightshift.org
    - journal/{date}.md
    references:
      dips:
      - DIP-0011
      - DIP-0009
    related:
    - today
    - wrap-up
    - gtd-daily-end
  wrap-up:
    name: Session Wrap-Up
    description: Quick session close with learning capture, journal update, and continuation tasks
    version: 1.0.0
    status: active
    source: .datacore/commands/wrap-up.md
    invokes:
    - agent: journal-coordinator
      when: journal entry for session
    - agent: session-learning-coordinator
      when: pattern extraction
    - agent: context-maintainer
      when: context sync if changes
    - agent: coach
      when: quick emotional check (optional)
    reads:
      required:
      - org/next_actions.org
      contextual:
      - journal/{date}.md
    writes:
    - org/next_actions.org
    - journal/{date}.md
    - '{space}/journal/{date}.md'
    - .datacore/learning/patterns.md
    references:
      dips:
      - DIP-0009
      - DIP-0016
    related:
    - tomorrow
    - today
  gtd-daily-start:
    name: GTD Morning Planning
    description: Morning planning session with priority setting and focus selection
    version: 1.0.0
    status: demoted
    trigger: plan my day|morning planning|set priorities
    source: .datacore/commands/demoted/gtd-daily-start.md
    invokes: []
    reads:
      required:
      - org/inbox.org
      - org/next_actions.org
      - org/calendar.org
      - .datacore/dips/DIP-0009-gtd-specification.md
    writes:
    - journal/{date}.md
    references:
      dips:
      - DIP-0009
    related:
    - today
    - gtd-daily-end
    - gtd-weekly-review
  gtd-daily-end:
    name: GTD Evening Processing
    description: Evening inbox processing and AI task delegation
    version: 1.0.0
    status: demoted
    trigger: process inbox|delegate AI tasks|evening processing
    merged_into: tomorrow
    source: .datacore/commands/demoted/gtd-daily-end.md
    invokes:
    - agent: gtd-inbox-coordinator
      when: inbox processing
    reads:
      required:
      - org/inbox.org
      - org/next_actions.org
      - .datacore/dips/DIP-0009-gtd-specification.md
    writes:
    - org/inbox.org
    - org/next_actions.org
    - org/nightshift.org
    references:
      dips:
      - DIP-0009
      - DIP-0011
    related:
    - gtd-daily-start
    - tomorrow
  gtd-weekly-review:
    name: GTD Weekly Review
    description: Comprehensive weekly review following GTD methodology
    version: 1.0.0
    status: habit
    trigger: weekly review|GTD review|let's do the weekly review
    source: .datacore/commands/demoted/gtd-weekly-review.md
    invokes:
    - agent: scaffolding-auditor
      when: knowledge scaffolding check
    - agent: context-maintainer
      when: CLAUDE.md health check
    reads:
      required:
      - org/next_actions.org
      - org/projects.org
      - org/someday.org
      - org/habits.org
      - journal/*.md
      - .datacore/dips/DIP-0009-gtd-specification.md
      contextual:
      - .datacore/modules/crm/**
    writes:
    - journal/{date}.md
    - org/next_actions.org
    - org/someday.org
    references:
      dips:
      - DIP-0009
      - DIP-0014
    related:
    - gtd-daily-start
    - gtd-daily-end
    - gtd-monthly-strategic
  gtd-monthly-strategic:
    name: GTD Monthly Strategic Planning
    description: Monthly strategic review with goal alignment and horizon planning
    version: 1.0.0
    status: habit
    trigger: monthly review|strategic planning|monthly strategic
    source: .datacore/commands/demoted/gtd-monthly-strategic.md
    invokes: []
    reads:
      required:
      - org/projects.org
      - org/someday.org
      - .datacore/dips/DIP-0009-gtd-specification.md
      contextual:
      - journal/*.md
    writes:
    - journal/{date}.md
    - org/projects.org
    references:
      dips:
      - DIP-0009
    related:
    - gtd-weekly-review
  sync:
    name: Repository & Task Sync
    description: Unified sync for repositories and external task systems
    version: 1.0.0
    status: active
    trigger: sync repos|push changes|pull repos
    source: .datacore/commands/sync.md
    invokes: []
    reads:
      required:
      - .datacore/settings.yaml
      - org/inbox.org
      - org/next_actions.org
    writes:
    - org/inbox.org
    - org/next_actions.org
    - .datacore/state/sync_history.db
    references:
      dips:
      - DIP-0010
    related:
    - today
    - wrap-up
  diagnostic:
    name: System Diagnostic
    description: Comprehensive system health check and troubleshooting
    version: 1.0.0
    status: active
    trigger: system healthy|check health|diagnostic|is everything ok
    source: .datacore/commands/diagnostic.md
    invokes:
    - agent: context-maintainer
      when: context validation
    - agent: structural-integrity
      when: folder structure check
    reads:
      required:
      - .datacore/settings.yaml
      - CLAUDE.md
      - install.yaml
    writes: []
    references:
      dips:
      - DIP-0002
      - DIP-0016
    related:
    - scaffolding-audit
    - audit-agents
  search:
    name: Multi-Source Search
    description: Semantic search across local knowledge (Datacortex) and web intelligence (Perplexity)
    version: 2.0.0
    status: active
    trigger: search for|find|look up
    mcp_tool: datacore.search
    source: .datacore/commands/search.md
    invokes: []
    reads:
      required:
      - .datacore/registry/sources.yaml
      - .datacore/settings.yaml
      contextual:
      - .datacore/state/datacortex.db
    writes: []
    references:
      dips:
      - DIP-0021
      - DIP-0004
    related:
    - research
  research:
    name: Deep Research
    description: 'Multi-source research pipeline: discover, gather, process, synthesize, and optionally generate audio'
    version: 1.0.0
    status: active
    source: .datacore/commands/research.md
    invokes:
    - agent: research-orchestrator
      when: always
    - agent: knowledge-extractor
      when: per-source processing (spawned by orchestrator)
    - agent: research-synthesizer
      when: multi-source synthesis (spawned by orchestrator)
    - agent: podcast-creator
      when: --podcast flag (spawned by orchestrator)
    reads:
      required:
      - .datacore/registry/sources.yaml
      - .datacore/settings.yaml
    writes:
    - content/reports/*.md
    - content/summaries/*.md
    - '*/3-knowledge/literature/*.md'
    - '*/3-knowledge/zettel/*.md'
    - content/podcasts/*.mp3
    references:
      dips:
      - DIP-0021
      - DIP-0004
      - DIP-0009
    related:
    - search
    - ingest
  ingest:
    name: File Ingestion
    description: Process files from inbox folders with deep knowledge extraction
    version: 2.0.0
    status: active
    trigger: process files|ingest|process inbox files
    source: .datacore/commands/ingest.md
    invokes:
    - agent: ingest-orchestrator
      when: always
    - agent: knowledge-extractor
      when: per-file processing (spawned by orchestrator)
    - agent: docx-reader
      when: DOCX file detected
    reads:
      required:
      - .datacore/config/tags.yaml
      - .datacore/dips/DIP-0015-semantic-organization.md
    writes:
    - 1-tracks/**
    - 3-knowledge/**
    - 4-archive/**
    - org/inbox.org
    references:
      dips:
      - DIP-0021
      - DIP-0015
      - DIP-0014
    related:
    - structural-integrity
    - research
  structural-integrity:
    name: Structural Integrity Check
    description: Audit and maintain Datacore folder structure
    version: 1.0.0
    status: active
    trigger: check folder structure|structural integrity
    source: .datacore/commands/structural-integrity.md
    invokes:
    - agent: structural-integrity
      when: always
    reads:
      required:
      - .datacore/dips/DIP-0015-semantic-organization.md
      - .gitattributes
    writes:
    - _index.md
    - .gitattributes
    references:
      dips:
      - DIP-0015
      - DIP-0002
    related:
    - ingest
    - scaffolding-audit
    - diagnostic
  scaffolding-audit:
    name: Knowledge Scaffolding Audit
    description: Audit knowledge base structure and scaffolding completeness
    version: 1.0.0
    status: demoted
    trigger: audit scaffolding|knowledge structure check
    merged_into: diagnostic
    source: .datacore/commands/demoted/scaffolding-audit.md
    invokes:
    - agent: scaffolding-auditor
      when: always
    reads:
      required:
      - .datacore/dips/DIP-0003-scaffolding-pattern.md
      - 3-knowledge/**
    writes: []
    references:
      dips:
      - DIP-0003
    related:
    - structural-integrity
    - gtd-weekly-review
  create-module:
    name: Create Module
    description: Create, convert, or audit modules for spec alignment
    version: 1.0.0
    status: active
    trigger: create a module|new module|audit module|/create-module
    source: .datacore/commands/create-module.md
    invokes:
    - agent: create-module
      when: always
    - agent: module-registrar
      when: registration requested
    reads:
      required:
      - .datacore/CATALOG.md
    writes:
    - .datacore/modules/{name}/**
    - .datacore/CATALOG.md
    references:
      dips:
      - DIP-0002
      - DIP-0016
    related:
    - audit-agents
  deploy-landing:
    name: Deploy Landing Page
    description: Generate and deploy landing pages to hosting
    version: 1.0.0
    status: demoted
    trigger: deploy landing page|push landing page
    source: .datacore/commands/demoted/deploy-landing.md
