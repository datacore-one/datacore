# Principals: who acts in this installation, and which ledger writer logs are
# theirs (DIP-0044 identity; product description "the contract of being a
# principal"). A writer log named under `writes_as` may only ever be appended
# by commits authored with one of the principal's `emails`; v2_verify checks it.
#
# Facts only. A field that is not yet decided is null and stays null until the
# owner decides it — a made-up budget is worse than none. `budget_monthly_usd`
# is enforced at claim time by claim_gate once declared (spend.record events,
# month to date); null means "no ceiling declared", and principals_check.py
# reports it as such every day.
version: 1
# Authorship is bound by hash, not by address: `email_sha256` holds the first
# 16 hex of sha256(lowercased git author email). This repository is public and
# its boundary check refuses personal addresses in tracked files. To bind a
# new address: python3 .datacore/lib/actor_identity.py hash you@example.com
principals:
  gregor:
    kind: human
    display: Gregor
    email_sha256: [49d69f113aaa313b, 4e49325caaa8e99d, 36447ff8a6d37b84]
    github: plur9
    hosts: [mac]
    writes_as: [mac]
    decision: final
    memory_scope: user:plur:gregor
    permission_mode: human
  winston:
    kind: agent
    display: Winston
    role: chief of staff
    email_sha256: [0ca46dadf114ca4d]
    github: null                        # deliberately under the owner's account (DIP-0044 §4)
    hosts: [winston]
    writes_as: [winston, bridge]        # bridge: the hostname-derived log from before DIP-0044
    owns:
      roles: [8-firm:cos]
      cadences: [briefing 04:00, verify-daily 07:10, liveness 07:40, scoreboard 08:10]
    delegates_to: [miles, tris]
    charter: 8-firm/1-tracks/principals/winston.md
    contracts: box-*
    memory_scope: agent:winston
    budget_monthly_usd: null
    permission_mode: propose            # proposes; the client approves external actions
  miles:
    kind: agent
    display: Miles
    role: chief of operations
    email_sha256: [b3c41e5e12e8cdb7, 7b84804c8b3d143e]
    github: miles-on-nightshift
    hosts: [nightshift]
    writes_as: [miles, nightshift]      # nightshift: the executor's log; it commits as Miles
    owns:
      roles: [8-firm:coo, 6-meridian:trader, 6-meridian:operations]
    executors: [nightshift]
    charter: 8-firm/1-tracks/principals/miles.md
    contracts: nightshift-*
    memory_scope: agent:miles
    budget_monthly_usd: null
    permission_mode: bypass             # bot: bypassPermissions; nightshift: --dangerously-skip-permissions
  tris:
    kind: agent
    display: Tris
    role: chief intelligence officer
    email_sha256: [6b962a4a3a0068be]
    github: tris-on-hermes
    hosts: [hermes]
    writes_as: [tris]
    owns:
      roles: [8-firm:cio, 5-plur:(venture.yaml)]
    charter: 8-firm/1-tracks/principals/tris.md
    contracts: hermes-*
    memory_scope: agent:tris
    budget_monthly_usd: null
    permission_mode: yolo               # HERMES_YOLO_MODE=1
  data:
    kind: agent
    display: Mr Data
    role: communications
    email_sha256: [ebb64c306f9de106, 965c4f44b8c259e1]
    github: data-on-claw
    hosts: [plur-claw]
    writes_as: [data]
    owns:
      roles: [8-firm:comms, 5-plur:(venture.yaml)]
    charter: 8-firm/1-tracks/principals/data.md
    contracts: plur-claw-*
    memory_scope: agent:data
    budget_monthly_usd: null
    permission_mode: propose            # drafts; a human approves anything that leaves
  genesis:
    kind: migration
    display: genesis import (2026-08-10, one shot)
    email_sha256: [49d69f113aaa313b, 0ca46dadf114ca4d, b3c41e5e12e8cdb7]
    hosts: [mac, winston, nightshift]
    writes_as: [genesis]
  practice:
    kind: agent
    display: The Practice (John, Mick)
    role: health and longevity practice
    email_sha256: []
    github: null
    hosts: [mac]
    writes_as: []                       # keeps its own intervention ledger; not yet an event-ledger writer
    charter: 9-practice/CLAUDE.md
    memory_scope: agent:john
    decision: proposes; the client approves every protocol change
    permission_mode: propose

# Verify keys (stage 8). Each writer signs its events with a private key that
# never leaves its host (~/.datacore/keys/<actor>.key); the public half is
# registered here from the host's own registry so any machine can verify the
# writer's chain. Collected 2026-09-06 from the hosts' keys/registry.yaml;
# re-collect with ledger_keys_collect.py after a rotation.
verify_keys:
