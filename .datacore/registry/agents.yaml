        - ".datacore/modules/gstack/CLAUDE.base.md"
      contextual:
        - "~/.gstack/projects/"
    writes:
      - "[space]/journal/"
    spawns: []
    can_be_called_by:
      - nightshift-orchestrator
      - ai-task-executor
    references:
      dips: []
      specs: []

