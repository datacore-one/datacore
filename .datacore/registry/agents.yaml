# =============================================================================
# AGENT REGISTRY
# DIP-0016: Agent Registry & Discoverability
# =============================================================================
#
# Single source of truth for agent metadata, capabilities, relationships,
# and lifecycle hooks.
#
# Schema per DIP-0016:
#   - name: Agent identifier (matches subagent_type)
#   - description: One-line description
#   - version: Semantic version
#   - source: Path to agent definition file
#   - skills: Array of capability tags for semantic discovery
#   - triggers.tags: Org-mode tags that route to this agent
#   - triggers.commands: Slash commands that invoke this agent
#   - reads.required: Files agent MUST read for context
#   - reads.contextual: Datacortex queries for dynamic context
#   - writes: Paths/patterns where agent outputs
#   - references.dips: DIPs this agent implements
#   - references.specs: Specs this agent follows
#   - spawns: Agents this agent can invoke
#   - can_be_called_by: Agents that invoke this agent
#   - profile: Hook profile to inherit (§17)
#   - hooks: Lifecycle hooks configuration (§16)
#
# =============================================================================

version: "2.0.0"
protocol: "DIP-0016"
updated: "2026-02-19"

# =============================================================================
# HOOK DEFAULTS
# Applied to ALL agents unless overridden (DIP-0016 §16-18)
# =============================================================================

defaults:
  hooks:
    pre:
      # Auto-load context before agent execution
      - type: context-inject
        config:
          auto_load_reads: true       # Load reads.required files
          auto_load_dips: true        # Load references.dips (Agent Context section)
          auto_load_specs: false      # Don't load full specs by default
          inject_session_memory: false # Opt-in per profile
          max_context_tokens: 50000
          dip_section: "Agent Context" # Only load this section from DIPs

    post:
      # Log execution metrics
      - type: metrics-log
        config:
          log_duration: true
          log_tokens: true
          log_outputs: true
          target: ".datacore/state/execution_log.yaml"

    on_error:
      # Classify errors for retry decisions
      - type: classify-error
        config:
          transient_patterns:
            - "rate_limit"
            - "timeout"
            - "connection"
            - "overloaded"
          permanent_patterns:
            - "not_found"
            - "permission_denied"
            - "invalid_input"

# =============================================================================
# HOOK PROFILES
# Reusable hook configurations for common agent types (DIP-0016 §17)
# =============================================================================

profiles:

  # ---------------------------------------------------------------------------
  # GTD Processor Profile
  # For agents that process GTD items (inbox, tasks, projects)
  # ---------------------------------------------------------------------------
  gtd-processor:
    description: "Standard GTD processing agent with validation and learning"
    hooks:
      pre:
        - inherit: defaults
        - type: validate-preconditions
          config:
            required_state:
              - "org_files_readable"
      post:
        - inherit: defaults
        - type: learning-extract
          config:
            extract_patterns: true
            extract_corrections: true
            target: "{space}/.datacore/learning/"
      on_error:
        - inherit: defaults
        - type: retry-schedule
          config:
            max_retries: 3
            backoff: [3600, 10800, 21600]  # 1h, 3h, 6h
            only_transient: true
            queue: "nightshift"

  # ---------------------------------------------------------------------------
  # Coordinator Profile
  # For orchestrators that spawn subagents (coordinators, routers)
  # ---------------------------------------------------------------------------
  coordinator:
    description: "Orchestrator that discovers spaces and spawns subagents"
    hooks:
      pre:
        - inherit: defaults
        - type: discover-spaces
          config:
            pattern: "[0-9]-*/"
            filter_by_git_activity: true
            activity_window: "24h"
            exclude: ["4-archive", "4-outbox"]
      post:
        - inherit: defaults
        - type: journal-append
          config:
            summary_length: "brief"
            include_outputs: true
      on_error:
        - inherit: defaults
        - type: escalate
          config:
            after_retries: 2
            target: "human_queue"
            notify: true

  # ---------------------------------------------------------------------------
  # Research Profile
  # For agents that fetch external content and create knowledge
  # ---------------------------------------------------------------------------
  research:
    description: "Research and knowledge creation with session memory"
    hooks:
      pre:
        - inherit: defaults
        - type: context-inject
          config:
            inject_session_memory: true  # Query past research sessions
            max_context_tokens: 60000
      post:
        - inherit: defaults
        - type: learning-extract
          config:
            extract_patterns: true
            extract_principles: true
        - type: embed-outputs
          config:
            target: "datacortex"
            types: ["zettel", "literature-note"]
      validate:
        - type: output-exists
          config:
            check_writes: true
            min_file_size: 100

  # ---------------------------------------------------------------------------
  # Content Writer Profile
  # For agents that generate content (blogs, emails, docs)
  # ---------------------------------------------------------------------------
  content-writer:
    description: "Content generation with quality validation"
    hooks:
      pre:
        - inherit: defaults
      post:
        - inherit: defaults
        - type: learning-extract
          config:
            extract_patterns: true
      validate:
        - type: quality-gate
          config:
            min_output_length: 200
            require_structured_response: true
            forbidden_patterns:
              - "TODO"
              - "FIXME"
              - "[placeholder]"
              - "Lorem ipsum"

  # ---------------------------------------------------------------------------
  # Search Pipeline Profile (DIP-0021 Section 8.1)
  # For the search layer — fast multi-source lookup
  # ---------------------------------------------------------------------------
  search-pipeline:
    description: "Search layer hooks (DIP-0021 Section 8.1)"
    hooks:
      pre:
        - inherit: defaults
        - type: pre_search
          config:
            inject_project_context: true
      post:
        - inherit: defaults
        - type: post_search
          config:
            log_queries: true
            cache_results: true
        - type: search_save
          config:
            trigger_on: "save_as_zettel"
            embed_in_datacortex: true

  # ---------------------------------------------------------------------------
  # Research Pipeline Profile (DIP-0021 Section 8.2)
  # For agents that coordinate multi-source research
  # ---------------------------------------------------------------------------
  research-pipeline:
    description: "Full research pipeline (DIP-0021 Section 8.2)"
    hooks:
      pre:
        - inherit: defaults
        - type: discover-spaces
          config:
            pattern: "[0-9]-*/"
            filter_by_git_activity: true
        - type: context-inject
          config:
            inject_session_memory: true
            max_context_tokens: 60000
        - type: pre_research
          config:
            check_budget: true
            inject_active_projects: true
      post:
        - inherit: defaults
        - type: post_discover
          config:
            apply_relevance_filter: true
            check_recent_research_dedup: true
        - type: post_extract
          config:
            embed_in_datacortex: true
            extract_crm_entities: true
            update_landscape_yaml: true
        - type: post_synthesize
          config:
            update_briefing: true
            route_action_items: true
        - type: research_complete
          config:
            mark_done: true
            update_journal: true
            cost_logging: true
        - type: learning-extract
          config:
            extract_patterns: true
            extract_principles: true
        - type: journal-append
          config:
            summary_length: "brief"
            include_outputs: true
      validate:
        - type: output-exists
          config:
            check_writes: true
            min_file_size: 100
      on_error:
        - inherit: defaults
        - type: escalate
          config:
            after_retries: 2
            target: "human_queue"

  # ---------------------------------------------------------------------------
  # Ingest Pipeline Profile (DIP-0021 Section 8.3)
  # For content ingestion from files and external sources
  # ---------------------------------------------------------------------------
  ingest-pipeline:
    description: "Ingest layer hooks (DIP-0021 Section 8.3)"
    hooks:
      pre:
        - inherit: defaults
        - type: pre_ingest
          config:
            check_datacortex_duplicates: true
            validate_file: true
        - type: context-inject
          config:
            inject_session_memory: true
      post:
        - inherit: defaults
        - type: embed-outputs
          config:
            target: "datacortex"
            types: ["zettel", "literature-note"]
        - type: post_ingest
          config:
            clean_source: true
        - type: ingest_complete
          config:
            report_summary: true
            update_folder_indexes: true
        - type: learning-extract
          config:
            extract_patterns: true
      validate:
        - type: output-exists
          config:
            check_writes: true
            min_file_size: 100

  # ---------------------------------------------------------------------------
  # System Maintenance Profile
  # For agents that audit, maintain, or migrate system components
  # ---------------------------------------------------------------------------
  system-maintenance:
    description: "System auditing and maintenance with detailed logging"
    hooks:
      pre:
        - inherit: defaults
        - type: validate-preconditions
          config:
            required_state:
              - "git_clean"
      post:
        - inherit: defaults
        - type: journal-append
          config:
            summary_length: "detailed"
            include_outputs: true
      on_error:
        - inherit: defaults
        - type: escalate
          config:
            after_retries: 1  # Fail fast for system ops
            target: "human_queue"
            notify: true

