# =============================================================================
# AGENT REGISTRY
# DIP-0016: Agent Registry & Discoverability
# =============================================================================
#
# Single source of truth for agent metadata, capabilities, relationships,
# and lifecycle hooks.
#
# Schema per DIP-0016:
#   - name: Agent identifier (matches subagent_type)
#   - description: One-line description
#   - version: Semantic version
#   - source: Path to agent definition file
#   - tools: Tool allowlist mirroring frontmatter (for registry cross-reference)
#   - skills: Array of capability tags for semantic discovery
#   - triggers.tags: Org-mode tags that route to this agent
#   - triggers.commands: Slash commands that invoke this agent
#   - reads.required: Files agent MUST read for context
#   - reads.contextual: Datacortex queries for dynamic context
#   - writes: Paths/patterns where agent outputs
#   - references.dips: DIPs this agent implements
#   - references.specs: Specs this agent follows
#   - spawns: Agents this agent can invoke
#   - can_be_called_by: Agents that invoke this agent
#   - profile: Hook profile to inherit (§17)
#   - hooks: Lifecycle hooks configuration (§16)
#
# FRONTMATTER NOTE (2026-08-23):
#   Agent markdown files (.datacore/agents/*.md) now carry a YAML frontmatter
#   block that the claude CLI reads directly for runtime configuration:
#     name, description, model, tools, effort, color
#   The 'tools' field in frontmatter is the AUTHORITATIVE source for tool
#   restrictions. The 'tools' field here in the registry is a mirror for
#   discoverability queries only — keep them in sync.
#   See .datacore/agents/_patterns/frontmatter-schema.md for the full schema.
#
# =============================================================================

version: 2.0.0
protocol: DIP-0016
updated: '2026-06-10'
defaults:
  hooks:
    pre:
    - type: context-inject
      config:
        auto_load_reads: true
        auto_load_dips: true
        auto_load_specs: false
        inject_session_memory: false
        max_context_tokens: 50000
        dip_section: Agent Context
    post:
    - type: metrics-log
      config:
        log_duration: true
        log_tokens: true
        log_outputs: true
        target: .datacore/state/execution_log.yaml
    on_error:
    - type: classify-error
      config:
        transient_patterns:
        - rate_limit
        - timeout
        - connection
        - overloaded
        permanent_patterns:
        - not_found
        - permission_denied
        - invalid_input
profiles:
  gtd-processor:
    description: Standard GTD processing agent with validation and learning
    hooks:
      pre:
      - inherit: defaults
      - type: validate-preconditions
        config:
          required_state:
          - org_files_readable
      post:
      - inherit: defaults
      - type: learning-extract
        config:
          extract_patterns: true
          extract_corrections: true
          target: '{space}/.datacore/learning/'
      on_error:
      - inherit: defaults
      - type: retry-schedule
        config:
          max_retries: 3
          backoff:
          - 3600
          - 10800
          - 21600
          only_transient: true
          queue: nightshift
  coordinator:
    description: Orchestrator that discovers spaces and spawns subagents
    hooks:
      pre:
      - inherit: defaults
      - type: discover-spaces
        config:
          pattern: '[0-9]-*/'
          filter_by_git_activity: true
          activity_window: 24h
          exclude:
          - 4-archive
          - 4-outbox
      post:
      - inherit: defaults
      - type: journal-append
        config:
          summary_length: brief
          include_outputs: true
      on_error:
      - inherit: defaults
      - type: escalate
        config:
          after_retries: 2
          target: human_queue
          notify: true
  research:
    description: Research and knowledge creation with session memory
    hooks:
      pre:
      - inherit: defaults
      - type: context-inject
        config:
          inject_session_memory: true
          max_context_tokens: 60000
      post:
      - inherit: defaults
      - type: learning-extract
        config:
          extract_patterns: true
          extract_principles: true
      - type: embed-outputs
        config:
          target: datacortex
          types:
          - zettel
          - literature-note
      validate:
      - type: output-exists
        config:
          check_writes: true
          min_file_size: 100
  content-writer:
    description: Content generation with quality validation
    hooks:
      pre:
      - inherit: defaults
      post:
      - inherit: defaults
      - type: learning-extract
        config:
          extract_patterns: true
      validate:
      - type: quality-gate
        config:
          min_output_length: 200
          require_structured_response: true
          forbidden_patterns:
          - TODO
          - FIXME
          - '[placeholder]'
          - Lorem ipsum
  search-pipeline:
    description: Search layer hooks (DIP-0021 Section 8.1)
    hooks:
      pre:
      - inherit: defaults
      - type: pre_search
        config:
          inject_project_context: true
      post:
      - inherit: defaults
      - type: post_search
        config:
          log_queries: true
          cache_results: true
      - type: search_save
        config:
          trigger_on: save_as_zettel
          embed_in_datacortex: true
  research-pipeline:
    description: Full research pipeline (DIP-0021 Section 8.2)
    hooks:
      pre:
      - inherit: defaults
      - type: discover-spaces
        config:
          pattern: '[0-9]-*/'
          filter_by_git_activity: true
      - type: context-inject
        config:
          inject_session_memory: true
          max_context_tokens: 60000
      - type: pre_research
        config:
          check_budget: true
          inject_active_projects: true
      post:
      - inherit: defaults
      - type: post_discover
        config:
          apply_relevance_filter: true
          check_recent_research_dedup: true
      - type: post_extract
        config:
          embed_in_datacortex: true
          extract_crm_entities: true
          update_landscape_yaml: true
      - type: post_synthesize
        config:
          update_briefing: true
          route_action_items: true
      - type: research_complete
        config:
          mark_done: true
          update_journal: true
          cost_logging: true
      - type: learning-extract
        config:
          extract_patterns: true
          extract_principles: true
      - type: journal-append
        config:
          summary_length: brief
          include_outputs: true
      validate:
      - type: output-exists
        config:
          check_writes: true
          min_file_size: 100
      on_error:
      - inherit: defaults
      - type: escalate
        config:
          after_retries: 2
          target: human_queue
  ingest-pipeline:
    description: Ingest layer hooks (DIP-0021 Section 8.3)
    hooks:
      pre:
      - inherit: defaults
      - type: pre_ingest
        config:
          check_datacortex_duplicates: true
          validate_file: true
      - type: context-inject
        config:
          inject_session_memory: true
      post:
      - inherit: defaults
      - type: embed-outputs
        config:
          target: datacortex
          types:
          - zettel
          - literature-note
      - type: post_ingest
        config:
          clean_source: true
      - type: ingest_complete
        config:
          report_summary: true
          update_folder_indexes: true
      - type: learning-extract
        config:
          extract_patterns: true
      validate:
      - type: output-exists
        config:
          check_writes: true
          min_file_size: 100
  system-maintenance:
    description: System auditing and maintenance with detailed logging
    hooks:
      pre:
      - inherit: defaults
      - type: validate-preconditions
        config:
          required_state:
          - git_clean
      post:
      - inherit: defaults
      - type: journal-append
        config:
          summary_length: detailed
          include_outputs: true
      on_error:
      - inherit: defaults
      - type: escalate
        config:
          after_retries: 1
          target: human_queue
          notify: true
