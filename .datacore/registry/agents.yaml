knowledge_locations:
  gtd:
    description: GTD methodology and workflows
    paths:
    - .datacore/dips/DIP-0009-gtd-specification.md
    - .datacore/commands/gtd-*.md
    queries:
    - GTD workflow and principles
  tags:
    description: Tag taxonomy and conventions
    paths:
    - .datacore/dips/DIP-0014-tag-taxonomy.md
    - .datacore/tags.yaml
    queries:
    - tag conventions and formats
  privacy:
    description: Privacy policy and data handling
    paths:
    - .datacore/specs/privacy-policy.md
    - .datacore/dips/DIP-0002-layered-context-pattern.md
    queries:
    - privacy levels and data classification
  agents:
    description: Agent patterns and registry
    paths:
    - .datacore/dips/DIP-0016-agent-registry.md
    - .datacore/registry/agents.yaml
    queries:
    - agent capabilities and routing
  outbox:
    description: Outbox and archive patterns
    paths:
    - .datacore/dips/DIP-0017-outbox-archive-pattern.md
    - .datacore/modules/outbox/CLAUDE.base.md
    - .datacore/modules/outbox/commands/outbox.md
    queries:
    - archive workflow and routing
    - outbox processing
  archives:
    description: Archived content and search
    paths:
    - .datacore/modules/outbox/commands/archive-search.md
    - .datacore/modules/outbox/agents/archive-indexer.md
    queries:
    - search archived content
    - archive embeddings and snapshots
validation:
  required_fields:
  - name
  - description
  - version
  - source
  - skills
  required_for_routable:
  - triggers.tags
  - reads.required
  - writes
  source_must_exist: true
  spawns_must_exist: true
  circular_spawn_detection: true
