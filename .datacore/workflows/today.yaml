# /today workflow
# Morning briefing — sync, nightshift results, calendar, priorities
name: today
description: Morning briefing — sync, nightshift results, habits, calendar, priorities
command: /today
version: 1.0.0

phases:
  - name: sync-repos
    type: tool
    invoke: sync pull
    description: Pull latest from all repos

  - name: habits-check
    type: tool
    invoke: datacore.gtd.habits_due
    description: Parse habits.org for entries due today

  - name: nightshift-results
    type: agent
    invoke: nightshift-orchestrator
    action: report
    description: Summarize overnight AI work

  - name: calendar-scan
    type: tool
    invoke: datacore.meetings.upcoming
    description: Show today's meetings

  - name: health-metrics
    type: tool
    invoke: datacore.health.readiness
    optional: true
    description: Health readiness from Oura

  - name: generate-briefing
    type: agent
    invoke: daily-briefing-generator
    description: Compile briefing from all phase outputs

  - name: present
    type: output
    format: markdown
    description: Display briefing to user

trigger: manual
hooks:
  - nightshift-today-hook
  - meetings-today-hook
  - crm-today-hook
  - health-today-hook
  - news-today-hook
