[pytest]
# This file exists to pin pytest's rootdir to .datacore, and it is load-bearing.
#
# conftest.py here is what points DATACORE_STATE at a throwaway directory. pytest
# only collects conftest files between rootdir and the test, and with no ini file
# anywhere, rootdir was computed from the arguments: `pytest tests/` run from
# .datacore/lib put rootdir at lib/, one level BELOW this conftest, so the
# isolation silently did not apply. The suite then wrote its Org transaction
# journal into the real ~/.datacore/state and left it there, and because recover()
# refuses a journal whose file has changed, every subsequent Org transaction on
# the machine failed -- the hourly Phase-1 cycle included (2026-09-16).
#
# The isolation must not depend on which directory someone types pytest in.
norecursedirs = venv .venv node_modules .git dist build *.egg-info
