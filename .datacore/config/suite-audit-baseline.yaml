# Test failures the owner has seen and accepted, so the nightly suite run stays
# quiet about them and loud about everything else.
#
# Same rule as ledger-invariants-baseline.yaml: an entry matches ONE test id, so
# a second failure in the same file is still a NEW finding and still fails the
# run. Adding to this list is a decision. Removing from it is the fix.
#
# Empty since 2026-09-19. Its first and only entry accepted
# test_runner_manifest_matches_canonical, which was not a defect but a correct
# report that lib/jobs/manifest.yaml had been edited and not yet shipped -- the
# detectors run from ~/.datacore/v2-runner, a separate checkout that refreshes
# by `git pull`. The entry said to delete it once the commit landed. It landed
# (ee76b8d), the runner pulled, the test went green, and the entry is gone.
#
# That is the intended lifecycle: an accepted failure carries the condition that
# retires it, and something eventually retires it.
version: 1
accepted: []
