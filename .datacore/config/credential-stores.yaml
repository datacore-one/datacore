# Where credential values live on THIS installation.
#
# Declared here rather than hardcoded in credential_access.py, because that code
# ships as a product and these paths are this fleet's furniture, not everyone's.
#
# `stores` — files Datacore owns. A value appearing in two of them is drift, and
#   `credential_access.py duplicates` will say so.
#
# `external` — files another application owns. Scanned so nothing is invisible,
#   but treated as a separate namespace: a value there is not a copy of ours, it
#   is a different credential that happens to share a variable name. hermes holds
#   its own TELEGRAM_BOT_TOKEN (@kton9_bot), which is NOT the Datacore bot
#   (@datacore_1_bot). Calling that divergence trains the reader to ignore the
#   check, and a check people ignore is the failure mode this whole system exists
#   to remove.
stores:
  - "{DATA}/.datacore/env/.env"          # assembled by creds sync
  - "{DATA}/.datacore/env/local.env"     # instance-local, wins, never synced
  - "{HOME}/.config/cos.env"             # sourced with `set -a` by every cos_*.sh
  - "/etc/datacored.env"                 # datacored.service EnvironmentFile
  - "{HOME}/.datacore/datacore.env"      # agents and assorted crons

external:
  - "{HOME}/.hermes/.env"                # hermes is a third-party app with its own config
