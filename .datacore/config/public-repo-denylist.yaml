# Public-Repo Content Denylist
#
# Forbidden path patterns that must NEVER appear on public repos in our orgs.
# Used by:
#   - .datacore/lib/audit_public_repos.py (post-hoc scanner, runs on heartbeat)
#   - .githooks/pre-push (pre-push guard, blocks the actual push)
#   - sync script (pre-commit guard, blocks the staging)
#
# Patterns are checked against repository file paths AND file contents.
# Matching is case-insensitive for content; case-sensitive (glob) for paths.
#
# Customer-specific patterns are loaded from an optional private file
# referenced by `private_patterns_file` below. That file must live outside
# any git repo to avoid re-leaking the names it protects against.

version: 2
last_updated: 2026-07-17

# The pre-push guard chain (.datacore/githooks/pre-push +
# .datacore/lib/pre_push_scan.py) additionally enforces a new-file gate:
# newly tracked paths under .datacore/ must match an allowed category
# (agents/, commands/, lib/, dips/, specs/, templates/, registry/, docs/,
# workflows/, hooks/, githooks/, config/, tests/, skills/, cos/*.example,
# modules/*/{agents,commands,lib,skills,templates,docs,tests,tools,specs}),
# and sensitive categories (state/, env/, secrets/, private/, cos/ non-example,
# modules/*/data/) are categorically rejected. Defaults live in the scanner;
# override here with `datacore_new_file_allow:` / `datacore_new_file_reject:`.
# CAUTION: these keys REPLACE the scanner defaults wholesale, they do not
# extend them. Setting one with a couple of entries silently drops every
# default allow — so add new allowed paths to DATACORE_NEW_FILE_ALLOW in
# .datacore/lib/pre_push_scan.py instead, unless you truly mean to replace.

# Optional path to a private patterns file. If it exists, its forbidden_paths
# and forbidden_content arrays are unioned with the public ones at runtime.
private_patterns_file: ~/.datacore/private/customer-denylist.yaml

# Public repos in our orgs that this denylist protects.
protected_repos:
  - plur-ai/plur
  # Datacore public skeleton + spec repos (added 2026-06-10 after the
  # state/nightshift near-leak — exec records carry task titles):
  - datacore-one/datacore
  - datacore-one/datacore-dips
  - datacore-one/datacore-org
  # Add more as needed: datafund/datacortex, datafund/Agent-Data-Exchange, etc.
  # Conservative: only repos we publish for end-users belong here.

# Path patterns that must not exist on protected_repos.
# Glob-style. Matches against full path inside the repo.
forbidden_paths:
  # Enterprise / customer-facing offer materials
  - "docs/enterprise/**"
  - "docs/architecture/plur-geo-tech-brief.md"
  - "docs/architecture/vertical-extensions.md"

  # Ops / private-only directory conventions
  - "**/private/**"
  - "**/confidential/**"
  - "**/internal/**"
  - "**/customer/**"

  # Machine state — execution records contain task titles + error strings
  - "**/.datacore/state/**"
  # Personal CoS config (2026-07-16 incident) — only *.example templates
  # are public. '*.yaml' deliberately does not match '*.yaml.example'.
  - ".datacore/cos/*.yaml"
  - "**/.datacore/cos/*.yaml"
  # Personal/team content must never reach the public skeleton repos
  - "**/org/*.org"
  - "notes/**"
  - "journal/**"
  - "**/0-inbox/**"

  # Backups + working copies that may contain secrets
  # NOTE: deliberately avoiding '**/secrets.*' / '**/credentials.*' globs —
  # they catch legitimate source files like 'secrets.ts' / 'credentials.test.ts'.
  # Prefer concrete extensions known to hold actual secrets.
  - "**/.env"
  - "**/.env.local"
  - "**/.env.production"
  - "**/.env.staging"
  - "**/secrets.json"
  - "**/secrets.yaml"
  - "**/secrets.yml"
  - "**/credentials.json"
  - "**/credentials.yaml"
  - "**/*-token.json"
  - "**/*-secrets.yaml"
  - "**/private-key.pem"
  - "**/id_rsa"
  - "**/id_ed25519"

# Content patterns that must not appear inside any file on protected_repos.
# Substring or regex search. Case-insensitive.
# Customer-specific content patterns live in private_patterns_file above.
forbidden_content:
  # Generic high-risk patterns — use realistic-secret regexes, not bare names,
  # so legitimate documentation and test code that mentions the env var name
  # in a comment or in usage docs is not flagged.
  - "BEGIN RSA PRIVATE KEY"
  - "BEGIN OPENSSH PRIVATE KEY"
  - "BEGIN PRIVATE KEY"
  - "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{40,}"   # actual Anthropic API key
  - "sk-proj-[A-Za-z0-9_-]{40,}"               # actual OpenAI project key
  - "sk-[A-Za-z0-9]{40,}"                      # actual OpenAI legacy key
  - "ghp_[A-Za-z0-9]{30,}"                     # actual GitHub PAT
  - "ghs_[A-Za-z0-9]{30,}"                     # actual GitHub server token
  - "gho_[A-Za-z0-9]{30,}"                     # actual GitHub OAuth token
  - "AIza[A-Za-z0-9_-]{30,}"                   # actual Google API key
  - "AKIA[A-Z0-9]{16}"                         # actual AWS access key ID

# Patterns that are warning-only (don't block, but log).
# Useful for things that COULD be confidential depending on context.
warning_patterns:
  paths:
    - "docs/customers/**"
    - "docs/proposals/**"
    - "docs/contracts/**"
  content:
    - "Confidential"
    - "Do not distribute"
    - "Internal use only"
    - "REV.[0-9]+"  # offer revision numbers

# Repos to allow these patterns on (private repos where customer materials belong)
allowed_repos:
  - plur-ai/enterprise
  - plur-ai/plur-space
  - plur-ai/website
  - plur-ai/hub

# Path patterns where content scanning is SKIPPED.
# Test files legitimately contain fake secrets as fixtures (e.g. testing a
# secret-detector by feeding it `BEGIN RSA PRIVATE KEY` markers).
# Path-pattern checks (forbidden_paths) still apply — only content scanning
# is skipped for these paths.
content_scan_exemptions:
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.test.py"
  - "**/*_test.py"
  - "**/test_*.py"
  - "**/spec/**"
  - "**/*.spec.ts"
  - "**/*.spec.js"
  - "**/fixtures/**"
  - "**/testdata/**"
  - "**/mocks/**"
  - "**/CHANGELOG.md"      # may quote historic API surface
  - "packages/core/lib/secret-detector.*"   # the detector itself describes its patterns
  # The policy chain itself quotes its own patterns — path rules still apply.
  - ".datacore/config/public-repo-denylist.yaml"
  - ".datacore/lib/pre_push_scan.py"
  - ".datacore/githooks/pre-push"
  - ".datacore/githooks/pre-commit"
  - ".datacore/hooks/pre-commit"
  - ".datacore/hooks/space-pre-commit"

