# Datacore: never restart scheduled one-shot jobs after a library upgrade.
# They are started fresh by their timers; restarting one mid-run kills it and
# fires its OnFailure alert (box, 2026-09-25 06:10: unattended-upgrades stopped a
# running fleet sync, which paged "FAILED" and then succeeded on the restart).
# Long-running daemons (datacored, gateways) are still restarted as usual.
$nrconf{override_rc}{qr(^datacore-fleet-sync\.service$)} = 0;
$nrconf{override_rc}{qr(^v2-verify\.service$)} = 0;
$nrconf{override_rc}{qr(^ledger-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^cos-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^nightshift-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^venture-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^alert@.*\.service$)} = 0;
