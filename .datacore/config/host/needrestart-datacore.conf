# Datacore: never restart scheduled one-shot jobs after a library upgrade.
# They are started fresh by their timers; restarting one mid-run kills it and
# fires its OnFailure alert (box, 2026-09-25 06:10: unattended-upgrades stopped a
# running fleet sync, which paged "FAILED" and then succeeded on the restart).
# Long-running daemons (datacored, gateways) are still restarted as usual.
$nrconf{override_rc}{qr(^datacore-fleet-sync\.service$)} = 0;
$nrconf{override_rc}{qr(^v2-verify\.service$)} = 0;
$nrconf{override_rc}{qr(^ledger-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^cos-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^nightshift-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^venture-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^alert@.*\.service$)} = 0;
$nrconf{override_rc}{qr(^datacore-agent-outbox\.service$)} = 0;
# Module timers (comms, trading): the same one-shot jobs, started by their timers.
$nrconf{override_rc}{qr(^engagement-.*\.service$)} = 0;
$nrconf{override_rc}{qr(^follow-(daily|review-weekly)\.service$)} = 0;
$nrconf{override_rc}{qr(^newsfeed-monitor\.service$)} = 0;
$nrconf{override_rc}{qr(^x-weekly-analysis\.service$)} = 0;
$nrconf{override_rc}{qr(^ohlcv-backfill\.service$)} = 0;
$nrconf{override_rc}{qr(^li2-analyst\.service$)} = 0;
# Scheduled jobs installed on the hosts outside the repo's own unit files (OPS-5,
# 2026-09-28): trading and research timers, maintenance, and each agent's heartbeat.
$nrconf{override_rc}{qr(^[a-z0-9]+-heartbeat\.service$)} = 0;
$nrconf{override_rc}{qr(^(trading-(health|backup|recon)|portfolio-manager|strategy-(sync|researcher)|pipeline-report)\.service$)} = 0;
$nrconf{override_rc}{qr(^(hmm-(paper-trader|retrain)|autoresearch-hmm|coinglass-scraper|li2-evidence)\.service$)} = 0;
$nrconf{override_rc}{qr(^datacore-(reindex|retention|workspace-gc)\.service$)} = 0;
$nrconf{override_rc}{qr(^(oauth-health-check|research-topics)\.service$)} = 0;
$nrconf{override_rc}{qr(^plur-(devto-drip|geo-scan)\.service$)} = 0;
