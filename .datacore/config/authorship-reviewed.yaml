# Commits the authorship check has flagged and a human has reviewed. Each entry
# is an incident on the record, not a pardon: the writer's principal, who
# actually committed, what happened, and what was done about it. The check
# skips a listed commit and keeps flagging everything else.
#
# THIS FILE SHIPS EMPTY. An installation's own reviewed commits go in the
# gitignored authorship-reviewed.local.yaml beside it, same shape; v2_verify.py
# reads both (INS-3: a fresh install carries no record of ours). Example:
#
#   reviewed:
#     - commit: 1a2b3c4d
#       space: 1-myteam
#       writer: agent-a
#       committed_as: owner
#       date: 2026-01-01
#       what: "What the check flagged, and why it happened."
#       action: "Who reviewed it, when, and what was fixed at the source."
version: 1
reviewed: []
