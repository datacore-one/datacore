# Tests that check an INSTALLATION, and what each one needs to run.
#
# WHY THIS FILE EXISTS. Some tests -- promise evals above all -- check this
# install, not the code: its principal registry, its fleet over ssh, a module
# that lives in its own repository, the PLUR CLI, a real agent session. A bare
# checkout has none of those. From 2026-09-24 the Gates check failed on every
# pull request (233 failures on #216), almost all of them tests like these, so a
# red Gates said nothing about the change it was attached to.
#
# HOW IT IS USED (lib/needs_gate.py, from .datacore/conftest.py). Each need is
# CHECKED on the machine running the tests. Where it is met -- a full install --
# the test is collected exactly as before. Where it is missing, the test is not
# collected, and the run's summary (and CI's step summary) lists every test left
# out and the need that was missing. PROMISE_EVALS_ALL=1, the promise scoreboard,
# collects everything regardless: the scoreboard stays the authority.
#
# WHAT MAY NOT GO HERE. A test that fails on a full install too is a red, not a
# missing need; listing it hides it only where the need is missing, which is why
# the needs must be things a bare checkout genuinely lacks.
# test_test_needs.py holds that line: every `file:` need must be a path the
# repository does not track, every `module:` need a module it does not contain.
#
# Needs (see lib/needs_gate.py):
#   module:<name>  file:<path or ~/path>  cli:<name>  python:<module>  fleet  agent
version: 1

