# Approvals policy (public, no secrets) -- Task 5.1: policy gate + co-sign.
#
# Read by ledger.policy.load_policy(). Governs which side-effecting
# task.create events require a human-recorded `approval.grant` event before
# they may be appended at all (see ledger/policy.py: guarded_append).
#
# `approver`       -- the actor whose approval.grant events count as valid
#                      grants under this policy.
# `cosign_effects` -- effect tags that make a task.create "side-effecting"
#                      and therefore gated. A task.create is gated iff its
#                      payload's `effects` list intersects this set.
# `known_effects`  -- (optional, final-review wave) the complete, closed
#                      vocabulary of valid effect tags a task.create may
#                      declare. Any effect NOT in this list is rejected
#                      outright by guarded_append (fail closed) -- this
#                      catches a typo'd effect (e.g. `emial.send`) that
#                      would otherwise silently bypass cosign by simply
#                      not matching any cosign_effects entry either.
#                      Defaults to cosign_effects when this key is absent.
#                      To allow a legitimate non-cosign effect, add it here
#                      explicitly (it stays usable without requiring a
#                      grant, since it's still absent from cosign_effects).
#
# This file ships with the defaults ledger.policy already falls back to
# when no policy file is present -- it exists so the policy is explicit and
# editable, not to change the out-of-the-box behavior.
version: 1
approver: human
cosign_effects:
  - email.send
  - payment
  - prod.deploy
  # MEM-02: irreversible steps wait for the owner's go, after a one-item
  # trial. A grant can release them; for agents the list below may not.
  - data.delete
  - bulk.change
  - push.shared
  # AGT-1: public speech is Data's lane; a message to the owner's chat waits
  # for a grant like an e-mail does.
  - public.post
  - message.send
  # MEM-17: a hosted page or shared link waits for the owner's go.
  - page.publish
known_effects:
  - email.send
  - payment
  - prod.deploy
  - data.delete
  - bulk.change
  - push.shared
  # never-effects of every agent (tool_effects.yaml; owner decisions
  # 2026-09-26: agents never spend money, touch trading, rotate credentials,
  # delete data, submit to authorities or merge on their own)
  - trading
  - credential.rotate
  - gov.submit
  - code.merge
  - secret.search
  - guard.disable
  - ledger.forge
  - calendar.respond
  - data.egress
  - history.rewrite
  - public.post
  - message.send
  - page.publish
  - eval.edit
  # 2026-09-30: an agent never hides or discards uncommitted work (git
  # stash/reset/checkout/restore/clean) -- it holds other writers' event logs
  - worktree.discard
  # AUD-2: any change but an audit's own findings file (only the auditor
  # principal is bound by it)
  - write

# Per-principal limits (product description, stage 4; DIP-0044 §7). Defaults
# when a principal is absent: agents get max_hops 3 and 50 creates a day,
# humans are unbounded (claim_gate.py). `never_effects` cannot be granted.
# `max_creates_per_day` is counted per principal PER SPACE (all of the
# principal's writer names, today UTC, in the space being written to): each
# space allows the full cap, so the fleet-wide ceiling is cap x spaces.
# Owner decision L6, 2026-09-23.
#
# AGENT_NEVER is what no agent may cause, whatever a task's grants say: money,
# trading, credentials, filings, merges (each space/project names its human
# merge gate, the owner by default -- AGT-5), secret searches, switching a
# guard off, writing another's log, answering an invite, data to an
# unapproved destination, rewriting shared history, editing a promise eval
# (MEM-30: the builder never edits its judge). Outward speech -- e-mail and
# public posts -- belongs to one agent's lane (AGT-1): never for the others, a
# grant for that one.
#
# THIS INSTALL'S OWN PRINCIPALS ARE NOT HERE. The file is tracked and a fresh
# install must name nothing of ours (INS-3), so the entries below are neutral
# examples. The install's people and agents, and its arbitration order, go in
# the gitignored approvals_policy.local.yaml beside this file: load_policy
# merges it over this one (an entry there replaces the one of the same name).
principals:
  owner: {}
  assistant:
    never_effects: [payment, trading, credential.rotate, gov.submit, code.merge,
                    secret.search, guard.disable, ledger.forge, calendar.respond,
                    data.egress, history.rewrite, eval.edit, email.send, public.post,
                    worktree.discard]
    may_delegate_to: []
  # The nightly cross-model audit (AUD-2, spec .datacore/specs/cross-model-audit.md):
  # whichever agent's model runs it, the audit only reads. It may write its own
  # findings file and nothing else, and it delegates nothing. cross_model_audit.py
  # sets DATACORE_POLICY_PRINCIPAL=auditor for the model turn.
  auditor:
    never_effects: [write, payment, prod.deploy, trading, credential.rotate, gov.submit, code.merge,
                    secret.search, guard.disable, ledger.forge, calendar.respond, data.egress,
                    history.rewrite, eval.edit, email.send, public.post, message.send, push.shared, page.publish,
                    data.delete, bulk.change, worktree.discard]
    may_delegate_to: []
    max_creates_per_day: 0

# Arbitration across principals (product description, stage 5). Earlier
# outranks later: a principal may close or release another principal's item
# only if it precedes the owner here; agents not listed cannot override each
# other at all. The client outranks everyone; the chief of staff outranks the
# agents. (Replaced by the local file's `arbitration` when it has one.)
arbitration: [owner, assistant]
