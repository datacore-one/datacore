# Findings the owner has seen and accepted, so a nightly audit stays quiet about
# them and loud about everything else. This is an allowlist, not a mute button:
# each entry matches one invariant, in one space, on the START of its detail, so
# a second bad event in the same log is still a NEW finding and still fails.
#
# Adding to this list is a decision. Removing from it is the fix.
#
# THIS FILE SHIPS EMPTY. An installation's own accepted findings go in the
# gitignored ledger-invariants-baseline.local.yaml beside it, same shape;
# ledger_invariants.py reads both (INS-3). Example:
#
#   accepted:
#     - invariant: hashes
#       space: myteam   # the space NAME, never its local folder number
#       detail_startswith: "agent-a seq 5"
#       accepted_on: 2026-01-01
#       why: >
#         What the finding is, and why fixing it is the owner's call.
version: 1
accepted: []
