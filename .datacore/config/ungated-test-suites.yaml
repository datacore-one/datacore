# Test directories that no CI job runs, each with the reason and the date the
# reason was last looked at.
#
# WHY THIS FILE EXISTS. CI used to name ~100 test FILES one per line in
# validate-pr.yml. Adding a test file gated nothing until somebody also edited
# that YAML, and nothing anywhere said otherwise -- so 421 of 531 test files ran
# in no automated gate, and the failures that collected in them were invisible
# until 2026-09-19: a stale assertion asking an undeclared writer to become its
# own policy principal, a manifest schema that had moved on without its tests,
# sixteen X-poster tests refused by a live kill switch, four more making real
# HTTP calls because they mocked an attribute that had been renamed.
#
# CI now names DIRECTORIES, so a new test file under one of them is gated the day
# it lands. This file covers the rest. test_ci_gate_coverage.py fails when a test
# directory is neither gated nor listed here, which turns "nobody runs this" from
# something you have to go looking for into something a PR tells you.
#
# Listing a directory here is a decision to accept the risk, not a way to silence
# the check. Each entry says what is not being protected.
version: 1

suites:
  # ---- Suites whose dependencies the CI runner does not install --------------
  # requirements-audit.txt covers the core. These need scientific or
  # service-specific stacks that would slow every PR to install, for code that
  # does not gate a merge.
