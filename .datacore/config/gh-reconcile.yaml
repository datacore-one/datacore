# gh-reconcile.yaml — space-to-GitHub-repo mapping
#
# Purpose: gh_reconcile.py uses this to resolve bare PR/issue references like
# "PR #774" or "app#504" found in task titles, without relying on the space's
# own git remote (which may point to a notes/space repo, not the code repo).
#
# THIS FILE SHIPS EMPTY. An installation's own mapping goes in the gitignored
# gh-reconcile.local.yaml beside it, same format; gh_reconcile.py reads both,
# the local one last so it wins (INS-3: a fresh install names no repo of ours).
#
# Format:
#   space_repos: primary code repo per space (resolves "PR #N", "app#N", etc.)
#   extra_repos: additional repos per space (resolves "REPONAME #N" patterns
#                such as "enterprise #389" cross-space refs)
#
# The script falls back to `git remote get-url origin` for unconfigured spaces.
#
# Example (in gh-reconcile.local.yaml): the myteam space's git remote is
# my-org/myteam-space (the notes repo), but its tasks track PRs/issues in
# my-org/app (the code repo). Without the override, "Merge PR #774" would
# resolve to myteam-space#774 (wrong) instead of my-org/app#774 (correct).
# Keys name the space (its config name, or its folder without the local number
# prefix, which differs per host); a legacy numbered key such as 1-myteam still works.
#
#   space_repos:
#     myteam: my-org/app
#
#   extra_repos:
#     myteam:
#       docs: my-org/docs

space_repos: {}

extra_repos: {}
