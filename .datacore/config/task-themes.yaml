# Coarse buckets that task_triage.py and roadmap_validate.py sort open tasks into.
# A task lands in the FIRST theme whose regex matches its heading (case-insensitive),
# so order matters; "unfiled" is a finding, not a failure.
#
# This is a neutral default. An install's own taxonomy goes in the gitignored
# task-themes.local.yaml beside this file, which replaces these tables:
#   themes:          used by task_triage (and roadmap_validate when roadmap_themes is absent)
#   roadmap_themes:  roadmap_validate's orphan clustering only
themes:
  "docs / content": "\\bdocs?\\b|readme|guide|blog|publish"
  "release / ci": "\\bci\\b|workflow|release|version|changelog"
  "security / trust": "security|vulnerab|secret|credential|permission"
  "bugs": "\\bbug|crash|regression|broken"
  "infra / ops": "backup|monitor|server|dns|deploy|systemd"
