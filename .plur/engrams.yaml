  statement: The Datacore desktop app is a Wails app — it ONLY runs as a native desktop window, not in a browser. To launch
    it in dev mode, run `wails dev` from the shell/ directory (which starts both daemon and frontend inside the Wails webview).
    Do NOT start the frontend with `npm run dev` and tell the user to open localhost:3000 — that doesn't work. The NEXT_PUBLIC_DATACORED_*
    env vars are for the Wails webview's internal Next.js, not for browser access.
