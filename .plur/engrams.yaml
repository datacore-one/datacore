  rationale: Engrams are immutable once created. The only correction path is retire + recreate. Forgetting to re-export the
    pack leaves stale IDs pointing to retired engrams.
  scope: project:datacore
  source_patterns:
  - 2026-03-03 engram pack refinement workflow
  statement: 'To fix a flawed engram statement, use the retire-and-replace workflow: (1) datacore_forget with the engram ID
    to retire the old engram, (2) datacore_learn to create a new engram with the corrected statement, (3) re-export the pack
    with datacore_packs_export using the new engram ID. Do not attempt to edit engrams in place. Always re-export packs after
    fixing constituent engrams, as pack files hold engram IDs that become stale after retirement.'
  status: active
  tags:
  - engrams
  - workflow
  - packs
  - maintenance
  type: procedural
  version: 1
