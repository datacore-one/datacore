  id: ENG-2026-0317-011
  knowledge_anchors: []
  pack: null
  polarity: null
  scope: project:datacore
  statement: 'Engram injection quality is the core bottleneck for memory-augmented agents. datacore.session.start injects
    engrams automatically but optimizes for general relevance. For factual queries ("what path does X use?"), relevant engrams
    may not surface because the semantic match is weak. Mitigation: (1) call datacore.inject mid-session with a targeted prompt,
    (2) ensure engrams use concrete domain tags, (3) keep engram statements specific and searchable rather than abstract.'
  status: active
