  - id: ENG-2026-0418-040
    version: 2
    status: active
    consolidated: false
    type: architectural
    scope: project:datacore
    visibility: public
    statement: >-
      SQLite UNIQUE constraints are the correct guard against row duplication on re-index. INSERT OR IGNORE without a
      UNIQUE constraint is a no-op — the IGNORE has nothing to trigger on. Always add UNIQUE indexes to tables that get
      re-populated by batch processes (links, tags, terms in knowledge.db).
    rationale: >-
      The knowledge.db grew from 100MB to 25GB because sync_to_root used INSERT OR IGNORE on tables without UNIQUE
      constraints. 5.3M duplicate links, 187M duplicate terms.
    derivation_count: 1
