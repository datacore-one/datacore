  domain: datacore.context
  dual_coding:
    analogy: CLAUDE.md is the operating manual. Engrams are the logbook. Don't write voyage entries in the manual.
    example: CLAUDE.md says 'engrams store learned preferences — call datacore.inject'. Engram says 'user prefers narrow tables
      ~60 chars'. The doc teaches the mechanic; the engram holds the fact.
  engram_version: 1
