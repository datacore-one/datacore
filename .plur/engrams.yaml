    statement: >-
      Match process overhead to feature scope. For contained features (~4-5 files, single module), use a three-phase
      flow: brainstorm (clarifying questions), design (data model + logic + integration approved incrementally), then
      implement directly. Skip formal spec doc gates -- the design conversation substitutes. Reserve spec docs and
      review gates for cross-module or architectural changes.
    rationale: >-
      Heavy process on small features wastes time and frustrates users. The prediction tracker session showed that
      brainstorm+design conversation provides sufficient rigor for contained work.
    contraindications:
      - Cross-module changes affecting multiple spaces
