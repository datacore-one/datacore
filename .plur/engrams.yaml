  - id: ENG-2026-0317-006
    version: 2
    status: active
    consolidated: false
    type: architectural
    scope: project:datacore
    visibility: public
    statement: >-
      Static CLAUDE.md content and dynamic engram memory compete for the same cognitive slot. When CLAUDE.md is too
      large and fact-dense, it drowns out engram recall — agents rely on static docs instead of querying memory. The
      fix: CLAUDE.md should teach HOW the system works (architecture, patterns, discovery methods), while engrams store
      WHAT was learned (preferences, corrections, patterns). Keep CLAUDE.md under ~150 lines at root level.
