  scope: project:datacore
  statement: When searching for org-mode tasks (tagged tasks, continuation tasks, AI tasks), use org_workspace.Query with
    structured methods (by_tag, by_state, by_property) instead of raw text grepping. Load the workspace with ws.load(full_path),
    then Query(ws).by_tag('continuation') finds all tagged tasks as structured objects. Raw grep on org files is unreliable
    — it silently misses matches due to glob issues, while org-workspace returns tasks with properties, tags, states, and
    scheduled dates parsed correctly.
