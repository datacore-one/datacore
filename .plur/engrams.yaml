  statement: 'The GTD module''s 11 MCP tools (inbox_count, add_task, list_next_actions, complete_task, agenda_view, deadline_warnings,
    archive_tasks, write_clock_entry, duplicate_check, project_health, effort_aggregate) are defined in .datacore/modules/gtd/module.yaml
    but NOT registered on any MCP server. They are phantom tools — documented in CLAUDE.md as datacore.gtd.* but not callable.
    The datacore MCP server only exposes datacore_search, datacore_capture, datacore_ingest, datacore_status, datacore_date,
    and datacore_modules_*. Until the GTD tools are wired into the MCP server, use the Python adapter CLI: python3 .datacore/lib/org_workspace_adapter.py
    [command]'
