    statement: >-
      NEVER modify org files via SSH on nightshift when running a local session. Org files (next_actions.org, inbox.org)
      live in the local ~/Data/ checkout. Use the local org_workspace_adapter.py with local paths. SSH is only for bot
      operations (systemctl, API calls, state files). Modifying org files on nightshift creates sync gaps — changes
      exist on server but not locally, appearing as silent failures.
    rationale: >-
      On 2026-04-22, continuation tasks were created via ssh nightshift but never appeared locally because the Meridian
      space wasn't synced back. User couldn't find the dashboard upgrade task in the next session.
