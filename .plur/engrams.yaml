  dual_coding:
    analogy: Constitution vs. case law. The constitution defines the system. Case law records what was decided. You don't
      amend the constitution every time you learn something — you log the precedent.
    example: 'Wrong: CLAUDE.md has ''user prefers narrow tables''. Right: engram has ''user prefers narrow tables ~60 chars'';
      CLAUDE.md says ''call datacore.inject for preferences''.'
