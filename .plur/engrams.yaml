  - id: ENG-2026-0313-007
    version: 1
    status: candidate
    consolidated: false
    type: architectural
    scope: project:datacore
    visibility: private
    statement: >-
      Split tools that need both computation and user interaction into two layers: a Skill (SKILL.md) for presentation,
      prompting, and formatting, and a pure Python scorer/calculator that reads state, calls data sources, and outputs
      JSON with no side effects. The scorer is independently testable and the skill is independently updatable. State
      mutations happen only in the skill step after user confirmation.
    rationale: >-
      Mixing computation with UX in a single layer makes both harder to test and debug. The split emerged from trading
      tools but applies to any tool combining data processing with interactive output.
    contraindications:
      - Trivial tools where the computation is a single API call with no logic
    source_patterns:
