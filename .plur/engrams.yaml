  scope: project:datacore
  statement: 'The content boundary principle: CLAUDE.md = HOW the system works (architecture, discovery patterns, conventions,
    pointers). Engrams = WHAT was learned (preferences, corrections, specific facts, paths). Never put user preferences, space-specific
    paths, or learned corrections in CLAUDE.md — they belong in engrams where they can be updated, rated, and evolved. Never
    put system architecture explanations in engrams — they belong in CLAUDE.md or DIPs.'
