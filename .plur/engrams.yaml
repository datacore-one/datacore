  rationale: Renumbering cascades through cross-references and makes git history harder to follow. Decimal steps are a low-friction
    way to extend workflows without coordination overhead.
  scope: project:datacore
  source_patterns:
  - patterns.md#step-n5-pattern
  statement: When inserting a new step between existing numbered steps in a skill or command, use decimal numbering (e.g.,
    "Step 5.5") rather than renumbering all subsequent steps. This avoids breaking references in other documents, makes the
    insertion point obvious in git diffs, and signals the step was added after initial design. Only renumber during a full
    skill redesign.
  status: candidate
