  scope: command:today
  statement: 'The /today briefing should NOT have a dedicated "What Data Did Overnight" section. Instead, overnight work is
    woven throughout: email triage results appear inline in agenda, GitHub triage appears in spaces, research outputs appear
    in the world section. The work done is present throughout, not reported separately. The goal is inbox zero across all
    inboxes (email, GitHub, org). Data processes automatically (archive, route to org, route to research) and only presents
    what needs user attention. Data should be proactive — identify needs and act in advance. Only suggest (don''t act) when
    sensitive or permission-needed.'
