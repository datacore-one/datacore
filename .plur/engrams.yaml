    accepted the invite, (2) Tentative/Unconfirmed — not yet responded, needs decision, (3) Self-blocked — recurring personal
    time blocks (like "Iva - ples"), show as background context not actionable meetings. Google Calendar API provides responseStatus
    (accepted/tentative/needsAction/declined) and event visibility (public/private/default). Use these to categorize.'
