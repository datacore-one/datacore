    statement: >-
      datacore-bench deterministic scoring (keyword matching, structural checks) misses qualitative differences that
      matter. An agent can score 80% by hitting all required sections while producing shallow, unhelpful content.
      LLM-as-judge evaluation is needed alongside deterministic scoring: run a judge model on each response and score
      against criteria like depth, actionability, and accuracy. Hybrid scoring = deterministic (structure/completeness)
      + LLM judge (quality/relevance).
