  statement: SQLite UNIQUE constraints are the correct guard against row duplication on re-index. INSERT OR IGNORE without
    a UNIQUE constraint is a no-op — the IGNORE has nothing to trigger on. Always add UNIQUE indexes to tables that get re-populated
    by batch processes (links, tags, terms in knowledge.db).
