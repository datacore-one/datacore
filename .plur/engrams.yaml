  statement: During /wrap-up, NEVER spawn journal-entry-writer or session-learning directly with a hardcoded space name. ALWAYS
    use journal-coordinator and session-learning-coordinator, which discover all spaces via ls -d [0-9]-*/. Hardcoding skips
