  - id: ENG-2026-0303-R04
    version: 1
    status: active
    consolidated: false
    type: procedural
    scope: project:datacore
    visibility: private
    statement: >-
      To fix a flawed engram statement, use the retire-and-replace workflow: (1) datacore_forget with the engram ID to
      retire the old engram, (2) datacore_learn to create a new engram with the corrected statement, (3) re-export the
      pack with datacore_packs_export using the new engram ID. Do not attempt to edit engrams in place. Always re-export
      packs after fixing constituent engrams, as pack files hold engram IDs that become stale after retirement.
    rationale: >-
      Engrams are immutable once created. The only correction path is retire + recreate. Forgetting to re-export the
      pack leaves stale IDs pointing to retired engrams.
    contraindications:
      - For engrams not in any pack, step 3 is unnecessary
    source_patterns:
      - 2026-03-03 engram pack refinement workflow
